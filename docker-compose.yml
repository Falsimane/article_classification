services:
  neo4j:
    build:
      context: .
      dockerfile: Dockerfile
    image: cti-neo4j:latest
    container_name: cti_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP) & Neosemantics RDF
      - "7687:7687"   # Bolt Protocol (Cypher / Python driver)
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password123}
      - NEO4J_PLUGINS=["apoc", "n10s"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,n10s.*,semantics.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,n10s.*,semantics.*
      - NEO4J_server_unmanaged__extension__classes=n10s.endpoint=/rdf
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      # Montage de l'ontologie CTI dans le dossier officiel /import
      - ./ontology:/import/ontology:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  neo4j_data:
    name: cti_neo4j_data
  neo4j_logs:
    name: cti_neo4j_logs
  neo4j_plugins:
    name: cti_neo4j_plugins
