[project]
name = "article-classification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Falsimane", email = "falsimagne.thomas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "json-repair>=0.64.0",
    "maturin>=1.15.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "cti-core",
    "neo4j>=6.4.1",
    "stix2>=3.0.2",
    "yara-python>=4.5.4",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
cti-core = { path = "backend/preprocessing/cleaning/cti_core", editable = true }

[project.scripts]
cti-classifier = "backend.preprocessing.classifying.cti_classifier:main"
cti-extract = "backend.extracting.cli:main"
cti-eval = "backend.evaluation.cti_eval:main"
cti-dashboard = "backend.dashboard.server:main"
cti-audit = "backend.preprocessing.classifying.audit_classifier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
