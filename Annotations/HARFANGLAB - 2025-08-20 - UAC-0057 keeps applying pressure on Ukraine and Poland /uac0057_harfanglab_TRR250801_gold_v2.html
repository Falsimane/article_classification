<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('review-data').textContent);
const TEXT = D.article.text;
const CTX = 220, CTX_MORE = 700;
const ENT = new Map(D.entities.map(e => [e.id, e]));
const REL = D.relations;
const REJ = D.rejected;
const ITEMS = new Map([...D.entities, ...REL, ...REJ].map(i => [i.id, i]));
const VERDICTS = {ok:{label:'Correct', icon:'✓'}, fix:{label:'À corriger', icon:'~'}, ko:{label:'Non justifié', icon:'✗'}};
const REJ_VERDICTS = {ok:{label:'Rejet confirmé', icon:'✓'}, fix:{label:'À intégrer au gold', icon:'+'}};
const QSTATUS = {normalized:'normalisée', fuzzy:'approximative'};
const TYPE_ORDER = ['intrusion-set','threat-actor','campaign','incident','malware','tool','infrastructure','attack-pattern','location','identity'];
const ICON = {error:'●', warn:'▲', info:'i'};

/* ---------- Stockage ---------- */
const KEY = 'stix-review:' + D.meta.key;
let S = {verdicts:{}, reviewer:''};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function verdictOf(id){ return (S.verdicts[id] || {}).v || 'pending'; }

/* ---------- Utilitaires ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeKey = t => ['campaign','intrusion-set','threat-actor','malware','tool','attack-pattern','location','identity'].includes(t) ? t : 'other';
const typeOf = id => (ENT.get(id) || {}).type || 'absent';
const nameOf = id => { const e = ENT.get(id); return e ? (e.ext_id ? e.ext_id + ' ' : '') + e.name : id; };
const typeRank = t => { const i = TYPE_ORDER.indexOf(t); return i < 0 ? 99 : i; };
const hasAlert = it => it.flags.some(f => f.level !== 'info');
const byId = id => document.querySelector('[data-card="' + CSS.escape(id) + '"]');

function chip(id, small){
  const e = ENT.get(id);
  if (!e) return `<span class="node t-missing${small?' sm':''}"><span class="ntype">référence absente</span><span class="nname">${esc(id)}</span></span>`;
  const sub = !small && e.type === 'attack-pattern' && e.tactics.length ? `<span class="nsub">${esc(e.tactics.join(' · '))}</span>` : '';
  return `<span class="node t-${typeKey(e.type)}${small?' sm':''}" title="${esc(e.type + ' · ' + e.id)}"><span class="ntype">${esc(e.ext_id || e.type)}</span><span class="nname">${esc(e.name)}</span>${sub}</span>`;
}
function labelBadge(l){
  if (!l) return '<span class="lbl lbl-none">sans label</span>';
  const k = l.replace('gold:', '');
  return `<span class="lbl lbl-${k==='required'?'req':k==='acceptable'?'acc':'other'}">${esc(k)}</span>`;
}
function flagsHtml(flags){
  if (!flags.length) return '';
  return '<ul class="flags">' + flags.map(f => `<li class="flag f-${f.level}"><span aria-hidden="true">${ICON[f.level]}</span><div>${esc(f.msg)}</div></li>`).join('') + '</ul>';
}
function tripletHtml(r, small){
  return `${chip(r.source_ref, small)}<span class="edge"><span class="ln"></span>${esc(r.relationship_type)}<span aria-hidden="true">→</span></span>${chip(r.target_ref, small)}`;
}

/* ---------- Citations en contexte ---------- */
function quotesHtml(item){
  if (!item.quotes || !item.quotes.length) return '<div class="quote"><div class="ctx-missing">Aucune citation fournie.</div></div>';
  return item.quotes.map((q, qi) => `<div class="quote" data-item="${esc(item.id)}" data-q="${qi}" data-o="0" data-r="${CTX}">${quoteInner(item, qi, 0, CTX)}</div>`).join('');
}
function quoteInner(item, qi, oi, radius){
  const q = item.quotes[qi], a = q.anchor;
  if (!a.occurrences.length){
    let h = `<div class="ctx-missing"><div class="qraw">« ${esc(q.text)} »</div><div class="cand">Introuvable dans l'article.</div>`;
    if (a.candidate) h += `<div class="cand">Passage le plus proche (${Math.round(a.score*100)} %) : « ${esc(a.candidate)} »</div>`;
    return h + '</div>';
  }
  const o = a.occurrences[oi];
  let s = Math.max(0, o.start - radius), e = Math.min(TEXT.length, o.end + radius);
  if (s > 0){ const sp = TEXT.indexOf(' ', s); if (sp > -1 && sp < o.start) s = sp + 1; }
  if (e < TEXT.length){ const sp = TEXT.lastIndexOf(' ', e); if (sp > o.end) e = sp; }
  const tight = t => esc(t.replace(/\n\s*\n[\s\n]*/g, '\n\n'));
  const ctx = (s > 0 ? '… ' : '') + tight(TEXT.slice(s, o.start)) + '<mark>' + esc(TEXT.slice(o.start, o.end)) + '</mark>' + tight(TEXT.slice(o.end, e)) + (e < TEXT.length ? ' …' : '');
  const n = a.occurrences.length;
  const nav = n > 1 ? `<span class="occ"><button type="button" class="mini" data-act="occ" data-d="-1" ${oi===0?'disabled':''} aria-label="Occurrence précédente">‹</button>occurrence ${oi+1}/${n}<button type="button" class="mini" data-act="occ" data-d="1" ${oi===n-1?'disabled':''} aria-label="Occurrence suivante">›</button></span>` : '';
  const st = QSTATUS[a.status] ? `<span class="qstatus qs-${a.status}">citation ${QSTATUS[a.status]}${a.status==='fuzzy' ? ' ' + Math.round(a.score*100) + ' %' : ''}</span>` : '';
  return `<blockquote class="ctx">${ctx}</blockquote>
    <div class="where"><span class="sec">§ ${esc(o.section.join(' › ') || 'Début de l’article')}</span>${nav}${st}
      <span class="actions"><button type="button" class="mini" data-act="more">${radius > CTX ? 'Moins de contexte' : 'Plus de contexte'}</button><button type="button" class="mini" data-act="goto">Voir dans l’article</button></span></div>`;
}

/* ---------- Verdicts ---------- */
function verdictHtml(item){
  const V = item.kind === 'rejected' ? REJ_VERDICTS : VERDICTS;
  const cur = S.verdicts[item.id] || {};
  const btns = Object.entries(V).map(([k, v]) => `<button type="button" class="vbtn vb-${k}${cur.v===k?' on':''}" data-act="verdict" data-v="${k}" aria-pressed="${cur.v===k}">${v.icon} ${v.label}</button>`).join('');
  const stale = cur.v && cur.fp && cur.fp !== item.fp ? '<div class="stale">▲ L’objet a changé depuis ce verdict : à revérifier.</div>' : '';
  return `<div class="verdict">${stale}<div class="vbtns" role="group" aria-label="Verdict">${btns}</div><textarea class="vcomment" rows="1" data-act="comment" placeholder="Commentaire : autre cible, autre label, citation à allonger…">${esc(cur.c || '')}</textarea></div>`;
}
function setVerdict(id, v){
  const item = ITEMS.get(id); if (!item) return;
  const cur = S.verdicts[id] || {};
  if (cur.v === v) delete cur.v; else { cur.v = v; cur.fp = item.fp; }
  cur.t = new Date().toISOString();
  S.verdicts[id] = cur; save();
  document.querySelectorAll('[data-card="' + CSS.escape(id) + '"]').forEach(card => {
    card.classList.remove('v-ok','v-fix','v-ko','v-pending'); card.classList.add('v-' + (cur.v || 'pending'));
    card.querySelectorAll('.vbtn').forEach(b => { const on = b.dataset.v === cur.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const st = card.querySelector('.stale'); if (st) st.remove();
  });
  renderProgress();
  if (state.tab === 'matrix') renderMatrix();
}

/* ---------- Cartes ---------- */
function extraHtml(extra){
  const keys = Object.keys(extra || {});
  if (!keys.length) return '';
  return '<div class="extra">' + keys.map(k => esc(k) + ' : ' + esc(typeof extra[k] === 'string' ? extra[k] : JSON.stringify(extra[k]))).join('<br>') + '</div>';
}
function mitreHtml(id){
  const e = ENT.get(id), a = e && e.attack;
  if (!a || !a.description) return '';
  const paras = a.description.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const more = paras.length > 1 ? `<details><summary>Lire la suite (${paras.length - 1} paragraphe${paras.length > 2 ? 's' : ''})</summary>${paras.slice(1).map(p => `<p>${esc(p)}</p>`).join('')}</details>` : '';
  const link = a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">attack.mitre.org ↗</a>` : '';
  return `<div class="mitre"><div class="mitre-head"><span>Définition MITRE · ${esc(e.ext_id)} ${esc(a.official)}</span>${link}</div><p>${esc(paras[0])}</p>${more}</div>`;
}
function relCard(r){
  return `<article class="card v-${verdictOf(r.id)}" data-card="${esc(r.id)}" tabindex="-1">
    <div class="triplet">${tripletHtml(r)}<span class="spacer"></span>${r.confidence != null ? `<span class="conf">confidence ${esc(r.confidence)}</span>` : ''}${labelBadge(r.label)}</div>
    ${typeOf(r.target_ref) === 'attack-pattern' ? mitreHtml(r.target_ref) : ''}
    ${flagsHtml(r.flags)}${quotesHtml(r)}
    ${r.justification ? `<p class="just"><strong>Contexte</strong>${esc(r.justification)}</p>` : ''}
    ${extraHtml(r.extra)}${verdictHtml(r)}</article>`;
}
function seqHtml(seq){
  if (!seq || !seq.length) return '';
  const li = seq.map(s => `<li><div>${esc(s.summary || '')}${s.concurrent ? ' <em>(concurrent)</em>' : ''}</div><div>${(s.techniques||[]).map(t => `<span class="tid">${esc(t)}</span>`).join('')}${(s.techniques_acceptable||[]).map(t => `<span class="tid acc" title="acceptable">${esc(t)}</span>`).join('')}</div></li>`).join('');
  return `<details class="seq"><summary>Séquence x_gold_sequence (${seq.length} étapes)</summary><ol>${li}</ol></details>`;
}
function entCard(e){
  const a = e.attack ? `<div class="attack a-${e.attack.status}"><span aria-hidden="true">${e.attack.status==='ok'?'✓':e.attack.status==='unchecked'?'?':'▲'}</span>${esc(e.attack.msg)}</div>` : '';
  return `<article class="card v-${verdictOf(e.id)}" data-card="${esc(e.id)}" tabindex="-1">
    <div class="ent-head">${chip(e.id)}<span class="spacer"></span>${labelBadge(e.label)}</div>
    ${a}${mitreHtml(e.id)}
    ${e.aliases.length ? `<div class="meta-line">Alias / variantes : ${esc(e.aliases.join(', '))}</div>` : ''}
    ${e.description ? `<p class="desc">${esc(e.description)}</p>` : ''}
    ${flagsHtml(e.flags)}${quotesHtml(e)}${seqHtml(e.sequence)}${extraHtml(e.extra)}
    <div class="meta-line"><button type="button" class="mini" data-act="ent-rels" data-id="${esc(e.id)}">Voir ses ${e.rel_count} relation${e.rel_count>1?'s':''}</button></div>
    ${verdictHtml(e)}</article>`;
}
function rejCard(r){
  return `<article class="card v-${verdictOf(r.id)}" data-card="${esc(r.id)}" tabindex="-1">
    <div class="triplet"><span class="node t-missing"><span class="ntype">candidat rejeté</span><span class="nname">${esc(r.candidat)}</span></span></div>
    <p class="just"><strong>Raison</strong>${esc(r.raison)}</p>${flagsHtml(r.flags)}${verdictHtml(r)}</article>`;
}

/* ---------- État, filtres ---------- */
const state = {tab:'relations', only:null, onlyLabel:''};
const F = {q:'', entity:'', rtype:'', ttype:'', label:'', status:'', sort:'alerts', alerts:false};
const $ = id => document.getElementById(id);

function fillSelect(sel, values, allLabel){
  sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
}
function setupFilters(){
  const ents = [...D.entities].sort((a, b) => typeRank(a.type) - typeRank(b.type) || (a.ext_id||a.name).localeCompare(b.ext_id||b.name));
  fillSelect($('f-entity'), ents.map(e => [e.id, (e.ext_id ? e.ext_id + ' ' : '') + e.name + ' (' + e.type + ')']), 'Toutes');
  fillSelect($('f-rtype'), [...new Set(REL.map(r => r.relationship_type))].sort().map(t => [t, t]), 'Tous');
  [['f-q','q','input'],['f-entity','entity','change'],['f-rtype','rtype','change'],['f-ttype','ttype','change'],['f-label','label','change'],['f-status','status','change'],['f-sort','sort','change']]
    .forEach(([id, k, ev]) => $(id).addEventListener(ev, () => { F[k] = k === 'q' ? $(id).value.trim().toLowerCase() : $(id).value; clearOnly(); renderTab(); }));
  $('f-alerts').addEventListener('change', () => { F.alerts = $('f-alerts').checked; clearOnly(); renderTab(); });
  $('f-reset').addEventListener('click', resetFilters);
  $('f-toggle').addEventListener('click', () => { const o = $('filters').classList.toggle('open'); $('f-toggle').setAttribute('aria-expanded', o); measure(); });
}
function resetFilters(){
  Object.assign(F, {q:'', entity:'', rtype:'', ttype:'', label:'', status:'', alerts:false});
  ['f-q','f-entity','f-rtype','f-ttype','f-label','f-status'].forEach(id => $(id).value = '');
  $('f-alerts').checked = false; clearOnly(); renderTab();
}
function syncTypeFilter(){
  const isRel = state.tab === 'relations';
  $('f-ttype-lab').textContent = isRel ? 'Type de cible' : 'Type d’entité';
  const types = isRel ? REL.map(r => typeOf(r.target_ref)) : D.entities.map(e => e.type);
  const cur = F.ttype;
  fillSelect($('f-ttype'), [...new Set(types)].sort((a,b) => typeRank(a)-typeRank(b)).map(t => [t, t]), 'Tous');
  $('f-ttype').value = types.includes(cur) ? cur : ''; F.ttype = $('f-ttype').value;
  document.querySelectorAll('[data-only="relations"]').forEach(el => el.style.display = isRel ? '' : 'none');
}
function clearOnly(){ state.only = null; state.onlyLabel = ''; }
function textOf(it){
  const parts = it.kind === 'relation' ? [nameOf(it.source_ref), it.relationship_type, nameOf(it.target_ref), it.justification]
    : [it.ext_id, it.name, it.type, (it.aliases||[]).join(' '), it.description];
  return (parts.join(' ') + ' ' + (it.quotes||[]).map(q => q.text).join(' ')).toLowerCase();
}
function common(it){
  if (F.label && it.label !== F.label) return false;
  if (F.status && verdictOf(it.id) !== F.status) return false;
  if (F.alerts && !hasAlert(it)) return false;
  if (F.q && !textOf(it).includes(F.q)) return false;
  return true;
}
function relVisible(r){
  if (state.only) return state.only.includes(r.id);
  if (F.entity && r.source_ref !== F.entity && r.target_ref !== F.entity) return false;
  if (F.rtype && r.relationship_type !== F.rtype) return false;
  if (F.ttype && typeOf(r.target_ref) !== F.ttype) return false;
  return common(r);
}
function entVisible(e){
  if (state.only) return state.only.includes(e.id);
  if (F.entity && e.id !== F.entity) return false;
  if (F.ttype && e.type !== F.ttype) return false;
  return common(e);
}

/* ---------- Rendu des onglets ---------- */
const TABS = [['relations','Triplets', () => REL.length], ['entities','Entités', () => D.entities.length], ['matrix','Matrice', null], ['article','Article', null]];
if (REJ.length) TABS.push(['rejected','Candidats rejetés', () => REJ.length]);
function renderTabs(){
  $('tabs').innerHTML = TABS.map(([k, l, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${l}${n ? `<span class="n">${n()}</span>` : ''}</button>`).join('');
}
function setTab(k){
  state.tab = k; renderTabs();
  $('layout').classList.toggle('full', !['relations','entities'].includes(k));
  if (k !== 'article') $('panel').hidden = true;
  syncTypeFilter(); renderTab(); window.scrollTo({top:0});
}
function focusBar(){
  return state.only ? `<div class="focusbar"><span>Affichage limité : ${esc(state.onlyLabel)}</span><button type="button" class="mini" data-act="clear-only">Tout afficher</button></div>` : '';
}
function globalHtml(){
  if (!D.global_flags.length) return '';
  return `<section class="global"><h2>Contrôles globaux du bundle</h2>${flagsHtml(D.global_flags)}</section>`;
}
function sortItems(list, kind){
  const sev = (a, b) => b.severity - a.severity;
  if (F.sort === 'bundle') return list;
  if (kind === 'relation'){
    const src = (a, b) => typeRank(typeOf(a.source_ref)) - typeRank(typeOf(b.source_ref)) || nameOf(a.source_ref).localeCompare(nameOf(b.source_ref));
    const tgt = (a, b) => typeRank(typeOf(a.target_ref)) - typeRank(typeOf(b.target_ref)) || nameOf(a.target_ref).localeCompare(nameOf(b.target_ref));
    if (F.sort === 'source') return list.sort((a, b) => src(a, b) || tgt(a, b));
    if (F.sort === 'target') return list.sort((a, b) => tgt(a, b) || src(a, b));
    return list.sort((a, b) => sev(a, b) || src(a, b) || tgt(a, b));
  }
  const nm = (a, b) => typeRank(a.type) - typeRank(b.type) || (a.ext_id||a.name).localeCompare(b.ext_id||b.name);
  return list.sort((a, b) => F.sort === 'alerts' ? (sev(a, b) || nm(a, b)) : nm(a, b));
}
function renderRelations(){
  const list = sortItems(REL.filter(relVisible), 'relation');
  let html = globalHtml() + focusBar() + `<div class="listhead"><span>${list.length} / ${REL.length} relations affichées</span></div>`;
  if (!list.length) return html + '<div class="empty">Aucune relation ne correspond aux filtres.</div>';
  const groupKey = F.sort === 'source' ? r => r.source_ref : F.sort === 'target' ? r => r.target_ref : null;
  let last = null;
  for (const r of list){
    if (groupKey && groupKey(r) !== last){ last = groupKey(r); html += `<h3 class="group">${chip(last, true)}</h3>`; }
    html += relCard(r);
  }
  return html;
}
function renderEntities(){
  const list = sortItems(D.entities.filter(entVisible), 'entity');
  let html = focusBar() + `<div class="listhead"><span>${list.length} / ${D.entities.length} entités affichées</span></div>`;
  if (!list.length) return html + '<div class="empty">Aucune entité ne correspond aux filtres.</div>';
  let last = null;
  for (const e of list){
    if (F.sort !== 'alerts' && e.type !== last){ last = e.type; html += `<h3 class="group">${esc(e.type)}</h3>`; }
    html += entCard(e);
  }
  return html;
}
function renderRejected(){
  return `<div class="listhead"><span>${REJ.length} candidats envisagés puis écartés à l’annotation. Confirmez le rejet ou demandez l’intégration au gold.</span></div>` + REJ.map(rejCard).join('');
}
function renderMatrix(){
  const uses = REL.filter(r => typeOf(r.target_ref) === 'attack-pattern');
  if (!uses.length){ $('main').innerHTML = '<div class="empty">Aucune relation vers un attack-pattern.</div>'; return; }
  const srcs = [...new Set(uses.map(r => r.source_ref))].sort((a, b) => typeRank(typeOf(a)) - typeRank(typeOf(b)) || nameOf(a).localeCompare(nameOf(b)));
  const aps = [...new Set(uses.map(r => r.target_ref))].sort((a, b) => nameOf(a).localeCompare(nameOf(b), undefined, {numeric:true}));
  const cell = new Map(uses.map(r => [r.source_ref + '|' + r.target_ref, r]));
  const head = `<tr><th class="rowh">Technique</th>${srcs.map(s => `<th>${chip(s, true)}</th>`).join('')}<th>Sources</th></tr>`;
  const rows = aps.map(ap => {
    const e = ENT.get(ap) || {name: ap, tactics: []};
    let n = 0;
    const tds = srcs.map(s => {
      const r = cell.get(s + '|' + ap); if (!r) return '<td></td>';
      n++;
      const v = verdictOf(r.id), lab = r.label === 'gold:required' ? 'req' : 'acc';
      const vm = v === 'pending' ? '' : `<span class="vm ${v}">${VERDICTS[v].icon}</span>`;
      const tip = nameOf(s) + ' → ' + nameOf(ap) + '\n' + (r.quotes[0] ? '« ' + r.quotes[0].text + ' »' : 'sans citation');
      return `<td><button type="button" class="cell${hasAlert(r) ? ' al' : ''}" data-act="focus" data-ids="${esc(r.id)}" title="${esc(tip)}"><span class="b ${lab}">${lab === 'req' ? 'R' : 'A'}</span>${vm}</button></td>`;
    }).join('');
    const tip = e.attack && e.attack.description ? e.attack.description.split(/\n\s*\n/)[0] : '';
    return `<tr><th class="rowh" title="${esc(tip)}"><span class="ntype" style="font:600 11px var(--mono);color:var(--c-attack-pattern)">${esc(e.ext_id || '')}</span><span class="tname">${esc(e.name)}</span><span class="ttac">${esc((e.tactics||[]).join(' · '))}</span></th>${tds}<td>${n}</td></tr>`;
  }).join('');
  $('main').innerHTML = `<div class="legend"><span><span class="cell"><span class="b req">R</span></span> required</span><span><span class="cell"><span class="b acc">A</span></span> acceptable</span><span><span class="cell al"><span class="b req">R</span></span> relation avec alerte</span><span><b class="vm ok">✓</b> <b class="vm fix">~</b> <b class="vm ko">✗</b> verdict</span><span>Cliquer une case ouvre la relation.</span></div>
    <div class="matrix-wrap"><table class="matrix"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- Article annoté ---------- */
let ARTICLE_HTML = null; const ANCHOR = new Map();
function buildArticle(){
  const iv = [];
  for (const it of [...D.entities, ...REL]) (it.quotes || []).forEach((q, qi) => q.anchor.occurrences.forEach((o, oi) => iv.push({s:o.start, e:o.end, id:it.id, key:it.id + '|' + qi + '|' + oi})));
  iv.forEach((v, i) => ANCHOR.set(v.key, i));
  const pts = [...new Set(iv.flatMap(v => [v.s, v.e]))].sort((a, b) => a - b);
  const startsAt = new Map(); iv.forEach((v, i) => { if (!startsAt.has(v.s)) startsAt.set(v.s, []); startsAt.get(v.s).push(i); });
  let html = '', ls = 0;
  for (const line of TEXT.split('\n')){
    const le = ls + line.length;
    const m = /^(#{1,6})\s/.exec(line);
    const cls = m ? 'l h' + m[1].length : (/^\*\*[^*]+\*\*\s*$/.test(line) ? 'l hb' : 'l');
    const cuts = [ls, ...pts.filter(p => p > ls && p < le), le];
    let inner = '';
    for (let k = 0; k < cuts.length - 1; k++){
      const a = cuts[k], b = cuts[k + 1];
      (startsAt.get(a) || []).forEach(i => inner += `<span id="anc-${i}"></span>`);
      if (a === b) continue;
      const seg = esc(TEXT.slice(a, b));
      const cover = []; iv.forEach((v, i) => { if (v.s <= a && v.e >= b) cover.push(i); });
      const ids = [...new Set(cover.map(i => iv[i].id))];
      inner += ids.length ? `<mark class="am${ids.length > 1 ? ' multi' : ''}" data-ids="${esc(ids.join(' '))}" data-k="${cover.join(' ')}">${seg}</mark>` : seg;
    }
    html += `<div class="${cls}">${inner}</div>`;
    ls = le + 1;
  }
  ARTICLE_HTML = html;
}
function renderArticle(){
  if (ARTICLE_HTML === null) buildArticle();
  $('main').innerHTML = `<div class="legend"><span><mark class="am">passage cité</mark> par un objet</span><span><mark class="am multi">passage cité</mark> par plusieurs objets</span><span>Cliquer un passage liste les objets qui le citent.</span></div><div class="article">${ARTICLE_HTML}</div>`;
}
function showPanel(ids){
  const items = ids.map(id => ITEMS.get(id)).filter(Boolean);
  const body = items.map(it => `<div class="pi"><div class="triplet">${it.kind === 'relation' ? tripletHtml(it, true) : chip(it.id, true)}<span class="spacer"></span>${labelBadge(it.label)}</div><div><button type="button" class="mini" data-act="focus" data-ids="${esc(it.id)}">Ouvrir dans la revue</button></div></div>`).join('');
  const p = $('panel');
  p.innerHTML = `<h2><span>${items.length} objet${items.length>1?'s':''} citant ce passage</span><button type="button" class="mini" data-act="close-panel" aria-label="Fermer">✕</button></h2>${body}`;
  p.hidden = false;
}
function gotoAnchor(itemId, qi, oi){
  setTab('article');
  const i = ANCHOR.get(itemId + '|' + qi + '|' + oi);
  const el = i != null && document.getElementById('anc-' + i);
  if (!el) return;
  // Surligne les segments de cette occurrence précise.
  const k = String(i);
  document.querySelectorAll('.article mark.am').forEach(m => m.classList.toggle('hot', m.dataset.k.split(' ').includes(k)));
  el.scrollIntoView({block:'center'});
  showPanel([itemId]);
}

function focusItems(ids, label){
  const first = ITEMS.get(ids[0]); if (!first) return;
  const tab = first.kind === 'relation' ? 'relations' : first.kind === 'rejected' ? 'rejected' : 'entities';
  state.only = ids; state.onlyLabel = label || (ids.length === 1 ? (first.kind === 'relation' ? nameOf(first.source_ref) + ' → ' + nameOf(first.target_ref) : nameOf(first.id)) : ids.length + ' objets');
  setTab(tab);
  const card = byId(ids[0]); if (card){ setCur(card); card.classList.add('flash'); }
}
function renderTab(){
  const t = state.tab;
  if (t === 'relations') $('main').innerHTML = renderRelations();
  else if (t === 'entities') $('main').innerHTML = renderEntities();
  else if (t === 'rejected') $('main').innerHTML = renderRejected();
  else if (t === 'matrix') renderMatrix();
  else if (t === 'article') renderArticle();
  autosize();
}
function autosize(){ document.querySelectorAll('.vcomment').forEach(t => { t.style.height = 'auto'; t.style.height = Math.max(34, t.scrollHeight + 2) + 'px'; }); }

/* ---------- En-tête : titre, statistiques, progression ---------- */
function renderHeader(){
  const m = D.meta;
  $('r-title').innerHTML = m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">${esc(m.report_name)} ↗</a>` : esc(m.report_name);
  $('r-files').textContent = `${m.bundle_file} · ${m.article_file} · ATT&CK ${m.attack_version || 'non chargé'}${m.declared_attack_version ? ' (déclaré : ' + m.declared_attack_version + ')' : ''} · généré le ${m.generated}`;
  const all = [...D.entities, ...REL];
  const cnt = lvl => all.reduce((n, it) => n + (it.flags.some(f => f.level === lvl) ? 1 : 0), 0);
  const req = REL.filter(r => r.label === 'gold:required').length, acc = REL.filter(r => r.label === 'gold:acceptable').length;
  $('stats').innerHTML = `<span class="stat"><b>${D.entities.length}</b> entités</span><span class="stat"><b>${REL.length}</b> relations</span><span class="stat"><b>${req}</b> required</span><span class="stat"><b>${acc}</b> acceptable</span>
    <button type="button" class="stat s-error" data-act="alerts" title="Objets avec au moins une erreur"><b>${cnt('error')}</b> en erreur</button>
    <button type="button" class="stat s-warn" data-act="alerts" title="Objets avec au moins un avertissement"><b>${cnt('warn')}</b> avec avertissement</button>`;
  $('reviewer').value = S.reviewer || '';
  renderProgress();
}
function renderProgress(){
  const ids = [...ITEMS.keys()], tot = ids.length;
  const c = {ok:0, fix:0, ko:0}; ids.forEach(id => { const v = verdictOf(id); if (c[v] != null) c[v]++; });
  const done = c.ok + c.fix + c.ko;
  $('bar').innerHTML = ['ok','fix','ko'].map(k => `<span class="p-${k}" style="width:${tot ? c[k]/tot*100 : 0}%"></span>`).join('');
  $('progress-txt').textContent = `${done}/${tot} revus · ${c.ok} correct · ${c.fix} à corriger · ${c.ko} non justifiés`;
}

/* ---------- Navigation clavier ---------- */
function setCur(card){
  document.querySelectorAll('.card.cur').forEach(c => c.classList.remove('cur'));
  card.classList.add('cur'); card.focus({preventScroll:true}); card.scrollIntoView({block:'nearest'});
}
document.addEventListener('keydown', e => {
  const tg = e.target;
  if (tg.matches && tg.matches('input, textarea, select')){ if (e.key === 'Escape') tg.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const cards = [...document.querySelectorAll('#main .card')];
  if (!cards.length) return;
  let i = cards.indexOf(document.querySelector('#main .card.cur'));
  if (e.key === 'j' || e.key === 'k'){
    i = e.key === 'j' ? Math.min(cards.length - 1, i + 1) : Math.max(0, i - 1);
    setCur(cards[i]); e.preventDefault();
  } else if (['1','2','3'].includes(e.key) && i > -1){
    const it = ITEMS.get(cards[i].dataset.card);
    const k = Object.keys(it.kind === 'rejected' ? REJ_VERDICTS : VERDICTS)[+e.key - 1];
    if (k) setVerdict(it.id, k);
  } else if (e.key === 'c' && i > -1){
    const t = cards[i].querySelector('textarea'); if (t){ t.focus(); e.preventDefault(); }
  }
});

/* ---------- Événements ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]'); if (tab){ clearOnly(); setTab(tab.dataset.tab); return; }
  const mk = e.target.closest('.article mark.am'); if (mk){ showPanel(mk.dataset.ids.split(' ')); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, card = b.closest('[data-card]');
  if (act === 'verdict') setVerdict(card.dataset.card, b.dataset.v);
  else if (act === 'occ' || act === 'more' || act === 'goto'){
    const box = b.closest('.quote'), item = ITEMS.get(box.dataset.item), qi = +box.dataset.q;
    let oi = +box.dataset.o, r = +box.dataset.r;
    if (act === 'goto'){ gotoAnchor(item.id, qi, oi); return; }
    if (act === 'occ') oi = Math.max(0, Math.min(item.quotes[qi].anchor.occurrences.length - 1, oi + +b.dataset.d));
    else r = r > CTX ? CTX : CTX_MORE;
    box.dataset.o = oi; box.dataset.r = r; box.innerHTML = quoteInner(item, qi, oi, r);
  }
  else if (act === 'focus') focusItems(b.dataset.ids.split(' '));
  else if (act === 'ent-rels'){ const id = b.dataset.id; focusItems(REL.filter(r => r.source_ref === id || r.target_ref === id).map(r => r.id), 'relations de ' + nameOf(id)); }
  else if (act === 'clear-only'){ clearOnly(); renderTab(); }
  else if (act === 'close-panel'){ $('panel').hidden = true; document.querySelectorAll('mark.am.hot').forEach(m => m.classList.remove('hot')); }
  else if (act === 'alerts'){ $('f-alerts').checked = true; F.alerts = true; clearOnly(); setTab(state.tab === 'entities' ? 'entities' : 'relations'); }
});
document.addEventListener('input', e => {
  if (e.target.matches('.vcomment')){
    const id = e.target.closest('[data-card]').dataset.card, item = ITEMS.get(id);
    const cur = S.verdicts[id] || {}; cur.c = e.target.value; cur.t = new Date().toISOString(); if (!cur.fp) cur.fp = item.fp;
    S.verdicts[id] = cur; save();
    e.target.style.height = 'auto'; e.target.style.height = Math.max(34, e.target.scrollHeight + 2) + 'px';
  } else if (e.target.id === 'reviewer'){ S.reviewer = e.target.value; save(); }
});

/* ---------- Export / import ---------- */
function describe(it){
  if (it.kind === 'relation') return {source: nameOf(it.source_ref), relationship_type: it.relationship_type, target: nameOf(it.target_ref), source_ref: it.source_ref, target_ref: it.target_ref};
  if (it.kind === 'rejected') return {candidat: it.candidat};
  return {type: it.type, name: it.name, ext_id: it.ext_id};
}
$('btn-export').addEventListener('click', () => {
  const rows = [];
  for (const it of ITEMS.values()){
    const v = S.verdicts[it.id];
    if (!v || (!v.v && !v.c)) continue;
    rows.push(Object.assign({id: it.id, kind: it.kind}, describe(it), {label: it.label || null, verdict: v.v || null, comment: v.c || '', at: v.t || null, stale: !!(v.fp && v.fp !== it.fp)}));
  }
  const c = {ok:0, fix:0, ko:0}; rows.forEach(r => { if (c[r.verdict] != null) c[r.verdict]++; });
  const out = {bundle_id: D.meta.key, bundle_file: D.meta.bundle_file, article_file: D.meta.article_file, reviewer: S.reviewer || null,
    exported_at: new Date().toISOString(), summary: Object.assign({total: ITEMS.size, pending: ITEMS.size - c.ok - c.fix - c.ko}, c), verdicts: rows};
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = D.meta.bundle_stem + '.review.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('file-import').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    let n = 0;
    for (const r of data.verdicts || []){
      if (!ITEMS.has(r.id)) continue;
      S.verdicts[r.id] = {v: r.verdict || undefined, c: r.comment || '', t: r.at || null, fp: r.stale ? null : ITEMS.get(r.id).fp}; n++;
    }
    if (data.reviewer && !S.reviewer) S.reviewer = data.reviewer;
    save(); renderHeader(); renderTab();
    alert(n + ' verdict(s) importé(s).');
  } catch (err){ alert('Fichier illisible : ' + err.message); }
  e.target.value = '';
});

/* ---------- Thème ---------- */
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { theme = localStorage.getItem('stix-review:theme') || 'auto'; } catch (e) {}
function applyTheme(){ if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme); $('btn-theme').title = 'Thème : ' + theme; }
$('btn-theme').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem('stix-review:theme', theme); } catch (e) {} applyTheme(); });

/* ---------- Démarrage ---------- */
function measure(){ document.documentElement.style.setProperty('--hdr', $('top').offsetHeight + 'px'); }
window.addEventListener('resize', measure);
const initial = location.hash.slice(1);
applyTheme(); renderHeader(); renderTabs(); setupFilters(); setTab(TABS.some(t => t[0] === initial) ? initial : 'relations'); measure();
})();
</script>
