<script type="application/json" id="review-data">{"meta": {"key": "bundle--c8e42606-a5ec-5c1b-aa16-8787f853b5db", "bundle_file": "crowdstrike_stardust_chollima_axios_gold.json", "bundle_stem": "crowdstrike_stardust_chollima_axios_gold", "article_file": "April 01, 2026 - STARDUST CHOLLIMA Likely Compromises Axios npm Package.md", "report_name": "STARDUST CHOLLIMA Likely Compromises Axios npm Package", "report_desc": "CrowdStrike attribue avec une confiance modérée à STARDUST CHOLLIMA la compromission du paquet npm Axios (identifiants de mainteneur volés) pour déployer des variantes multiplateformes de ZshBucket. Recoupements d'infrastructure avec FAMOUS CHOLLIMA (IOCs hors périmètre).", "url": "https://www.crowdstrike.com/en-us/blog/stardust-chollima-likely-compromises-axios-npm-package/", "attack_version": "20.0", "declared_attack_version": "20.0", "generated": "2026-10-26 14:00"}, "article": {"text": "# STARDUST CHOLLIMA Likely Compromises Axios npm Package\n\n- **Source :** crowdstrike\n- **URL :** https://www.crowdstrike.com/en-us/blog/stardust-chollima-likely-compromises-axios-npm-package/\n- **Date :** April 01, 2026\n\n---\n\n# STARDUST CHOLLIMA Likely Compromises Axios npm Package\n\nApril 01, 2026\n\n• [ Counter Adversary Operations](/en-us/blog/author.counter-adversary-operations/ \"Posts by Counter Adversary Operations\") • [Threat Hunting & Intel](/en-us/blog/category.counter-adversary-operations/ \"Threat Hunting & Intel\")\n\n\nOn March 31, 2026, a threat actor used stolen maintainer credentials to compromise the widely used HTTP client library Axios Node Package Manager (npm) package and deploy platform-specific _ZshBucket_ variants. CrowdStrike Counter Adversary Operations attributes this activity to [STARDUST CHOLLIMA](https://www.crowdstrike.com/en-us/adversaries/stardust-chollima/) with moderate confidence based on the adversary’s deployment of updated variants of _ZshBucket_ (malware uniquely attributed to STARDUST CHOLLIMA) and overlaps with known STARDUST CHOLLIMA infrastructure. \n\n_ZshBucket_ can be used to target Linux, macOS, and Windows systems; previously, only macOS variants of _ZshBucket_ had been observed. The observed macOS variant in this case extensively reuses code from previous instances, including function names. All variants retain characteristics of previous instances, including how it profiles the user and host of the operating system, and how it sends the collected information.\n\nThe adversary made the following significant updates to the functionality and messaging protocol in the _ZshBucket_ instance deployed in this incident compared to previous variants:\n\n  * Implemented a common JSON-based messaging protocol for all platform-specific instances\n  * Implemented commands that enable the operator to inject binary payloads, execute arbitrary scripts and commands, enumerate the file system, and remotely terminate the implant; these commands replace previous instances’ simple download and execute functionality\n\n\n\n## Related Infrastructure\n\nThe domain `sfrclak[.]com` — hosted at `142.11.206[.]73` and later used as a command-and-control (C2) address — shares a host services banner hash (`c373706b3456c36e8baa0a3ee5aed358c1fe07cba04f65790c90f029971e378a`) with two additional IP addresses: `23.254.203[.]244` and `23.254.167.216`. The IP address `23.254.203[.]244` is a known STARDUST CHOLLIMA IP address first observed in December 2025, and `23.254.167[.]216` was previously used as a C2 server for [FAMOUS CHOLLIMA](https://www.crowdstrike.com/en-us/adversaries/famous-chollima/)’s InvisibleFerret malware in May 2025. The domain is also registered on the Hostwinds hosting provider, consistent with STARDUST CHOLLIMA’s previously observed operations.\n\n## Assessment\n\nCrowdStrike Intelligence attributes this activity to STARDUST CHOLLIMA with moderate confidence based on the use of an updated _ZshBucket_ instance — malware uniquely attributed to STARDUST CHOLLIMA — as well as infrastructure overlaps with STARDUST CHOLLIMA’s previous operations. However, the infrastructure also overlaps with FAMOUS CHOLLIMA operations, precluding a higher confidence assessment. \n\nDPRK-nexus adversaries frequently share infrastructure, and FAMOUS CHOLLIMA has historically deployed DPRK-associated tooling and has extensively abused npm repositories in their operations. As such, FAMOUS CHOLLIMA could be responsible for this incident. However, the updated _ZshBucket_ variants deployed in this supply chain compromise are more technically advanced than the malware FAMOUS CHOLLIMA typically uses, and this incident is more likely attributable to STARDUST CHOLLIMA. \n\nThe intended targets of this compromise are unclear. The Axios npm package is a commonly used HTTP client library that is downloaded more than 100,000 times per week. STARDUST CHOLLIMA’s operations prioritize currency generation and regularly target cryptocurrency holders, and the adversary has also conducted widespread supply chain compromises impacting fintech companies’ npm and PyPi repositories. Based on these factors, CrowdStrike Counter Adversary Operations assesses the adversary’s motivation probably aligns with this currency generation objective. \n\nSince the end of Q4 2025, STARDUST CHOLLIMA’s operational tempo has surged and has continued at this pace. This supply chain attack leveraging updated _ZshBucket_ variants is further evidence that the adversary intends to scale their operations in the near term.\n\n#### Additional Resources\n\n  * _Dive deeper into topics like this at[Fal.Con 2026](https://www.crowdstrike.com/en-us/events/fal-con/las-vegas/?utm_medium=evt&utm_source=blog&utm_campaign=fal-con-26&utm_term=crwdblogs&utm_language=en-us) with expert-led sessions, hands-on training, and real-world insights._\n  * _Read the[CrowdStrike 2026 Global Threat Report](https://www.crowdstrike.com/en-us/global-threat-report/) for the latest insights on adversaries, tradecraft, and activity._\n  * _Visit the[Counter Adversary Operations](https://www.crowdstrike.com/en-us/platform/threat-intelligence/) webpage to learn about CrowdStrike’s threat intelligence and hunting solutions._\n\n\n\n[ ](https://www.linkedin.com/shareArticle) [ ](https://twitter.com/share)\n\n* * *\n\n#### Related Content\n\n[ ![PhantomRaven: An LLM-Generated Information Stealer Developed for Bug Bounty Hunting](https://assets.crowdstrike.com/is/image/crowdstrikeinc/Blog-InfoStealer?wid=2048&hei=1349&fmt=png-alpha&qlt=95,0&resMode=sharp2&op_usm=3.0,0.3,2,0) Threat Hunting & Intel | Sep 15, 2026  PhantomRaven: An LLM-Generated Information Stealer Developed for Bug Bounty Hunting ](/en-us/blog/phantomraven-llm-generated-information-stealer-for-bug-bounty-hunting/) [ ![Peer Pressure: Inside the Sality Botnet Disruption Operation](https://assets.crowdstrike.com/is/image/crowdstrikeinc/Blog-FalCon-Sality?wid=1060&hei=698&fmt=png-alpha&qlt=95,0&resMode=sharp2&op_usm=3.0,0.3,2,0) Threat Hunting & Intel | Sep 01, 2026  Peer Pressure: Inside the Sality Botnet Disruption Operation ](/en-us/blog/inside-sality-botnet-disruption-operation/) [ ![CrowdStrike 2026 Threat Hunting Report: Exploitation Window Closes as AI Use Accelerates](https://assets.crowdstrike.com/is/image/crowdstrikeinc/Blog-THR-2026?wid=1060&hei=698&fmt=png-alpha&qlt=95,0&resMode=sharp2&op_usm=3.0,0.3,2,0) Threat Hunting & Intel | Aug 03, 2026  CrowdStrike 2026 Threat Hunting Report: Exploitation Window Closes as AI Use Accelerates ](/en-us/blog/crowdstrike-2026-threat-hunting-report/)"}, "global_flags": [], "entities": [{"id": "intrusion-set--58f7add8-07be-59fb-a1a2-51f1705a6b4d", "kind": "entity", "type": "intrusion-set", "name": "STARDUST CHOLLIMA", "ext_id": "G0082", "label": "gold:required", "quotes": [{"text": "CrowdStrike Intelligence attributes this activity to STARDUST CHOLLIMA with moderate confidence", "anchor": {"status": "exact", "occurrences": [{"start": 2825, "end": 2920, "section": ["Assessment"]}]}}], "flags": [{"level": "warn", "code": "attack-name", "msg": "Nom « STARDUST CHOLLIMA » différent du nom officiel de G0082 : « APT38 »."}], "severity": 2, "description": "Adversaire auquel CrowdStrike attribue, avec une confiance modérée, la compromission du paquet npm Axios. Ses opérations visent la génération de devises et ciblent régulièrement les détenteurs de cryptomonnaies.", "aliases": [], "tactics": [], "attack": {"status": "warn", "msg": "G0082 APT38 (ATT&CK v20.0)", "official": "APT38", "description": "APT38 is a North Korean state-sponsored threat group that specializes in financial cyber operations; it has been attributed to the Reconnaissance General Bureau. Active since at least 2014, APT38 has targeted banks, financial institutions, casinos, cryptocurrency exchanges, SWIFT system endpoints, and ATMs in at least 38 countries worldwide. Significant operations include the 2016 Bank of Bangladesh heist, Bancomext and Banco de Chile, along with software supply chain compromises and destructive malware attacks.\n\nNorth Korean group definitions are known to have significant overlap, and some security researchers report all North Korean state-sponsored cyber activity under the name Lazarus Group instead of tracking clusters or subgroups.", "url": "https://attack.mitre.org/groups/G0082"}, "rel_count": 4, "sequence": null, "extra": {"x_gold_context": "Nom canonique ATT&CK : APT38 (G0082), qui liste « Stardust Chollima » parmi ses alias. Rattachement par la table d'alias, pas par le texte."}, "fp": "047478681d71"}, {"id": "intrusion-set--fe3d6d03-a863-5719-a3a0-022934f409b7", "kind": "entity", "type": "intrusion-set", "name": "FAMOUS CHOLLIMA", "ext_id": null, "label": "gold:required", "quotes": [{"text": "FAMOUS CHOLLIMA has historically deployed DPRK-associated tooling", "anchor": {"status": "exact", "occurrences": [{"start": 3287, "end": 3352, "section": ["Assessment"]}]}}], "flags": [], "severity": 0, "description": "Adversaire nexus RPDC dont l'infrastructure recoupe celle de l'incident ; l'article l'envisage comme auteur alternatif, sans le retenir.", "aliases": [], "tactics": [], "attack": null, "rel_count": 1, "sequence": null, "extra": {}, "fp": "fab9339b9032"}, {"id": "campaign--99cdf874-bfc2-556e-b042-01ddd86347c3", "kind": "entity", "type": "campaign", "name": "Compromission du paquet npm Axios (31 mars 2026)", "ext_id": null, "label": "gold:required", "quotes": [{"text": "On March 31, 2026, a threat actor used stolen maintainer credentials to compromise the widely used HTTP client library Axios Node Package Manager (npm) package and deploy platform-specific _ZshBucket_ variants.", "anchor": {"status": "exact", "occurrences": [{"start": 530, "end": 740, "section": []}]}}], "flags": [], "severity": 0, "description": "Compromission du paquet npm Axios au moyen d'identifiants de mainteneur volés, pour déployer des variantes de ZshBucket propres à chaque plateforme (Linux, macOS, Windows).", "aliases": [], "tactics": [], "attack": null, "rel_count": 5, "sequence": [{"order": 1, "summary": "Utilisation d'identifiants de mainteneur volés.", "techniques": ["T1078"]}, {"order": 2, "summary": "Compromission du paquet npm Axios (bibliothèque client HTTP).", "techniques": ["T1195.001"]}, {"order": 3, "summary": "Déploiement de variantes de ZshBucket propres à chaque plateforme.", "techniques": []}], "extra": {}, "fp": "3b71e2d9fd42"}, {"id": "malware--6b0367ee-22cf-5640-9f72-c0a5ca5bc329", "kind": "entity", "type": "malware", "name": "ZshBucket", "ext_id": null, "label": "gold:required", "quotes": [{"text": "_ZshBucket_ can be used to target Linux, macOS, and Windows systems", "anchor": {"status": "exact", "occurrences": [{"start": 1103, "end": 1170, "section": []}]}}], "flags": [], "severity": 0, "description": "Malware attribué exclusivement à STARDUST CHOLLIMA. Jusqu'ici observé sur macOS seulement, il existe désormais en variantes Linux, macOS et Windows partageant un protocole de messagerie JSON. Profile l'utilisateur et l'hôte ; commandes : injection de charges binaires, exécution de scripts et de commandes, énumération du système de fichiers, arrêt à distance de l'implant.", "aliases": [], "tactics": [], "attack": null, "rel_count": 6, "sequence": null, "extra": {}, "fp": "b46065aa368c"}, {"id": "malware--6e54deab-00bf-55c0-9471-5ec9f2f1790d", "kind": "entity", "type": "malware", "name": "InvisibleFerret", "ext_id": "S1245", "label": "gold:required", "quotes": [{"text": "InvisibleFerret malware in May 2025", "anchor": {"status": "exact", "occurrences": [{"start": 2639, "end": 2674, "section": ["Related Infrastructure"]}]}}], "flags": [], "severity": 0, "description": "Malware de FAMOUS CHOLLIMA dont un ancien serveur C2 (mai 2025) partage un hash de bannière avec l'infrastructure de l'incident.", "aliases": [], "tactics": [], "attack": {"status": "ok", "msg": "S1245 InvisibleFerret (ATT&CK v20.0)", "official": "InvisibleFerret", "description": "InvisibleFerret is a modular python malware that is leveraged for data exfiltration and remote access capabilities.   InvisibleFerret consists of four modules: main, payload, browser, and AnyDesk.  InvisibleFerret malware has been leveraged by North Korea-affiliated threat actors identified as DeceptiveDevelopment or Contagious Interview since 2023.  InvisibleFerret has historically been introduced to the victim environment through the use of the BeaverTail malware.", "url": "https://attack.mitre.org/software/S1245"}, "rel_count": 1, "sequence": null, "extra": {}, "fp": "9bd4d2afb848"}, {"id": "software--521335b8-c72b-5bdf-aa79-0883ee3488a4", "kind": "entity", "type": "software", "name": "Axios", "ext_id": null, "label": "gold:required", "quotes": [{"text": "the widely used HTTP client library Axios Node Package Manager (npm) package", "anchor": {"status": "exact", "occurrences": [{"start": 613, "end": 689, "section": []}]}}], "flags": [], "severity": 0, "description": null, "aliases": ["axios", "Axios npm package"], "tactics": [], "attack": null, "rel_count": 1, "sequence": null, "extra": {"x_gold_description": "Bibliothèque client HTTP distribuée sous forme de paquet npm, compromise via les identifiants d'un mainteneur. Éditeur et versions affectées non précisés."}, "fp": "0b8ee433a410"}, {"id": "identity--d122180d-2731-5cd6-815a-d47782d25711", "kind": "entity", "type": "identity", "name": "Cryptocurrency holders", "ext_id": null, "label": "gold:required", "quotes": [{"text": "regularly target cryptocurrency holders", "anchor": {"status": "exact", "occurrences": [{"start": 3948, "end": 3987, "section": ["Assessment"]}]}}], "flags": [], "severity": 0, "description": "Cible régulière des opérations de STARDUST CHOLLIMA, orientées vers la génération de devises.", "aliases": [], "tactics": [], "attack": null, "rel_count": 1, "sequence": null, "extra": {}, "fp": "0633bb28ed54"}, {"id": "identity--c21f478e-368a-5c9c-8b23-f73163d8f91f", "kind": "entity", "type": "identity", "name": "Fintech companies", "ext_id": null, "label": "gold:required", "quotes": [{"text": "widespread supply chain compromises impacting fintech companies", "anchor": {"status": "exact", "occurrences": [{"start": 4026, "end": 4089, "section": ["Assessment"]}]}}], "flags": [], "severity": 0, "description": "Entreprises fintech dont les dépôts npm et PyPI ont été touchés par des compromissions de la chaîne d'approvisionnement de STARDUST CHOLLIMA.", "aliases": [], "tactics": [], "attack": null, "rel_count": 1, "sequence": null, "extra": {}, "fp": "96b59c2607c5"}, {"id": "attack-pattern--b17a1a56-e99c-403c-8948-561df0cffe81", "kind": "entity", "type": "attack-pattern", "name": "Valid Accounts", "ext_id": "T1078", "label": "gold:required", "quotes": [{"text": "used stolen maintainer credentials to compromise", "anchor": {"status": "exact", "occurrences": [{"start": 564, "end": 612, "section": []}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["stealth", "persistence", "privilege-escalation", "initial-access"], "attack": {"status": "ok", "msg": "T1078 Valid Accounts (ATT&CK v20.0)", "official": "Valid Accounts", "description": "Adversaries may obtain and abuse credentials of existing accounts as a means of gaining Initial Access, Persistence, Privilege Escalation, or Defense Evasion. Compromised credentials may be used to bypass access controls placed on various resources on systems within the network and may even be used for persistent access to remote systems and externally available services, such as VPNs, Outlook Web Access, network devices, and remote desktop. Compromised credentials may also grant an adversary increased privilege to specific systems or access to restricted areas of the network. Adversaries may choose not to use malware or tools in conjunction with the legitimate access those credentials provide to make it harder to detect their presence.\n\nIn some cases, adversaries may abuse inactive accounts: for example, those belonging to individuals who are no longer part of an organization. Using these accounts may allow the adversary to evade detection, as the original account user will not be present to identify any anomalous activity taking place on their account.\n\nThe overlap of permissions for local, domain, and cloud accounts across a network of systems is of concern because the adversary may be able to pivot across accounts and systems to reach a high level of access (i.e., domain or enterprise administrator) to bypass access controls set within the enterprise.", "url": "https://attack.mitre.org/techniques/T1078"}, "rel_count": 1, "sequence": null, "extra": {"x_gold_context": "Sous-technique non déterminable : le type de compte du mainteneur n'est pas précisé."}, "fp": "bd26bb8f2236"}, {"id": "attack-pattern--191cc6af-1bb2-4344-ab5f-28e496638720", "kind": "entity", "type": "attack-pattern", "name": "Compromise Software Dependencies and Development Tools", "ext_id": "T1195.001", "label": "gold:required", "quotes": [{"text": "compromise the widely used HTTP client library Axios Node Package Manager (npm) package", "anchor": {"status": "exact", "occurrences": [{"start": 602, "end": 689, "section": []}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["initial-access"], "attack": {"status": "ok", "msg": "T1195.001 Compromise Software Dependencies and Development Tools (ATT&CK v20.0)", "official": "Compromise Software Dependencies and Development Tools", "description": "Adversaries may manipulate software dependencies and development tools prior to receipt by a final consumer for the purpose of data or system compromise. Applications often depend on external software to function properly. Popular open source projects that are used as dependencies in many applications, such as pip and NPM packages, may be targeted as a means to add malicious code to users of the dependency. This may also include abandoned packages, which in some cases could be re-registered by threat actors after being removed by adversaries. Adversaries may also employ \"typosquatting\" or name-confusion by choosing names similar to existing popular libraries or packages in order to deceive a user.\n\nAdditionally, CI/CD pipeline components, such as GitHub Actions, may be targeted in order to gain access to the building, testing, and deployment cycles of an application. By adding malicious code into a GitHub action, a threat actor may be able to collect runtime credentials (e.g., via Proc Filesystem) or insert further malicious components into the build pipelines for a second-order supply chain compromise. As GitHub Actions are often dependent on other GitHub Actions, threat actors may be able to infect a large number of repositories via the compromise of a single Action.\n\nAdversaries may also target the configuration and instruction files consumed by integrated development environments and AI coding agents. Project files such as tasks.json may execute commands when a developer opens or builds a project, while agent skill files (SKILL.md) supply an agent with instructions and resources that it loads on demand and runs with the permissions of the agent process. To encourage downloads, adversaries may publish these files under benign-appearing or typo-squatted names, upload unmodified copies of the genuine skills first so the listings accumulate installs before the content behind them is weaponized, or may place the malicious instructions in a secondary document that the reviewed entry point references. Because these artifacts are natural language or configuration rather than executable code, they may pass registry screening and signature-based scanning.\n\nTargeting may be specific to a desired victim set or may be distributed to a broad set of consumers but only move on to additional tactics on specific victims.", "url": "https://attack.mitre.org/techniques/T1195/001"}, "rel_count": 1, "sequence": null, "extra": {}, "fp": "121b4ad12335"}, {"id": "attack-pattern--354a7f88-63fb-41b5-a801-ce3b377b36f1", "kind": "entity", "type": "attack-pattern", "name": "System Information Discovery", "ext_id": "T1082", "label": "gold:required", "quotes": [{"text": "including how it profiles the user and host of the operating system", "anchor": {"status": "exact", "occurrences": [{"start": 1412, "end": 1479, "section": []}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["discovery"], "attack": {"status": "ok", "msg": "T1082 System Information Discovery (ATT&CK v20.0)", "official": "System Information Discovery", "description": "An adversary may attempt to get detailed information about the operating system and hardware, including version, patches, hotfixes, service packs, and architecture. Adversaries may use this information to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions. This behavior is distinct from Local Storage Discovery which is an adversary's discovery of local drive, disks and/or volumes.\n\nTools such as Systeminfo can be used to gather detailed system information. If running with privileged access, a breakdown of system data can be gathered through the systemsetup configuration tool on macOS. Adversaries may leverage a Network Device CLI on network devices to gather detailed system information (e.g. show version). On ESXi servers, threat actors may gather system information from various esxcli utilities, such as `system hostname get` and `system version get`.\n\nInfrastructure as a Service (IaaS) cloud providers such as AWS, GCP, and Azure allow access to instance and virtual machine information via APIs. Successful authenticated API calls can return data such as the operating system platform and status of a particular instance or the model view of a virtual machine.\n\nSystem Information Discovery combined with information gathered from other forms of discovery and reconnaissance can drive payload development and concealment.", "url": "https://attack.mitre.org/techniques/T1082"}, "rel_count": 1, "sequence": null, "extra": {}, "fp": "fac879e30446"}, {"id": "attack-pattern--03d7999c-1f4c-42cc-8373-e7690d318104", "kind": "entity", "type": "attack-pattern", "name": "System Owner/User Discovery", "ext_id": "T1033", "label": "gold:required", "quotes": [{"text": "including how it profiles the user and host of the operating system", "anchor": {"status": "exact", "occurrences": [{"start": 1412, "end": 1479, "section": []}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["discovery"], "attack": {"status": "ok", "msg": "T1033 System Owner/User Discovery (ATT&CK v20.0)", "official": "System Owner/User Discovery", "description": "Adversaries may attempt to identify the primary user, currently logged in user, set of users that commonly uses a system, or whether a user is actively using the system. They may do this, for example, by retrieving account usernames or by using OS Credential Dumping. The information may be collected in a number of different ways using other Discovery techniques, because user and username details are prevalent throughout a system and include running process ownership, file/directory ownership, session information, and system logs. Adversaries may use the information from System Owner/User Discovery during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nVarious utilities and commands may acquire this information, including whoami. In macOS and Linux, the currently logged in user can be identified with w and who. On macOS the dscl . list /Users | grep -v '_' command can also be used to enumerate user accounts. Environment variables, such as %USERNAME% and $USER, may also be used to access this information.\n\nOn network devices, Network Device CLI commands such as `show users` and `show ssh` can be used to display users currently logged into the device.", "url": "https://attack.mitre.org/techniques/T1033"}, "rel_count": 1, "sequence": null, "extra": {}, "fp": "7105deaa6ace"}, {"id": "attack-pattern--7385dfaf-6886-4229-9ecd-6fd678040830", "kind": "entity", "type": "attack-pattern", "name": "Command and Scripting Interpreter", "ext_id": "T1059", "label": "gold:required", "quotes": [{"text": "execute arbitrary scripts and commands", "anchor": {"status": "exact", "occurrences": [{"start": 1877, "end": 1915, "section": []}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["execution"], "attack": {"status": "ok", "msg": "T1059 Command and Scripting Interpreter (ATT&CK v20.0)", "official": "Command and Scripting Interpreter", "description": "Adversaries may abuse command and script interpreters to execute commands, scripts, or binaries. These interfaces and languages provide ways of interacting with computer systems and are a common feature across many different platforms. Most systems come with some built-in command-line interface and scripting capabilities, for example, macOS and Linux distributions include some flavor of Unix Shell while Windows installations include the Windows Command Shell and PowerShell.\n\nThere are also cross-platform interpreters such as Python, as well as those commonly associated with client applications such as JavaScript and Visual Basic.\n\nAdversaries may abuse these technologies in various ways as a means of executing arbitrary commands. Commands and scripts can be embedded in Initial Access payloads delivered to victims as lure documents or as secondary payloads downloaded from an existing C2. Adversaries may also execute commands through interactive terminals/shells, as well as utilize various Remote Services in order to achieve remote Execution.", "url": "https://attack.mitre.org/techniques/T1059"}, "rel_count": 1, "sequence": null, "extra": {"x_gold_context": "Interpréteur non précisé : technique parente."}, "fp": "51c37f649139"}, {"id": "attack-pattern--7bc57495-ea59-4380-be31-a64af124ef18", "kind": "entity", "type": "attack-pattern", "name": "File and Directory Discovery", "ext_id": "T1083", "label": "gold:required", "quotes": [{"text": "enumerate the file system", "anchor": {"status": "exact", "occurrences": [{"start": 1917, "end": 1942, "section": []}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["discovery"], "attack": {"status": "ok", "msg": "T1083 File and Directory Discovery (ATT&CK v20.0)", "official": "File and Directory Discovery", "description": "Adversaries may enumerate files and directories or may search in specific locations of a host or network share for certain information within a file system. Adversaries may use the information from File and Directory Discovery during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nMany command shell utilities can be used to obtain this information. Examples include dir, tree, <script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('review-data').textContent);
const TEXT = D.article.text;
const CTX = 220, CTX_MORE = 700;
const ENT = new Map(D.entities.map(e => [e.id, e]));
const REL = D.relations;
const REJ = D.rejected;
const ITEMS = new Map([...D.entities, ...REL, ...REJ].map(i => [i.id, i]));
const VERDICTS = {ok:{label:'Correct', icon:'✓'}, fix:{label:'À corriger', icon:'~'}, ko:{label:'Non justifié', icon:'✗'}};
const REJ_VERDICTS = {ok:{label:'Rejet confirmé', icon:'✓'}, fix:{label:'À intégrer au gold', icon:'+'}};
const QSTATUS = {normalized:'normalisée', fuzzy:'approximative'};
const TYPE_ORDER = ['intrusion-set','threat-actor','campaign','incident','malware','tool','infrastructure','attack-pattern','software','vulnerability','location','identity'];
const ICON = {error:'●', warn:'▲', info:'i'};

/* ---------- Stockage ---------- */
const KEY = 'stix-review:' + D.meta.key;
let S = {verdicts:{}, reviewer:''};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function verdictOf(id){ return (S.verdicts[id] || {}).v || 'pending'; }

/* ---------- Utilitaires ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeKey = t => ['campaign','intrusion-set','threat-actor','malware','tool','attack-pattern','location','identity'].includes(t) ? t : 'other';
const typeOf = id => (ENT.get(id) || {}).type || 'absent';
const nameOf = id => { const e = ENT.get(id); return e ? (e.ext_id ? e.ext_id + ' ' : '') + e.name : id; };
const typeRank = t => { const i = TYPE_ORDER.indexOf(t); return i < 0 ? 99 : i; };
const hasAlert = it => it.flags.some(f => f.level !== 'info');
const byId = id => document.querySelector('[data-card="' + CSS.escape(id) + '"]');

function chip(id, small){
  const e = ENT.get(id);
  if (!e) return `<span class="node t-missing${small?' sm':''}"><span class="ntype">référence absente</span><span class="nname">${esc(id)}</span></span>`;
  const sub = !small && e.type === 'attack-pattern' && e.tactics.length ? `<span class="nsub">${esc(e.tactics.join(' · '))}</span>` : '';
  return `<span class="node t-${typeKey(e.type)}${small?' sm':''}" title="${esc(e.type + ' · ' + e.id)}"><span class="ntype">${esc(e.ext_id || e.type)}</span><span class="nname">${esc(e.name)}</span>${sub}</span>`;
}
function labelBadge(l){
  if (!l) return '<span class="lbl lbl-none">sans label</span>';
  const k = l.replace('gold:', '');
  return `<span class="lbl lbl-${k==='required'?'req':k==='acceptable'?'acc':'other'}">${esc(k)}</span>`;
}
function flagsHtml(flags){
  if (!flags.length) return '';
  return '<ul class="flags">' + flags.map(f => `<li class="flag f-${f.level}"><span aria-hidden="true">${ICON[f.level]}</span><div>${esc(f.msg)}</div></li>`).join('') + '</ul>';
}
function tripletHtml(r, small){
  return `${chip(r.source_ref, small)}<span class="edge"><span class="ln"></span>${esc(r.relationship_type)}<span aria-hidden="true">→</span></span>${chip(r.target_ref, small)}`;
}

/* ---------- Citations en contexte ---------- */
function quotesHtml(item){
  if (!item.quotes || !item.quotes.length) return '<div class="quote"><div class="ctx-missing">Aucune citation fournie.</div></div>';
  return item.quotes.map((q, qi) => `<div class="quote" data-item="${esc(item.id)}" data-q="${qi}" data-o="0" data-r="${CTX}">${quoteInner(item, qi, 0, CTX)}</div>`).join('');
}
function quoteInner(item, qi, oi, radius){
  const q = item.quotes[qi], a = q.anchor;
  if (!a.occurrences.length){
    let h = `<div class="ctx-missing"><div class="qraw">« ${esc(q.text)} »</div><div class="cand">Introuvable dans l'article.</div>`;
    if (a.candidate) h += `<div class="cand">Passage le plus proche (${Math.round(a.score*100)} %) : « ${esc(a.candidate)} »</div>`;
    return h + '</div>';
  }
  const o = a.occurrences[oi];
  let s = Math.max(0, o.start - radius), e = Math.min(TEXT.length, o.end + radius);
  if (s > 0){ const sp = TEXT.indexOf(' ', s); if (sp > -1 && sp < o.start) s = sp + 1; }
  if (e < TEXT.length){ const sp = TEXT.lastIndexOf(' ', e); if (sp > o.end) e = sp; }
  const tight = t => esc(t.replace(/\n\s*\n[\s\n]*/g, '\n\n'));
  const ctx = (s > 0 ? '… ' : '') + tight(TEXT.slice(s, o.start)) + '<mark>' + esc(TEXT.slice(o.start, o.end)) + '</mark>' + tight(TEXT.slice(o.end, e)) + (e < TEXT.length ? ' …' : '');
  const n = a.occurrences.length;
  const nav = n > 1 ? `<span class="occ"><button type="button" class="mini" data-act="occ" data-d="-1" ${oi===0?'disabled':''} aria-label="Occurrence précédente">‹</button>occurrence ${oi+1}/${n}<button type="button" class="mini" data-act="occ" data-d="1" ${oi===n-1?'disabled':''} aria-label="Occurrence suivante">›</button></span>` : '';
  const st = QSTATUS[a.status] ? `<span class="qstatus qs-${a.status}">citation ${QSTATUS[a.status]}${a.status==='fuzzy' ? ' ' + Math.round(a.score*100) + ' %' : ''}</span>` : '';
  return `<blockquote class="ctx">${ctx}</blockquote>
    <div class="where"><span class="sec">§ ${esc(o.section.join(' › ') || 'Début de l’article')}</span>${nav}${st}
      <span class="actions"><button type="button" class="mini" data-act="more">${radius > CTX ? 'Moins de contexte' : 'Plus de contexte'}</button><button type="button" class="mini" data-act="goto">Voir dans l’article</button></span></div>`;
}

/* ---------- Verdicts ---------- */
function verdictHtml(item){
  const V = item.kind === 'rejected' ? REJ_VERDICTS : VERDICTS;
  const cur = S.verdicts[item.id] || {};
  const btns = Object.entries(V).map(([k, v]) => `<button type="button" class="vbtn vb-${k}${cur.v===k?' on':''}" data-act="verdict" data-v="${k}" aria-pressed="${cur.v===k}">${v.icon} ${v.label}</button>`).join('');
  const stale = cur.v && cur.fp && cur.fp !== item.fp ? '<div class="stale">▲ L’objet a changé depuis ce verdict : à revérifier.</div>' : '';
  return `<div class="verdict">${stale}<div class="vbtns" role="group" aria-label="Verdict">${btns}</div><textarea class="vcomment" rows="1" data-act="comment" placeholder="Commentaire : autre cible, autre label, citation à allonger…">${esc(cur.c || '')}</textarea></div>`;
}
function setVerdict(id, v){
  const item = ITEMS.get(id); if (!item) return;
  const cur = S.verdicts[id] || {};
  if (cur.v === v) delete cur.v; else { cur.v = v; cur.fp = item.fp; }
  cur.t = new Date().toISOString();
  S.verdicts[id] = cur; save();
  document.querySelectorAll('[data-card="' + CSS.escape(id) + '"]').forEach(card => {
    card.classList.remove('v-ok','v-fix','v-ko','v-pending'); card.classList.add('v-' + (cur.v || 'pending'));
    card.querySelectorAll('.vbtn').forEach(b => { const on = b.dataset.v === cur.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const st = card.querySelector('.stale'); if (st) st.remove();
  });
  renderProgress();
  if (state.tab === 'matrix') renderMatrix();
}

/* ---------- Cartes ---------- */
function extraHtml(extra){
  const keys = Object.keys(extra || {});
  if (!keys.length) return '';
  return '<div class="extra">' + keys.map(k => esc(k) + ' : ' + esc(typeof extra[k] === 'string' ? extra[k] : JSON.stringify(extra[k]))).join('<br>') + '</div>';
}
function mitreHtml(id){
  const e = ENT.get(id), a = e && e.attack;
  if (!a || !a.description) return '';
  const paras = a.description.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const more = paras.length > 1 ? `<details><summary>Lire la suite (${paras.length - 1} paragraphe${paras.length > 2 ? 's' : ''})</summary>${paras.slice(1).map(p => `<p>${esc(p)}</p>`).join('')}</details>` : '';
  const link = a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">attack.mitre.org ↗</a>` : '';
  return `<div class="mitre"><div class="mitre-head"><span>Définition MITRE · ${esc(e.ext_id)} ${esc(a.official)}</span>${link}</div><p>${esc(paras[0])}</p>${more}</div>`;
}
function relCard(r){
  return `<article class="card v-${verdictOf(r.id)}" data-card="${esc(r.id)}" tabindex="-1">

    ${typeOf(r.target_ref) === 'attack-pattern' ? mitreHtml(r.target_ref) : ''}

    ${extraHtml(r.extra)}${verdictHtml(r)}</article>`;
}
function seqHtml(seq){
  if (!seq || !seq.length) return '';
  const li = seq.map(s => `<li><div>${esc(s.summary || '')}${s.concurrent ? ' <em>(concurrent)</em>' : ''}</div><div>${(s.techniques||[]).map(t => `<span class="tid">${esc(t)}</span>`).join('')}${(s.techniques_acceptable||[]).map(t => `<span class="tid acc" title="acceptable">${esc(t)}</span>`).join('')}</div></li>`).join('');
  return `<details class="seq"><summary>Séquence x_gold_sequence (${seq.length} étapes)</summary><ol>${li}</ol></details>`;
}
function entCard(e){
  const a = e.attack ? `<div class="attack a-${e.attack.status}"><span aria-hidden="true">${e.attack.status==='ok'?'✓':e.attack.status==='unchecked'?'?':'▲'}</span>${esc(e.attack.msg)}</div>` : '';
  return `<article class="card v-${verdictOf(e.id)}" data-card="${esc(e.id)}" tabindex="-1">
    <div class="ent-head">${chip(e.id)}<span class="spacer"></span>${labelBadge(e.label)}</div>

    ${flagsHtml(e.flags)}${quotesHtml(e)}${seqHtml(e.sequence)}${extraHtml(e.extra)}
    <div class="meta-line"><button type="button" class="mini" data-act="ent-rels" data-id="${esc(e.id)}">Voir ses ${e.rel_count} relation${e.rel_count>1?'s':''}</button></div>
    ${verdictHtml(e)}</article>`;
}
function rejCard(r){
  return `<article class="card v-${verdictOf(r.id)}" data-card="${esc(r.id)}" tabindex="-1">
    <div class="triplet"><span class="node t-missing"><span class="ntype">candidat rejeté</span><span class="nname">${esc(r.candidat)}</span></span></div>
    <p class="just"><strong>Raison</strong>${esc(r.raison)}</p>${flagsHtml(r.flags)}${verdictHtml(r)}</article>`;

/* ---------- État, filtres ---------- */
const state = {tab:'relations', only:null, onlyLabel:''};
const F = {q:'', entity:'', rtype:'', ttype:'', label:'', status:'', sort:'alerts', alerts:false};
const $ = id => document.getElementById(id);

function fillSelect(sel, values, allLabel){
  sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
}
function setupFilters(){
  const ents = [...D.entities].sort((a, b) => typeRank(a.type) - typeRank(b.type) || (a.ext_id||a.name).localeCompare(b.ext_id||b.name));
  fillSelect($('f-entity'), ents.map(e => [e.id, (e.ext_id ? e.ext_id + ' ' : '') + e.name + ' (' + e.type + ')']), 'Toutes');
  fillSelect($('f-rtype'), [...new Set(REL.map(r => r.relationship_type))].sort().map(t => [t, t]), 'Tous');
  [['f-q','q','input'],['f-entity','entity','change'],['f-rtype','rtype','change'],['f-ttype','ttype','change'],['f-label','label','change'],['f-status','status','change'],['f-sort','sort','change']]
    .forEach(([id, k, ev]) => $(id).addEventListener(ev, () => { F[k] = k === 'q' ? $(id).value.trim().toLowerCase() : $(id).value; clearOnly(); renderTab(); }));
  $('f-alerts').addEventListener('change', () => { F.alerts = $('f-alerts').checked; clearOnly(); renderTab(); });
  $('f-reset').addEventListener('click', resetFilters);
  $('f-toggle').addEventListener('click', () => { const o = $('filters').classList.toggle('open'); $('f-toggle').setAttribute('aria-expanded', o); measure(); });
}
function resetFilters(){
  Object.assign(F, {q:'', entity:'', rtype:'', ttype:'', label:'', status:'', alerts:false});
  ['f-q','f-entity','f-rtype','f-ttype','f-label','f-status'].forEach(id => $(id).value = '');
  $('f-alerts').checked = false; clearOnly(); renderTab();
}
function syncTypeFilter(){
  const isRel = state.tab === 'relations';
  $('f-ttype-lab').textContent = isRel ? 'Type de cible' : 'Type d’entité';
  const types = isRel ? REL.map(r => typeOf(r.target_ref)) : D.entities.map(e => e.type);
  const cur = F.ttype;
  fillSelect($('f-ttype'), [...new Set(types)].sort((a,b) => typeRank(a)-typeRank(b)).map(t => [t, t]), 'Tous');
  $('f-ttype').value = types.includes(cur) ? cur : ''; F.ttype = $('f-ttype').value;
  document.querySelectorAll('[data-only="relations"]').forEach(el => el.style.display = isRel ? '' : 'none');
}
function clearOnly(){ state.only = null; state.onlyLabel = ''; }
function textOf(it){
  const parts = it.kind === 'relation' ? [nameOf(it.source_ref), it.relationship_type, nameOf(it.target_ref), it.justification]
    : [it.ext_id, it.name, it.type, (it.aliases||[]).join(' '), it.description];
  return (parts.join(' ') + ' ' + (it.quotes||[]).map(q => q.text).join(' ')).toLowerCase();
}
function common(it){
  if (F.label && it.label !== F.label) return false;
  if (F.status && verdictOf(it.id) !== F.status) return false;
  if (F.alerts && !hasAlert(it)) return false;
  if (F.q && !textOf(it).includes(F.q)) return false;
  return true;
}
function relVisible(r){
  if (state.only) return state.only.includes(r.id);
  if (F.entity && r.source_ref !== F.entity && r.target_ref !== F.entity) return false;
  if (F.rtype && r.relationship_type !== F.rtype) return false;
  if (F.ttype && typeOf(r.target_ref) !== F.ttype) return false;
  return common(r);
}
function entVisible(e){
  if (state.only) return state.only.includes(e.id);
  if (F.entity && e.id !== F.entity) return false;
  if (F.ttype && e.type !== F.ttype) return false;
  return common(e);
}

/* ---------- Rendu des onglets ---------- */
const TABS = [['relations','Triplets', () => REL.length], ['entities','Entités', () => D.entities.length], ['matrix','Matrice', null], ['article','Article', null]];
if (REJ.length) TABS.push(['rejected','Candidats rejetés', () => REJ.length]);
function renderTabs(){
  $('tabs').innerHTML = TABS.map(([k, l, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${l}${n ? `<span class="n">${n()}</span>` : ''}</button>`).join('');
}
function setTab(k){
  state.tab = k; renderTabs();
  $('layout').classList.toggle('full', !['relations','entities'].includes(k));
  if (k !== 'article') $('panel').hidden = true;
  syncTypeFilter(); renderTab(); window.scrollTo({top:0});
}
function focusBar(){
  return state.only ? `<div class="focusbar"><span>Affichage limité : ${esc(state.onlyLabel)}</span><button type="button" class="mini" data-act="clear-only">Tout afficher</button></div>` : '';
}
function globalHtml(){
  if (!D.global_flags.length) return '';
  return `<section class="global"><h2>Contrôles globaux du bundle</h2>${flagsHtml(D.global_flags)}</section>`;
}
function sortItems(list, kind){
  const sev = (a, b) => b.severity - a.severity;
  if (F.sort === 'bundle') return list;
  if (kind === 'relation'){
    const src = (a, b) => typeRank(typeOf(a.source_ref)) - typeRank(typeOf(b.source_ref)) || nameOf(a.source_ref).localeCompare(nameOf(b.source_ref));
    const tgt = (a, b) => typeRank(typeOf(a.target_ref)) - typeRank(typeOf(b.target_ref)) || nameOf(a.target_ref).localeCompare(nameOf(b.target_ref));
    if (F.sort === 'source') return list.sort((a, b) => src(a, b) || tgt(a, b));
    if (F.sort === 'target') return list.sort((a, b) => tgt(a, b) || src(a, b));
    return list.sort((a, b) => sev(a, b) || src(a, b) || tgt(a, b));
  }
  const nm = (a, b) => typeRank(a.type) - typeRank(b.type) || (a.ext_id||a.name).localeCompare(b.ext_id||b.name);
  return list.sort((a, b) => F.sort === 'alerts' ? (sev(a, b) || nm(a, b)) : nm(a, b));
}
function renderRelations(){
  const list = sortItems(REL.filter(relVisible), 'relation');
  let html = globalHtml() + focusBar() + `<div class="listhead"><span>${list.length} / ${REL.length} relations affichées</span></div>`;
  if (!list.length) return html + '<div class="empty">Aucune relation ne correspond aux filtres.</div>';
  const groupKey = F.sort === 'source' ? r => r.source_ref : F.sort === 'target' ? r => r.target_ref : null;
  let last = null;
  for (const r of list){
    if (groupKey && groupKey(r) !== last){ last = groupKey(r); html += `<h3 class="group">${chip(last, true)}</h3>`; }
    html += relCard(r);
  }
  return html;
}
function renderEntities(){
  const list = sortItems(D.entities.filter(entVisible), 'entity');
  let html = focusBar() + `<div class="listhead"><span>${list.length} / ${D.entities.length} entités affichées</span></div>`;
  if (!list.length) return html + '<div class="empty">Aucune entité ne correspond aux filtres.</div>';
  let last = null;
  for (const e of list){
    if (F.sort !== 'alerts' && e.type !== last){ last = e.type; html += `<h3 class="group">${esc(e.type)}</h3>`; }
    html += entCard(e);
  }
  return html;
}
function renderRejected(){
  return `<div class="listhead"><span>${REJ.length} candidats envisagés puis écartés à l’annotation. Confirmez le rejet ou demandez l’intégration au gold.</span></div>` + REJ.map(rejCard).join('');
}
function renderMatrix(){
  const uses = REL.filter(r => typeOf(r.target_ref) === 'attack-pattern');
  if (!uses.length){ $('main').innerHTML = '<div class="empty">Aucune relation vers un attack-pattern.</div>'; return; }
  const srcs = [...new Set(uses.map(r => r.source_ref))].sort((a, b) => typeRank(typeOf(a)) - typeRank(typeOf(b)) || nameOf(a).localeCompare(nameOf(b)));
  const aps = [...new Set(uses.map(r => r.target_ref))].sort((a, b) => nameOf(a).localeCompare(nameOf(b), undefined, {numeric:true}));
  const cell = new Map(uses.map(r => [r.source_ref + '|' + r.target_ref, r]));
  const head = `<tr><th class="rowh">Technique</th>${srcs.map(s => `<th>${chip(s, true)}</th>`).join('')}<th>Sources</th></tr>`;
  const rows = aps.map(ap => {
    const e = ENT.get(ap) || {name: ap, tactics: []};
    let n = 0;
    const tds = srcs.map(s => {
      const r = cell.get(s + '|' + ap); if (!r) return '<td></td>';
      n++;
      const v = verdictOf(r.id), lab = r.label === 'gold:required' ? 'req' : 'acc';
      const vm = v === 'pending' ? '' : `<span class="vm ${v}">${VERDICTS[v].icon}</span>`;
      const tip = nameOf(s) + ' → ' + nameOf(ap) + '\n' + (r.quotes[0] ? '« ' + r.quotes[0].text + ' »' : 'sans citation');
      return `<td><button type="button" class="cell${hasAlert(r) ? ' al' : ''}" data-act="focus" data-ids="${esc(r.id)}" title="${esc(tip)}"><span class="b ${lab}">${lab === 'req' ? 'R' : 'A'}</span>${vm}</button></td>`;
    }).join('');
    const tip = e.attack && e.attack.description ? e.attack.description.split(/\n\s*\n/)[0] : '';
    return `<tr><th class="rowh" title="${esc(tip)}"><span class="ntype" style="font:600 11px var(--mono);color:var(--c-attack-pattern)">${esc(e.ext_id || '')}</span><span class="tname">${esc(e.name)}</span><span class="ttac">${esc((e.tactics||[]).join(' · '))}</span></th>${tds}<td>${n}</td></tr>`;
  }).join('');
  $('main').innerHTML = `<div class="legend"><span><span class="cell"><span class="b req">R</span></span> required</span><span><span class="cell"><span class="b acc">A</span></span> acceptable</span><span><span class="cell al"><span class="b req">R</span></span> relation avec alerte</span><span><b class="vm ok">✓</b> <b class="vm fix">~</b> <b class="vm ko">✗</b> verdict</span><span>Cliquer une case ouvre la relation.</span></div>
    <div class="matrix-wrap"><table class="matrix"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- Article annoté ---------- */
let ARTICLE_HTML = null; const ANCHOR = new Map();
function buildArticle(){
  const iv = [];
  for (const it of [...D.entities, ...REL]) (it.quotes || []).forEach((q, qi) => q.anchor.occurrences.forEach((o, oi) => iv.push({s:o.start, e:o.end, id:it.id, key:it.id + '|' + qi + '|' + oi})));
  iv.forEach((v, i) => ANCHOR.set(v.key, i));
  const pts = [...new Set(iv.flatMap(v => [v.s, v.e]))].sort((a, b) => a - b);
  const startsAt = new Map(); iv.forEach((v, i) => { if (!startsAt.has(v.s)) startsAt.set(v.s, []); startsAt.get(v.s).push(i); });
  let html = '', ls = 0;
  for (const line of TEXT.split('\n')){
    const le = ls + line.length;
    const m = /^(#{1,6})\s/.exec(line);
    const cls = m ? 'l h' + m[1].length : (/^\*\*[^*]+\*\*\s*$/.test(line) ? 'l hb' : 'l');
    const cuts = [ls, ...pts.filter(p => p > ls && p < le), le];
    let inner = '';
    for (let k = 0; k < cuts.length - 1; k++){
      const a = cuts[k], b = cuts[k + 1];
      (startsAt.get(a) || []).forEach(i => inner += `<span id="anc-${i}"></span>`);
      if (a === b) continue;
      const seg = esc(TEXT.slice(a, b));
      const cover = []; iv.forEach((v, i) => { if (v.s <= a && v.e >= b) cover.push(i); });
      const ids = [...new Set(cover.map(i => iv[i].id))];
      inner += ids.length ? `<mark class="am${ids.length > 1 ? ' multi' : ''}" data-ids="${esc(ids.join(' '))}" data-k="${cover.join(' ')}">${seg}</mark>` : seg;
    }
    html += `<div class="${cls}">${inner}</div>`;
    ls = le + 1;
  }
  ARTICLE_HTML = html;
}
function renderArticle(){
  if (ARTICLE_HTML === null) buildArticle();
  $('main').innerHTML = `<div class="legend"><span><mark class="am">passage cité</mark> par un objet</span><span><mark class="am multi">passage cité</mark> par plusieurs objets</span><span>Cliquer un passage liste les objets qui le citent.</span></div><div class="article">${ARTICLE_HTML}</div>`;
}
function showPanel(ids){
  const items = ids.map(id => ITEMS.get(id)).filter(Boolean);
  const body = items.map(it => `<div class="pi"><div class="triplet">${it.kind === 'relation' ? tripletHtml(it, true) : chip(it.id, true)}<span class="spacer"></span>${labelBadge(it.label)}</div><div><button type="button" class="mini" data-act="focus" data-ids="${esc(it.id)}">Ouvrir dans la revue</button></div></div>`).join('');
  const p = $('panel');
  p.innerHTML = `<h2><span>${items.length} objet${items.length>1?'s':''} citant ce passage</span><button type="button" class="mini" data-act="close-panel" aria-label="Fermer">✕</button></h2>${body}`;
  p.hidden = false;
}
function gotoAnchor(itemId, qi, oi){
  setTab('article');
  const i = ANCHOR.get(itemId + '|' + qi + '|' + oi);
  const el = i != null && document.getElementById('anc-' + i);
  if (!el) return;
  // Surligne les segments de cette occurrence précise.
  const k = String(i);
  document.querySelectorAll('.article mark.am').forEach(m => m.classList.toggle('hot', m.dataset.k.split(' ').includes(k)));
  el.scrollIntoView({block:'center'});
  showPanel([itemId]);
}

function focusItems(ids, label){
  const first = ITEMS.get(ids[0]); if (!first) return;
  const tab = first.kind === 'relation' ? 'relations' : first.kind === 'rejected' ? 'rejected' : 'entities';
  state.only = ids; state.onlyLabel = label || (ids.length === 1 ? (first.kind === 'relation' ? nameOf(first.source_ref) + ' → ' + nameOf(first.target_ref) : nameOf(first.id)) : ids.length + ' objets');
  setTab(tab);
  const card = byId(ids[0]); if (card){ setCur(card); card.classList.add('flash'); }
}
function renderTab(){
  const t = state.tab;
  if (t === 'relations') $('main').innerHTML = renderRelations();
  else if (t === 'entities') $('main').innerHTML = renderEntities();
  else if (t === 'rejected') $('main').innerHTML = renderRejected();
  else if (t === 'matrix') renderMatrix();
  else if (t === 'article') renderArticle();
  autosize();
}
function autosize(){ document.querySelectorAll('.vcomment').forEach(t => { t.style.height = 'auto'; t.style.height = Math.max(34, t.scrollHeight + 2) + 'px'; }); }

/* ---------- En-tête : titre, statistiques, progression ---------- */
function renderHeader(){
  const m = D.meta;
  $('r-title').innerHTML = m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">${esc(m.report_name)} ↗</a>` : esc(m.report_name);
  $('r-files').textContent = `${m.bundle_file} · ${m.article_file} · ATT&CK ${m.attack_version || 'non chargé'}${m.declared_attack_version ? ' (déclaré : ' + m.declared_attack_version + ')' : ''} · généré le ${m.generated}`;
  const all = [...D.entities, ...REL];
  const cnt = lvl => all.reduce((n, it) => n + (it.flags.some(f => f.level === lvl) ? 1 : 0), 0);
  const req = REL.filter(r => r.label === 'gold:required').length, acc = REL.filter(r => r.label === 'gold:acceptable').length;
  $('stats').innerHTML = `<span class="stat"><b>${D.entities.length}</b> entités</span><span class="stat"><b>${REL.length}</b> relations</span><span class="stat"><b>${req}</b> required</span><span class="stat"><b>${acc}</b> acceptable</span>
    <button type="button" class="stat s-error" data-act="alerts" title="Objets avec au moins une erreur"><b>${cnt('error')}</b> en erreur</button>
    <button type="button" class="stat s-warn" data-act="alerts" title="Objets avec au moins un avertissement"><b>${cnt('warn')}</b> avec avertissement</button>`;
  $('reviewer').value = S.reviewer || '';
  renderProgress();
}
function renderProgress(){
  const ids = [...ITEMS.keys()], tot = ids.length;
  const c = {ok:0, fix:0, ko:0}; ids.forEach(id => { const v = verdictOf(id); if (c[v] != null) c[v]++; });
  const done = c.ok + c.fix + c.ko;
  $('bar').innerHTML = ['ok','fix','ko'].map(k => `<span class="p-${k}" style="width:${tot ? c[k]/tot*100 : 0}%"></span>`).join('');
  $('progress-txt').textContent = `${done}/${tot} revus · ${c.ok} correct · ${c.fix} à corriger · ${c.ko} non justifiés`;
}

/* ---------- Navigation clavier ---------- */
function setCur(card){
  document.querySelectorAll('.card.cur').forEach(c => c.classList.remove('cur'));
  card.classList.add('cur'); card.focus({preventScroll:true}); card.scrollIntoView({block:'nearest'});
}
document.addEventListener('keydown', e => {
  const tg = e.target;
  if (tg.matches && tg.matches('input, textarea, select')){ if (e.key === 'Escape') tg.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const cards = [...document.querySelectorAll('#main .card')];
  if (!cards.length) return;
  let i = cards.indexOf(document.querySelector('#main .card.cur'));
  if (e.key === 'j' || e.key === 'k'){
    i = e.key === 'j' ? Math.min(cards.length - 1, i + 1) : Math.max(0, i - 1);
    setCur(cards[i]); e.preventDefault();
  } else if (['1','2','3'].includes(e.key) && i > -1){
    const it = ITEMS.get(cards[i].dataset.card);
    const k = Object.keys(it.kind === 'rejected' ? REJ_VERDICTS : VERDICTS)[+e.key - 1];
    if (k) setVerdict(it.id, k);
  } else if (e.key === 'c' && i > -1){
    const t = cards[i].querySelector('textarea'); if (t){ t.focus(); e.preventDefault(); }
  }
});

/* ---------- Événements ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]'); if (tab){ clearOnly(); setTab(tab.dataset.tab); return; }
  const mk = e.target.closest('.article mark.am'); if (mk){ showPanel(mk.dataset.ids.split(' ')); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, card = b.closest('[data-card]');
  if (act === 'verdict') setVerdict(card.dataset.card, b.dataset.v);
  else if (act === 'occ' || act === 'more' || act === 'goto'){
    const box = b.closest('.quote'), item = ITEMS.get(box.dataset.item), qi = +box.dataset.q;
    let oi = +box.dataset.o, r = +box.dataset.r;
    if (act === 'goto'){ gotoAnchor(item.id, qi, oi); return; }
    if (act === 'occ') oi = Math.max(0, Math.min(item.quotes[qi].anchor.occurrences.length - 1, oi + +b.dataset.d));
    else r = r > CTX ? CTX : CTX_MORE;
    box.dataset.o = oi; box.dataset.r = r; box.innerHTML = quoteInner(item, qi, oi, r);
  }
  else if (act === 'focus') focusItems(b.dataset.ids.split(' '));
  else if (act === 'ent-rels'){ const id = b.dataset.id; focusItems(REL.filter(r => r.source_ref === id || r.target_ref === id).map(r => r.id), 'relations de ' + nameOf(id)); }
  else if (act === 'clear-only'){ clearOnly(); renderTab(); }
  else if (act === 'close-panel'){ $('panel').hidden = true; document.querySelectorAll('mark.am.hot').forEach(m => m.classList.remove('hot')); }
  else if (act === 'alerts'){ $('f-alerts').checked = true; F.alerts = true; clearOnly(); setTab(state.tab === 'entities' ? 'entities' : 'relations'); }
});
document.addEventListener('input', e => {
  if (e.target.matches('.vcomment')){
    const id = e.target.closest('[data-card]').dataset.card, item = ITEMS.get(id);
    const cur = S.verdicts[id] || {}; cur.c = e.target.value; cur.t = new Date().toISOString(); if (!cur.fp) cur.fp = item.fp;
    S.verdicts[id] = cur; save();
    e.target.style.height = 'auto'; e.target.style.height = Math.max(34, e.target.scrollHeight + 2) + 'px';
  } else if (e.target.id === 'reviewer'){ S.reviewer = e.target.value; save(); }
});

/* ---------- Export / import ---------- */
function describe(it){
  if (it.kind === 'relation') return {source: nameOf(it.source_ref), relationship_type: it.relationship_type, target: nameOf(it.target_ref), source_ref: it.source_ref, target_ref: it.target_ref};
  if (it.kind === 'rejected') return {candidat: it.candidat};
  return {type: it.type, name: it.name, ext_id: it.ext_id};
}
$('btn-export').addEventListener('click', () => {
  const rows = [];
  for (const it of ITEMS.values()){
    const v = S.verdicts[it.id];
    if (!v || (!v.v && !v.c)) continue;
    rows.push(Object.assign({id: it.id, kind: it.kind}, describe(it), {label: it.label || null, verdict: v.v || null, comment: v.c || '', at: v.t || null, stale: !!(v.fp && v.fp !== it.fp)}));
  }
  const c = {ok:0, fix:0, ko:0}; rows.forEach(r => { if (c[r.verdict] != null) c[r.verdict]++; });
  const out = {bundle_id: D.meta.key, bundle_file: D.meta.bundle_file, article_file: D.meta.article_file, reviewer: S.reviewer || null,
    exported_at: new Date().toISOString(), summary: Object.assign({total: ITEMS.size, pending: ITEMS.size - c.ok - c.fix - c.ko}, c), verdicts: rows};
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = D.meta.bundle_stem + '.review.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('file-import').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    let n = 0;
    for (const r of data.verdicts || []){
      if (!ITEMS.has(r.id)) continue;
      S.verdicts[r.id] = {v: r.verdict || undefined, c: r.comment || '', t: r.at || null, fp: r.stale ? null : ITEMS.get(r.id).fp}; n++;
    }
    if (data.reviewer && !S.reviewer) S.reviewer = data.reviewer;
    save(); renderHeader(); renderTab();
    alert(n + ' verdict(s) importé(s).');
  } catch (err){ alert('Fichier illisible : ' + err.message); }
  e.target.value = '';
});

/* ---------- Thème ---------- */
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { theme = localStorage.getItem('stix-review:theme') || 'auto'; } catch (e) {}
function applyTheme(){ if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme); $('btn-theme').title = 'Thème : ' + theme; }
$('btn-theme').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem('stix-review:theme', theme); } catch (e) {} applyTheme(); });

/* ---------- Démarrage ---------- */
function measure(){ document.documentElement.style.setProperty('--hdr', $('top').offsetHeight + 'px'); }
window.addEventListener('resize', measure);
const initial = location.hash.slice(1);
applyTheme(); renderHeader(); renderTabs(); setupFilters(); setTab(TABS.some(t => t[0] === initial) ? initial : 'relations'); measure();
})();
</script>
